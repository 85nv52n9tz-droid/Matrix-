<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#050b17"><title>THE MATRIX | World Map Development</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#050b17;color:#e5f5ff}*{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 20%,#142940,#050b17 70%)}header{padding:env(safe-area-inset-top) 12px 8px;border-bottom:1px solid #1b4c66;background:#071525}header h1{font-size:16px;letter-spacing:3px;margin:8px 0 4px;color:#75e9ff}header small{color:#84a4b9}#status{display:flex;justify-content:space-between;font-size:11px;color:#8bd8e7}#map{position:relative;flex:1;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at center,#14364a 0%,#0a1b2c 55%,#07121f 100%)}#terrain{position:absolute;inset:0;width:100%;height:100%}#field{position:absolute;width:1200px;height:1200px;transform-origin:0 0;background-image:linear-gradient(#3c8ca21a 1px,transparent 1px),linear-gradient(90deg,#3c8ca21a 1px,transparent 1px);background-size:40px 40px}#field:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 35% 40%,#06b6d41b,transparent 35%),radial-gradient(circle at 70% 60%,#ef44441a,transparent 25%);pointer-events:none}.node{position:absolute;transform:translate(-50%,-50%);min-width:44px;min-height:44px;border:1px solid #4a7b8b;background:#091d2de8;border-radius:12px;box-shadow:0 0 18px #00c9ff33;display:grid;place-items:center;font-size:21px}.node span{font-size:9px;display:block;color:#d3faff}.node.me{border-color:#22d3ee;box-shadow:0 0 20px #22d3ee99}.node.enemy{border-color:#e66b79}.node.alliance{border-color:#a78bfa}.node.resource{border-color:#36d399}.territory{position:absolute;border:2px solid #2dd4bf;border-radius:14px;background:#14b8a626;pointer-events:none;box-shadow:inset 0 0 25px #2dd4bf22}.toolbar{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:7px}.toolbar button,.panel button,.nav button{background:#0a2034;border:1px solid #25516c;border-radius:9px;padding:9px}.toolbar button{min-width:40px}.panel{position:absolute;bottom:12px;left:10px;right:10px;padding:12px;background:#071827ef;border:1px solid #28728b;border-radius:14px;box-shadow:0 0 30px #0009;max-height:44%;overflow:auto}.panel h2{font-size:14px;color:#75e9ff;margin:0 0 6px}.panel p{font-size:12px;color:#a4c4d2;margin:6px 0}.actions{display:flex;flex-wrap:wrap;gap:6px}.actions button{font-size:12px;padding:8px}.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:#071320;border-top:1px solid #1f4d64}.nav button{padding:8px 1px;font-size:10px;display:flex;flex-direction:column;gap:4px;align-items:center}.nav button b{font-size:19px}.nav button.active{border-color:#4bdcf1;color:#76e7ff;background:#12354a}.notice{font-size:11px;color:#fbbf70;padding:4px 12px;background:#241b12}.tag{display:inline-block;border:1px solid #365d73;border-radius:6px;padding:3px 6px;margin:2px;font-size:10px;color:#aad7e5}</style></head>
<body><div id="app"><header><div id="status"><span>◈ DEVELOPMENT SANDBOX</span><span id="clock">SIMULATION</span></div><h1>THE MATRIX · WORLD</h1><small id="coords">Sector 043 · Coordinates 600,600 · HQ 5</small></header><div class="notice">Prototype only · No live multiplayer or live-game changes</div><main id="map"><div id="field"></div><div class="toolbar"><button onclick="zoom(1.2)">＋</button><button onclick="zoom(.83)">－</button><button onclick="center()">⌖</button></div><section class="panel" id="panel"></section></main><nav class="nav" id="nav"></nav></div>
<script>
const key='matrix-world-sandbox-v1',stored=JSON.parse(localStorage.getItem(key)||'null');let state=stored||{hq:5,energy:150,teleports:3,allianceCredits:800,personalCredits:300,alliances:[],territories:[],marches:[],gathered:0,day:0};let selected=null,tab='World',scale=.72,offsetX=0,offsetY=0,drag=null;const field=document.getElementById('field'),panel=document.getElementById('panel'),map=document.getElementById('map');const save=()=>localStorage.setItem(key,JSON.stringify(state));const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
let nodes=[{id:'me',x:600,y:600,type:'me',name:'YOUR HQ',level:state.hq},{id:'a',x:420,y:420,type:'alliance',name:'NEON Collective',level:5},{id:'b',x:850,y:780,type:'alliance',name:'Red Protocol',level:6},{id:'p1',x:680,y:460,type:'enemy',name:'Cipher',level:4},{id:'p2',x:330,y:720,type:'enemy',name:'ZeroByte',level:6},{id:'p3',x:900,y:350,type:'enemy',name:'NightShift',level:7},{id:'r1',x:520,y:320,type:'resource',name:'Data Cache',level:2},{id:'r2',x:780,y:640,type:'resource',name:'Power Relay',level:3},{id:'r3',x:270,y:530,type:'resource',name:'Quantum Deposit',level:4}];let activeTimers=[];function distance(a,b){return Math.round(Math.hypot(a.x-b.x,a.y-b.y))}function duration(n){return Math.max(12,Math.round(distance(nodes[0],n)/9))}function march(kind,n){if(state.marches.some(m=>m.target===n.id&&m.kind===kind)){message('A '+kind+' mission is already travelling to this target.');return}let cost=kind==='Attack'?30:kind==='Scout'?10:15;if(state.energy<cost){message('Insufficient network energy.');return}state.energy-=cost;state.marches.push({kind,target:n.id,arrive:Date.now()+duration(n)*1000,stage:'outbound'});save();message(kind+' dispatched · ETA '+duration(n)+'s')}function message(t){panel.innerHTML='<h2>◈ COMMAND UPDATE</h2><p>'+t+'</p><div class="actions"><button onclick="renderPanel()">Close</button></div>'}function renderMap(){field.querySelectorAll('.node,.territory').forEach(e=>e.remove());state.territories.forEach(t=>{let n=nodes.find(n=>n.id===t.id);if(!n)return;let e=document.createElement('div');e.className='territory';e.style.cssText='left:'+(n.x-70)+'px;top:'+(n.y-70)+'px;width:140px;height:140px';field.append(e)});nodes.forEach(n=>{let b=document.createElement('button');b.className='node '+n.type;b.style.left=n.x+'px';b.style.top=n.y+'px';b.innerHTML=({me:'⌂',enemy:'⬡',alliance:'◈',resource:'◆'})[n.type]+'<span>'+n.name+'</span>';b.onclick=()=>{selected=n;renderPanel()};field.append(b)});applyTransform()}function applyTransform(){field.style.transform='translate('+offsetX+'px,'+offsetY+'px) scale('+scale+')';document.getElementById('coords').textContent='Sector 043 · Coordinates '+Math.round((map.clientWidth/2-offsetX)/scale)+','+Math.round((map.clientHeight/2-offsetY)/scale)+' · HQ '+state.hq}function center(){offsetX=map.clientWidth/2-600*scale;offsetY=map.clientHeight/2-600*scale;applyTransform()}function zoom(f){scale=Math.min(1.8,Math.max(.35,scale*f));center()}function renderNav(){document.getElementById('nav').innerHTML=[['World','◎'],['Alliance','⬡'],['Gather','◆'],['Marches','➤'],['Locate','⌕']].map(([name,icon])=>'<button class="'+(tab===name?'active':'')+'" onclick="switchTab(\''+name+'\')"><b>'+icon+'</b>'+name+'</button>').join('')}function switchTab(t){tab=t;selected=null;renderNav();renderPanel()}function renderPanel(){if(selected){let n=selected,buttons=n.type==='enemy'?'<button onclick="march(\'Scout\',selected)">◉ Scout</button><button onclick="march(\'Attack\',selected)">⚔ Attack</button>':n.type==='resource'?'<button onclick="march(\'Gather\',selected)">◆ Gather</button>':n.type==='alliance'?'<button onclick="claim()">⬡ Build Territory</button>': '<button onclick="teleport()">⌖ Teleport HQ</button>';panel.innerHTML='<h2>'+n.name+'</h2><p>'+n.type.toUpperCase()+' · Level '+n.level+' · '+distance(nodes[0],n)+' units from HQ</p><div class="actions">'+buttons+'<button onclick="selected=null;renderPanel()">Close</button></div>';return}let html={World:'<h2>◈ WORLD COMMAND</h2><p>Select a base or resource node to scout, attack, gather or expand. Drag to pan the world.</p><span class="tag">HQ '+state.hq+'</span><span class="tag">Network energy '+state.energy+'</span><span class="tag">Teleport charges '+state.teleports+'</span>',Alliance:'<h2>⬡ ALLIANCE TERRITORY</h2><p>Territories begin unclaimed. Only connected expansion is valid. Simulated alliances grow gradually.</p><span class="tag">Alliance credits '+state.allianceCredits+'</span><span class="tag">Territory nodes '+state.territories.length+'</span><div class="actions"><button onclick="selected=nodes[1];renderPanel()">Choose Alliance HQ</button></div>',Gather:'<h2>◆ RESOURCE NETWORK</h2><p>Gather from personal resource nodes using timed marches. Alliance nodes feed shared alliance storage.</p><span class="tag">Personal credits '+state.personalCredits+'</span><span class="tag">Gathered '+state.gathered+'</span>',Marches:'<h2>➤ ACTIVE OPERATIONS</h2><p>Network dispatches, arrivals and return journeys continue while the page is open.</p>'+ (state.marches.map(m=>'<p>'+m.kind+' → '+m.target+' · '+m.stage+' · '+Math.max(0,Math.ceil((m.arrive-Date.now())/1000))+'s</p>').join('')||'<p>No active marches</p>'),Locate:'<h2>⌕ COORDINATE CONTROL</h2><p>Recenter your HQ or move it to an open location using a teleport charge.</p><div class="actions"><button onclick="center()">Locate HQ</button><button onclick="teleport()">Teleport HQ</button></div>'};panel.innerHTML=html[tab]}function claim(){let n=selected;if(!n||n.type!=='alliance')return;if(state.allianceCredits<200){message('Not enough alliance credits.');return}if(state.territories.some(t=>t.id===n.id)){message('This location is already claimed.');return}state.allianceCredits-=200;state.territories.push({id:n.id});save();renderMap();message('Alliance territory established. Further territory must connect to existing territory.')}function teleport(){if(state.teleports<1){message('No teleport charges available.');return}state.teleports--;nodes[0].x=rnd(430,770);nodes[0].y=rnd(430,770);save();renderMap();center();message('HQ relocated. One teleport charge consumed.')}function tick(){let now=Date.now(),changed=false;state.marches.forEach(m=>{if(now<m.arrive)return;let n=nodes.find(n=>n.id===m.target);if(m.stage==='outbound'){m.stage='returning';m.arrive=now+duration(n)*1000;if(m.kind==='Gather'){state.personalCredits+=80;state.gathered+=80}else if(m.kind==='Scout'){state.lastReport='Recon '+n.name+': HQ '+n.level+' · threat '+(n.level>state.hq?'elevated':'manageable')}else if(m.kind==='Attack'){state.lastReport='Attack on '+n.name+': '+(n.level<=state.hq+1?'engagement won':'defenders resisted');if(n.level<=state.hq+1)state.personalCredits+=40}changed=true}else{m.done=true;changed=true}});if(changed){state.marches=state.marches.filter(m=>!m.done);save()}document.getElementById('clock').textContent=new Date().toLocaleTimeString();if(tab==='Marches'&&!selected)renderPanel()}map.addEventListener('pointerdown',e=>{if(e.target.closest('button,.panel'))return;drag={x:e.clientX,y:e.clientY,ox:offsetX,oy:offsetY};map.setPointerCapture(e.pointerId)});map.addEventListener('pointermove',e=>{if(!drag)return;offsetX=drag.ox+e.clientX-drag.x;offsetY=drag.oy+e.clientY-drag.y;applyTransform()});map.addEventListener('pointerup',()=>drag=null);map.addEventListener('pointercancel',()=>drag=null);renderNav();renderMap();center();renderPanel();setInterval(tick,1000);
</script></body></html>

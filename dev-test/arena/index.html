<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>THE MATRIX | Cyber Arena Dev</title><style>
*{box-sizing:border-box}body{margin:0;background:#030b17;color:#c7f7ff;font:12px system-ui}header{padding:18px;text-align:center;background:radial-gradient(ellipse,#14435a,#040b17);border-bottom:1px solid #197b9d}h1{color:#64eaff;letter-spacing:3px;text-shadow:0 0 20px #18caff}h2{font-size:14px;color:#68e9ff}small{color:#83aabf}main{padding:12px;max-width:650px;margin:auto;padding-bottom:95px}.stats,.formation,.tabs{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stats{grid-template-columns:repeat(3,1fr)}.stats div,.panel,.slot,.entry{border:1px solid #22627c;background:#091e30;border-radius:9px;padding:12px}.stats b{display:block;color:#65f4ff;margin-top:7px}.panel{margin-top:12px}.formation{margin:12px 0}.slot{min-height:110px;text-align:center;background:linear-gradient(140deg,#0b3446,#091323);color:#bdf8ff}.slot strong,.slot small{display:block;margin:8px 0}.entry{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0}.entry div{display:grid;gap:4px}button{font:inherit;color:#6cf4ff;border:1px solid #299ab5;background:#0b3144;border-radius:8px;padding:11px;cursor:pointer}button:disabled{opacity:.35}.tabs{grid-template-columns:repeat(4,1fr);margin-top:12px}.tabs button{padding:10px 2px;font-size:10px}.active{background:#17627a}p{color:#8fb6c6;line-height:1.5}.back{display:inline-block;margin:10px;color:#8ceeff}#modal{position:fixed;inset:0;background:#010710ee;display:none;overflow:auto;padding:30px 12px;z-index:10}#modal.open{display:block}#modal .panel{max-width:550px;margin:auto}
</style></head><body><header><small>THE MATRIX // DEVELOPMENT SYSTEM</small><h1>CYBER ARENA</h1><small>4 OPERATIVES · AUTOMATED COMBAT</small></header><a class="back" href="../index.html">← DEVELOPMENT HUB</a><main id="main"></main><div id="modal"></div><script>
const crew=[['Cipher','Guardian',1050,1700,6500,'Firewall Shield'],['Nyx','Assault',1800,850,4500,'Zero-Day Strike'],['Ghost','Support',1250,1050,5300,'Recovery Protocol'],['Vex','Assault',1600,900,4700,'EMP Burst'],['Echo','Guardian',950,1650,6800,'Countermeasure'],['Nova','Support',1450,980,5000,'Overclock']];
let s;try{s=JSON.parse(localStorage.getItem('matrix_arena_dev')||'null')}catch{}s=s||{team:[0,1,2,3],defence:[0,4,2,3],gear:{},credits:200,rank:200,attempts:5,history:[]};let tab='attack',editing=null;const $=id=>document.getElementById(id),power=i=>Math.round(crew[i][2]*2+crew[i][3]+crew[i][4]*.4+(s.gear[i]||0)*220),total=a=>a.reduce((x,i)=>x+power(i),0),save=()=>localStorage.setItem('matrix_arena_dev',JSON.stringify(s)),button=(t,fn)=>'<button onclick="'+fn+'">'+t+'</button>';
function formation(k){return '<div class="formation">'+s[k].map((i,j)=>'<button class="slot" onclick="pick(\''+k+'\','+j+')"><span style="font-size:24px">'+(j<2?'⬡':'✦')+'</span><strong>'+crew[i][0]+'</strong><small>'+(j<2?'FRONTLINE':'BACKLINE')+' · '+crew[i][1]+'</small><b>⚡ '+power(i).toLocaleString()+'</b></button>').join('')+'</div>'}
function render(){let html='<div class="stats"><div>RANK<b>#'+s.rank+'</b></div><div>CREDITS<b>◈ '+s.credits+'</b></div><div>ATTEMPTS<b>'+s.attempts+'/5</b></div></div><div class="tabs">'+[['attack','ATTACK'],['defence','DEFENCE'],['roster','ROSTER'],['reports','REPORTS']].map(x=>'<button class="'+(tab===x[0]?'active':'')+'" onclick="tab=\''+x[0]+'\';render()">'+x[1]+'</button>').join('')+'</div>';
if(tab==='attack'||tab==='defence'){const k=tab==='attack'?'team':'defence';html+='<section class="panel"><h2>'+tab.toUpperCase()+' FORMATION · POWER '+total(s[k]).toLocaleString()+'</h2>'+formation(k)+'<p>Tap a crew member to select a replacement. Bonuses shown here include Arena gear. Gear upgrades are managed in Roster.</p></section>';if(tab==='attack')html+='<section class="panel"><h2>CHALLENGE OPPONENTS</h2>'+[['PHANTOM',165,14500],['BLACK ICE',143,18100],['ZERO DAY',119,22000]].map((x,i)=>'<div class="entry"><div><b>'+x[0]+'</b><small>RANK #'+x[1]+' · POWER '+x[2].toLocaleString()+'</small></div>'+button('FIGHT','fight('+i+')')+'</div>').join('')+'</section>'}
if(tab==='roster')html+='<section class="panel"><h2>ARENA EQUIPMENT · DEVELOPMENT</h2><p>Test upgrades here. This is a separate development save, not connected to the live crew roster.</p>'+crew.map((c,i)=>'<div class="entry"><div><b>'+c[0]+' · '+c[1]+'</b><small>'+c[5]+' · Gear +'+(s.gear[i]||0)+' · Power '+power(i)+'</small></div>'+button('UPGRADE ◈'+(60+(s.gear[i]||0)*40),'upgrade('+i+')')+'</div>').join('')+'</section>';
if(tab==='reports')html+='<section class="panel"><h2>BATTLE REPORTS</h2>'+(s.history.length?s.history.map(x=>'<div class="entry"><div><b>'+(x.win?'VICTORY':'DEFEAT')+' vs '+x.name+'</b><small>'+x.date+'</small></div></div>').join(''):'<p>No battles yet.</p>')+'</section>';$('main').innerHTML=html}
function pick(k,j){editing=[k,j];$('modal').className='open';$('modal').innerHTML='<div class="panel"><h2>SELECT OPERATIVE</h2><p>Combat bonuses only · equipment upgrades are in Roster.</p>'+crew.map((c,i)=>'<div class="entry"><div><b>'+c[0]+' · '+c[1]+'</b><small>ATK '+(c[2]+(s.gear[i]||0)*70)+' · DEF '+(c[3]+(s.gear[i]||0)*55)+' · HP '+(c[4]+(s.gear[i]||0)*180)+'</small><small>'+c[5]+'</small></div><button '+(s[k].includes(i)&&s[k][j]!==i?'disabled':'')+' onclick="choose('+i+')">SELECT</button></div>').join('')+button('CLOSE','closeModal()')+'</div>'}
function closeModal(){$('modal').className='';editing=null}function choose(i){s[editing[0]][editing[1]]=i;save();closeModal();render()}function upgrade(i){const lv=s.gear[i]||0,cost=60+lv*40;if(lv>=10)return alert('Test maximum reached');if(s.credits<cost)return alert('Insufficient Arena Credits');s.credits-=cost;s.gear[i]=lv+1;save();render()}
function fight(i){if(!s.attempts)return alert('No challenges remaining in this test.');const o=[['PHANTOM',165,14500],['BLACK ICE',143,18100],['ZERO DAY',119,22000]][i];s.attempts--;const win=Math.random()<Math.max(.2,Math.min(.8,total(s.team)/(total(s.team)+o[2])));if(win){s.credits+=50;s.rank=Math.min(s.rank,o[1])}s.history.unshift({name:o[0],win,date:new Date().toLocaleString('en-GB')});save();alert(win?'VICTORY · +50 Arena Credits':'DEFEAT · Try another formation');tab='reports';render()}render();
</script></body></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Cyber Prestige</title><style>
*{box-sizing:border-box}body{margin:0;background:#030817;color:#e9f7ff;font:15px system-ui}main{max-width:540px;margin:auto;padding:14px 14px 80px}a{color:#77eaff}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:12px 0 4px}small{color:#9bb4d4}.hero{position:relative;overflow:hidden;border:1px solid #7966ff;background:radial-gradient(ellipse at 70% 70%,#49328c,#121b43 60%,#080e24);padding:18px;min-height:260px;border-radius:18px}.hero p{max-width:280px;position:relative;z-index:1}.robot{display:block;width:190px;margin:-12px 0 -15px auto;filter:drop-shadow(0 0 15px #a96aff);animation:float 3s ease-in-out infinite}@keyframes float{50%{transform:translateY(-7px)}}.tabs{display:flex;gap:5px;margin:14px 0}.tabs button{flex:1;font-size:12px;padding:12px 4px}button{background:#101e3d;border:1px solid #5378a9;color:white;border-radius:10px;padding:12px;cursor:pointer}button.active{background:#5541a0;border-color:#c7b6ff}button:disabled{opacity:.38;cursor:default}.grid{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}.tile{width:calc((100% - 20px)/3);padding:10px 3px;background:linear-gradient(145deg,#26335a,#0b1229);border:1px solid var(--c);box-shadow:0 0 14px color-mix(in srgb,var(--c) 25%,transparent)}.tile svg{width:100%;max-width:90px;filter:drop-shadow(0 0 7px var(--c))}.stars{color:#ffb64a;font-size:12px}.panel{border:1px solid #344b7b;border-radius:12px;background:#0b142b;padding:12px;margin:12px 0}.bar{height:8px;background:#24304b;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#43e7ff;transition:width .3s}.actions{display:flex;gap:8px}.actions button{flex:1}.log{font-size:13px;color:#a9c8e9;min-height:38px}#battle[hidden]{display:none}footer{position:fixed;bottom:0;left:0;right:0;background:#080f23;padding:12px;text-align:center;border-top:1px solid #425b9a}
</style><main><header><a href="../">‹ Development HQ</a><small>LIMITED EVENT</small></header><div class="hero"><h1>Cyber Prestige</h1><strong>ROGUE PROTOCOL</strong><p>Defeat rogue machines. Earn prestige and unlock increasingly dangerous operations.</p><small id="clock"></small><svg class="robot" viewBox="0 0 200 155"><g stroke="#a5caff" stroke-width="2"><path fill="#24365c" d="M38 145 48 95 78 76 122 76 152 95 162 145Z"/><path fill="#485b89" d="M62 30 83 12 117 12 138 30 132 73 100 92 68 73Z"/><path fill="#08152d" d="M72 38 128 38 120 59 80 59Z"/><path stroke="#ff4df1" stroke-width="5" d="M80 47H120"/><path fill="#182d50" d="M48 95 20 112 12 145 42 145 63 110M152 95 180 112 188 145 158 145 137 110"/><path fill="#52eaff" d="M100 99 113 115 100 132 87 115Z"/></g></svg></div><div class="tabs" id="tabs"></div><div class="grid" id="grid"></div><div class="panel">Prestige earned: <b id="points"></b> · Cleared: <b id="cleared"></b>/15</div><section class="panel" id="battle" hidden><h2 id="enemy"></h2><small>Enemy integrity</small><div class="bar"><i id="eh"></i></div><small>Squad integrity</small><div class="bar"><i id="ph"></i></div><p class="log" id="log"></p><div class="actions"><button id="strike">Strike</button><button id="guard">Guard</button><button id="retreat">Retreat</button></div></section></main><footer>CYBER PRESTIGE · DEVELOPMENT TRIAL</footer><script>
const key='matrixCyberPrestigeV1', now=Date.now(), duration=3*864e5;let state;try{state=JSON.parse(localStorage.getItem(key))}catch{}if(!state||now>=state.end)state={end:now+duration,done:[],points:0};let stage=0,b=null;const names=['Easy','Normal','Hard','Nightmare','Insane'],stages=['Operative','Elite','Legendary'],colors=['#8fa9bd','#d68d69','#8fd9ff','#ffd05b','#ff5353'],bosses=['Sentinel','Wraith','Titan','Overlord','Inferno'];const $=id=>document.getElementById(id);function save(){localStorage.setItem(key,JSON.stringify(state))}function unlocked(s){return s===0||[0,1,2,3,4].every(d=>state.done.includes((s-1)*5+d))}function render(){ $('tabs').innerHTML=stages.map((n,i)=>'<button class="'+(stage===i?'active':'')+'" '+(!unlocked(i)||b?'disabled':'')+' onclick="stage='+i+';render()">'+(!unlocked(i)?'🔒 ':'')+n+'</button>').join('');$('grid').innerHTML=names.map((n,i)=>{let id=stage*5+i,done=state.done.includes(id),locked=i>0&&!state.done.includes(id-1);return '<button class="tile" style="--c:'+colors[i]+'" '+(locked||b||Date.now()>=state.end?'disabled':'')+' onclick="start('+i+')"><svg viewBox="0 0 100 100"><path fill="'+colors[i]+'" d="M50 3 89 24 81 73 50 96 19 73 11 24Z"/><path fill="#152340" d="M50 12 78 30 72 68 50 85 28 68 22 30Z"/><path fill="none" stroke="'+colors[i]+'" stroke-width="5" d="M30 55 50 25 70 55 50 75Z"/><circle cx="50" cy="50" r="'+(7+i*2)+'" fill="'+colors[i]+'"/></svg><div class="stars">'+ '★'.repeat(i+1)+'</div><b>'+n+'</b><br><small>'+(done?'CLEARED':locked?'LOCKED':bosses[i])+'</small></button>'}).join('');$('points').textContent=state.points;$('cleared').textContent=state.done.length}function start(i){if(b||Date.now()>=state.end||!unlocked(stage)||(i>0&&!state.done.includes(stage*5+i-1)))return;let max=70+i*24+stage*40;b={id:stage*5+i,i,max,h:max,p:100};$('battle').hidden=false;$('enemy').textContent=stages[stage]+' '+bosses[i];$('log').textContent='Engagement started.';render();bars();$('battle').scrollIntoView({behavior:'smooth'})}function bars(){$('eh').style.width=Math.max(0,b.h/b.max*100)+'%';$('ph').style.width=Math.max(0,b.p)+'%'}function turn(guard){if(!b)return;if(Date.now()>=state.end){finish('Event ended.');return}let hit=guard?15:32+Math.floor(Math.random()*12);b.h-=hit;if(b.h<=0){bars();let fresh=!state.done.includes(b.id);if(fresh){state.done.push(b.id);state.points+=100*(b.i+1)*(stage+1);save()}finish(fresh?'Victory! Prestige awarded.':'Victory! Reward already claimed.');return}b.p-=guard?3:8+b.i*2+stage*2;bars();if(b.p<=0){finish('Defeat. Retry when ready.');return}$('log').textContent='Dealt '+hit+' damage. '+(guard?'Defensive manoeuvre.':'Enemy counterattack.')}function finish(msg){b=null;$('log').textContent=msg;$('strike').disabled=true;$('guard').disabled=true;render()}$('strike').onclick=()=>turn(false);$('guard').onclick=()=>turn(true);$('retreat').onclick=()=>{b=null;$('battle').hidden=true;render()};const old=start;start=function(i){$('strike').disabled=false;$('guard').disabled=false;old(i)};function tick(){let t=Math.max(0,Math.floor((state.end-Date.now())/1000));$('clock').textContent='⏱ '+Math.floor(t/86400)+'d '+String(Math.floor(t/3600)%24).padStart(2,'0')+':'+String(Math.floor(t/60)%60).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(!t&&!b)render()}save();render();tick();setInterval(tick,1000);
</script></html>

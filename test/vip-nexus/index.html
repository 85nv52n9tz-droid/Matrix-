<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>VIP Nexus</title><style>
*{box-sizing:border-box}body{margin:0;background:#050914;color:#e7efff;font:13px system-ui}button{font:inherit;color:inherit;cursor:pointer;border:1px solid #354c68;background:#14243b;border-radius:8px;padding:9px}button:disabled{opacity:.4}header{padding:12px;display:flex;justify-content:space-between;align-items:center;background:#0c1728}main{max-width:600px;margin:auto;padding:10px}.hero{position:relative;overflow:hidden;text-align:center;border:1px solid var(--accent);border-radius:14px;background:radial-gradient(ellipse at 50% 35%,var(--glow),#080e20 75%);padding:10px}.hero svg{height:100px;width:120px;filter:drop-shadow(0 0 12px var(--accent))}.hero h1{margin:0;color:var(--accent);letter-spacing:4px;font-size:26px}.hero small{color:#a6b6d0}.nav{display:flex;align-items:center;justify-content:space-between}.nav button{font-size:20px;width:42px}.track{height:7px;background:#23314a;border-radius:8px;overflow:hidden;margin:8px 0}.track i{display:block;height:100%;background:var(--accent)}.tabs{display:flex;gap:5px;margin:10px 0}.tabs button{flex:1;padding:9px 2px;font-size:11px}.active{border-color:var(--accent);color:var(--accent)}.panel{border:1px solid #283d59;background:#0c1729;border-radius:10px;padding:10px;margin-bottom:8px}.panel h3{margin:0 0 8px;color:var(--accent);font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #203047}.row:last-child{border:0}.muted{color:#93a5bf;font-size:11px}.gold{color:#ffda80}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.piece{aspect-ratio:1;display:grid;place-items:center;background:#16223b;border:1px solid #344866;border-radius:5px;font-size:20px}.piece.on{background:linear-gradient(135deg,#163c55,#5c3880);border-color:var(--accent);color:#bdfaff}.skin{height:105px;display:grid;place-items:center;background:radial-gradient(ellipse,#244c71,#090e20);border-radius:8px;margin:8px 0}.skin svg{height:100%;width:100%}.wide{width:100%;margin-top:8px}.badge{font-size:10px;color:var(--accent)}.test{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}.test button{font-size:10px;flex:1}.notice{min-height:18px;color:#8de8c3;font-size:11px;margin:5px 0}
.heroGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.heroCard{display:flex;flex-direction:column;align-items:center;gap:5px;border-color:var(--hc);background:radial-gradient(ellipse at top,#24334c,#0a1425);color:var(--hc);padding:8px 3px}.heroCard svg{height:105px;width:100%;filter:drop-shadow(0 0 7px var(--hc))}.heroCard small{font-size:10px;color:#aabbd0}.heroCard span{font-size:10px}.heroModal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:15px;z-index:99}.heroModal[hidden]{display:none}.heroModal .panel{width:min(100%,360px);text-align:center}.heroModal svg{height:140px;width:100%}</style><style id="matrix-cyber-theme-v1">:root{--cyber-accent:#ffe600}body{background:radial-gradient(ellipse at 50% 15%,color-mix(in srgb,#ffe600 13%,#102344),#050b24 55%,#02040c)!important}h1,h2,h3{text-shadow:0 0 12px color-mix(in srgb,#ffe600 55%,transparent)}:is(.card,.panel,.tile){border-color:color-mix(in srgb,#ffe600 55%,#172849)!important;box-shadow:inset 0 1px 0 #ffffff12,0 0 12px -6px #ffe600}button:not(:disabled){text-shadow:0 0 7px #ffffff35} </style></head><body><header><b>◈ VIP NEXUS</b><span id="wallet" class="gold"></span></header><main><div id="hero" class="hero"></div><div class="tabs" id="tabs"></div><div id="notice" class="notice"></div><div id="content"></div><div class="test"><button onclick="gain(1000)">DEV +1,000 XP</button><button onclick="gain(10000)">DEV +10,000 XP</button><button onclick="s.xp=threshold[11];save();view=12;render()">TEST VIP 12</button><button onclick="s.credits+=5000;save();render()">+5,000 TOKENS</button><button onclick="if(confirm('Reset VIP test?')){localStorage.removeItem(K);location.reload()}">RESET</button></div><p class="muted">Independent DEV economy · no live rewards or bonuses applied.</p></main><div class="heroModal" id="heroModal" hidden><div class="panel"><div id="heroDetail"></div><button class="wide" onclick="document.getElementById('heroModal').hidden=true">CLOSE</button></div></div><script>
const K='matrix_vip_nexus_dev1',threshold=[0,500,1500,3500,7000,12000,20000,32000,50000,75000,110000,160000],colors=['#9db7cc','#64d5a9','#4acbff','#778cff','#b28cff','#ef89dc','#ff8b85','#ffb66c','#f9dc75','#60ffe0','#e7a0ff','#fff0b2'],titles=['Initiate','Operator','Cipher','Specialist','Architect','Overseer','Vanguard','Ascendant','Sovereign','Singularity','Eternal','Quantum Crown'];let s;try{s=JSON.parse(localStorage.getItem(K))}catch(e){}s=s||{xp:0,credits:1000,claimed:'',pieces:[],skin:false,purchases:{}};let view=level(),tab='Benefits',msg='';const heroes=[[4,'Cipher Prime','#4deaff','Intelligence','Signal Override / Data Veil','M25 32 L50 8 L75 32 L68 67 L50 79 L32 67Z'],[7,'Neon Wraith','#ff70c8','Offensive combat','Phantom Strike / Neon Surge','M50 5 L90 20 L65 75 L50 86 L35 75 L10 20Z'],[10,'Zero Sentinel','#70ffb5','Defensive combat','Zero Barrier / Fortress Protocol','M25 18 H75 L88 40 V72 L65 90 H35 L12 72 V40Z'],[12,'Apex Nexus','#ffe6a0','Elite command','Quantum Command / Nexus Ascension','M50 4 L80 24 L96 12 L85 58 L70 83 L50 96 L30 83 L15 58 L4 12 L20 24Z']];function portrait(h){return '<svg viewBox="0 0 100 110"><path d="M10 110 L18 85 L35 72 H65 L82 85 L90 110Z" fill="#192a40" stroke="'+h[2]+'"/><path d="'+h[5]+'" fill="#25364b" stroke="'+h[2]+'" stroke-width="2"/><path d="M30 42 L70 42 L64 54 H36Z" fill="'+h[2]+'"/><circle cx="50" cy="94" r="6" fill="'+h[2]+'"/></svg>'}function heroSection(){return '<div class="panel"><h3>EXCLUSIVE VIP HEROES</h3><div class="heroGrid">'+heroes.map((h,i)=>'<button class="heroCard" style="--hc:'+h[2]+'" onclick="heroDetails('+i+')">'+portrait(h)+'<b>'+h[1]+'</b><small>'+h[3]+'</small><span>'+(level()>=h[0]?'✓ UNLOCKED':'🔒 VIP '+h[0])+'</span></button>').join('')+'</div></div><div class="panel"><h3>VIP CREW ROSTER · PREVIEW</h3>'+heroes.filter(h=>level()>=h[0]).map(h=>'<div class="row"><span>'+h[1]+'</span><b>AVAILABLE</b></div>').join('')+(level()<4?'<p>Reach VIP 4 to unlock your first hero.</p>':'')+'</div>'}function heroDetails(i){let h=heroes[i];document.getElementById('heroModal').hidden=false;document.getElementById('heroDetail').innerHTML=portrait(h)+'<h2 style="color:'+h[2]+'">'+h[1]+'</h2><p>'+h[3]+'</p><p>VIP '+h[0]+' · '+(level()>=h[0]?'Unlocked':'Locked')+'</p><p>'+h[4]+'</p><p class="muted">Proposed abilities; balance pending.</p>'}function level(){return threshold.reduce((n,x,i)=>s.xp>=x?i+1:n,1)}function prestige(){return Math.floor(Math.max(0,s.xp-threshold[11])/25000)}function save(){localStorage.setItem(K,JSON.stringify(s))}function gain(n){s.xp+=n;view=level();save();render()}function move(n){view=Math.max(1,Math.min(12,view+n));render()}function setTab(t){tab=t;render()}function emblem(v){let c=colors[v-1],n=4+Math.floor(v/3),p=Array.from({length:n},(_,i)=>{let a=i*2*Math.PI/n-Math.PI/2;return (60+42*Math.cos(a))+','+(52+42*Math.sin(a))}).join(' ');return '<svg viewBox="0 0 120 104"><polygon points="'+p+'" fill="#14253b" stroke="'+c+'" stroke-width="2"/><path d="M60 15 L91 34 L83 73 L60 91 L37 73 L29 34Z" fill="#091529" stroke="'+c+'"/><path d="M20 40 L8 50 L24 72 M100 40 L112 50 L96 72" fill="none" stroke="'+c+'" stroke-width="3"/><text x="60" y="62" fill="'+c+'" text-anchor="middle" font-size="30" font-weight="bold">'+v+'</text></svg>'}function render(){let l=level(),c=colors[view-1],next=l===12?threshold[11]+(prestige()+1)*25000:threshold[l],base=l===12?threshold[11]+prestige()*25000:threshold[l-1];document.documentElement.style.setProperty('--accent',c);document.documentElement.style.setProperty('--glow',c+'33');document.getElementById('wallet').textContent='◈ '+s.credits.toLocaleString()+' VIP tokens';document.getElementById('hero').innerHTML='<div class="nav"><button onclick="move(-1)" '+(view===1?'disabled':'')+'>‹</button>'+emblem(view)+'<button onclick="move(1)" '+(view===12?'disabled':'')+'>›</button></div><h1>VIP '+view+'</h1><b>'+titles[view-1]+'</b><p class="badge">'+(view<=l?'UNLOCKED':'LOCKED · '+threshold[view-1].toLocaleString()+' XP REQUIRED')+'</p><small>YOUR VIP '+l+' · '+s.xp.toLocaleString()+' / '+next.toLocaleString()+' XP</small><div class="track"><i style="width:'+Math.max(0,Math.min(100,(s.xp-base)/(next-base)*100))+'%"></i></div><small>'+(l===12?'PRESTIGE '+prestige():'NEXT LEVEL VIP '+(l+1))+'</small>';document.getElementById('tabs').innerHTML=['Benefits','Heroes','VIP Shop','HQ Puzzle','Prestige'].map(t=>'<button class="'+(tab===t?'active':'')+'" onclick="setTab(\''+t+'\')">'+t+'</button>').join('');document.getElementById('notice').textContent=msg;let h='';if(tab==='Benefits'){let benefits=[['Construction speed',view*2],['Research speed',view*2],['Resource production',view*3],['Nano training speed',view*2],['Gathering speed',view*2],['Attack & defence',Math.floor(view*1.5)]];h='<div class="panel"><h3>VIP '+view+' BENEFITS</h3>'+benefits.map(b=>'<div class="row"><span>'+b[0]+'</span><b class="gold">+'+b[1]+'%</b></div>').join('')+'</div><div class="panel"><h3>EXCLUSIVE CREW MILESTONES</h3>'+[[4,'Cipher Prime'],[7,'Neon Wraith'],[10,'Zero Sentinel'],[12,'Apex Nexus']].map(a=>'<div class="row"><span>◈ '+a[1]+'<br><small class="muted">VIP '+a[0]+'</small></span><b>'+(l>=a[0]?'UNLOCKED':'🔒')+'</b></div>').join('')+'</div><div class="panel"><h3>DAILY VIP CACHE</h3><p>'+l*100+' tokens · '+l*5+' test speedups</p><button class="wide" onclick="claim()" '+(s.claimed===day()?'disabled':'')+'>'+(s.claimed===day()?'CLAIMED TODAY':'CLAIM DAILY CACHE')+'</button></div>'}if(tab==='Heroes'){h=heroSection()}if(tab==='VIP Shop'){h='<div class="panel"><h3>EXCLUSIVE VIP EXCHANGE</h3><p class="muted">Items unlock with your actual test VIP level.</p>'+items.map((a,i)=>'<div class="row"><div><b>'+a[1]+'</b><br><small class="muted">VIP '+a[0]+' · '+a[2]+' tokens · '+(s.purchases[i]||0)+' purchased</small></div><button onclick="buy('+i+')" '+(l<a[0]||s.credits<a[2]?'disabled':'')+'>'+(l<a[0]?'🔒':'BUY')+'</button></div>').join('')+'</div>'}if(tab==='HQ Puzzle'){h='<div class="panel"><h3>QUANTUM CITADEL · EXCLUSIVE HQ SKIN</h3><div class="skin"><svg viewBox="0 0 240 100"><path d="M20 86 H220 M45 86 V58 L75 40 L95 58 V86 M95 86 V35 L120 5 L145 35 V86 M145 86 V58 L175 40 L195 58 V86" fill="#193b59" stroke="#9eeaff" stroke-width="2"/><path d="M120 5 V86 M100 48 H140 M52 68 H88 M152 68 H188" stroke="#d5aaff" stroke-width="3"/></svg></div><p>'+s.pieces.length+' / 12 fragments collected</p><div class="grid">'+Array.from({length:12},(_,i)=>'<div class="piece '+(s.pieces.includes(i)?'on':'')+'">'+(s.pieces.includes(i)?'◈':'?')+'</div>').join('')+'</div><button class="wide" onclick="fragment()" '+(l<12||s.credits<250||s.pieces.length===12?'disabled':'')+'>VIP 12 · ACQUIRE FRAGMENT · 250 TOKENS</button><button class="wide" onclick="assemble()" '+(l<12||s.pieces.length<12||s.skin?'disabled':'')+'>'+(s.skin?'SKIN UNLOCKED':'ASSEMBLE HQ SKIN')+'</button></div>'}if(tab==='Prestige'){h='<div class="panel"><h3>VIP 12 · PRESTIGE PROTOCOL</h3><p>'+ (l<12?'🔒 Reach VIP 12 to activate.':'PRESTIGE '+prestige())+'</p><p class="muted">Every 25,000 additional VIP XP unlocks one prestige rank.</p><div class="row">Additional production <b>+'+prestige()*2+'%</b></div><div class="row">Additional combat power <b>+'+prestige()+'%</b></div><div class="row">Exclusive prestige shop <b>'+(prestige()>0?'UNLOCKED':'🔒 P1')+'</b></div><button class="wide" onclick="setTab(\'VIP Shop\')">VIEW VIP EXCHANGE</button></div>'}document.getElementById('content').innerHTML=h}
const items=[[1,'Resource cache',100],[2,'Construction accelerator',150],[3,'Research accelerator',200],[4,'Crew upgrade module',250],[5,'Nano training cache',300],[6,'Advanced equipment crate',350],[7,'Neon Wraith shards',450],[8,'Quantum materials',500],[9,'Elite gear module',600],[10,'Zero Sentinel shards',750],[11,'Legendary refinement core',900],[12,'Apex Nexus shards',1200],[12,'Quantum Citadel fragment',250],[12,'Prestige relic · P1',1500]];function day(){return new Date().toISOString().slice(0,10)}function claim(){if(s.claimed===day())return;s.claimed=day();s.credits+=level()*100;msg='Daily cache claimed. Test speedups awarded as preview only.';save();render()}function buy(i){let a=items[i];if(level()<a[0]||s.credits<a[2]||(i===13&&prestige()<1))return;if(i===12){fragment();return}s.credits-=a[2];s.purchases[i]=(s.purchases[i]||0)+1;msg=a[1]+' added to test purchase ledger.';save();render()}function fragment(){if(level()<12||s.credits<250||s.pieces.length===12)return;let missing=Array.from({length:12},(_,i)=>i).filter(i=>!s.pieces.includes(i));s.pieces.push(missing[Math.floor(Math.random()*missing.length)]);s.credits-=250;msg='New HQ fragment acquired!';save();render()}function assemble(){if(level()===12&&s.pieces.length===12){s.skin=true;msg='Quantum Citadel skin unlocked in DEV.';save();render()}}render();
</script></body></html>

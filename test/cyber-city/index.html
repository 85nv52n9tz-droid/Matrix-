<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><title>Cyber City HQ</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#07121d;color:#e5f8ff;font:12px system-ui}#map{position:absolute;inset:0;touch-action:none;overflow:hidden;background:#091522}#city{position:absolute;width:1200px;height:1100px;transform-origin:0 0;will-change:transform}svg{display:block;width:100%;height:100%}.building{cursor:pointer}.building:active{opacity:.8}.hud{position:absolute;top:0;left:0;right:0;background:#091a2bed;border-bottom:1px solid #38b8d0;box-shadow:0 4px 16px #0009;padding:6px;pointer-events:auto}.resources{display:flex;justify-content:space-between;gap:4px;align-items:center;font-weight:700}.profile{background:#183c51;border:1px solid #5de4ff;border-radius:8px;padding:7px}.second{display:flex;justify-content:space-between;align-items:center;margin-top:5px;color:#80e8ff}.gold{color:#ffe08c}.rail{position:absolute;right:7px;top:110px;display:flex;flex-direction:column;gap:10px}.rail button,.zoom button{background:#102c42e8;border:1px solid #4e9bb6;color:white;border-radius:10px;padding:7px;min-width:45px;box-shadow:0 3px 9px #0008;font:10px system-ui}.rail b{display:block;font-size:23px}.zoom{position:absolute;left:7px;bottom:125px;display:flex;flex-direction:column;gap:5px}.bottom{position:absolute;bottom:0;left:0;right:0;background:#0b2032ef;border-top:1px solid #4198b5}.task{padding:7px 10px;background:#163248;color:#d8faff}.news{font-size:10px;padding:5px 10px;color:#a9c2d4}.nav{display:flex;justify-content:space-around;padding:5px 0}.nav button{flex:1;border:0;background:none;color:#b9eaff;font:10px system-ui;padding:3px 0}.nav b{display:block;font-size:21px}.modal{position:absolute;inset:0;background:#0009;display:grid;place-items:center;padding:18px}.modal[hidden]{display:none}.panel{width:min(100%,340px);background:#10283c;border:1px solid #55d9ee;border-radius:14px;padding:16px;box-shadow:0 0 30px #28c7ff33}.panel h2{color:#79efff}.panel button{background:#1a5068;border:1px solid #6ad7e9;border-radius:8px;color:white;padding:10px;width:100%;margin-top:8px}.hint{position:absolute;left:8px;top:83px;color:#9bc4d8;background:#0a1d2bcc;padding:5px;border-radius:5px;font-size:9px;pointer-events:none}
.rail{right:5px;gap:6px}.rail button{min-width:35px;width:39px;padding:4px 1px;font-size:8px;border-radius:7px}.rail b{font-size:17px}.panel iframe{width:100%;height:65dvh;border:0}.panel:has(iframe){width:100%;max-width:600px;padding:8px}</style></head><body><div id="map"><div id="city"><svg id="scene" viewBox="0 0 1200 1100"></svg></div></div><div class="hud"><div class="resources"><span class="profile" onclick="openPanel('Commander profile')">◈ LV 30</span><span>⚡ 1.2M</span><span>▣ 860K</span><span>◆ 420K</span><span class="gold">⬡ 12K</span></div><div class="second"><b>⚔ 508,610 POWER</b><span>NETWORK ONLINE</span><b class="gold" onclick="openPanel('VIP Nexus')">VIP 12</b></div></div><div class="hint">DRAG TO EXPLORE CITY</div><div class="rail"><button onclick="openPanel('Events')"><b>📅</b>Events</button><button onclick="openPanel('Black Market')"><b>🎁</b>Deals</button><button onclick="openPanel('Cyber Archives')"><b>▣</b>Archives</button><button onclick="openPanel('Incoming threats')"><b>⚠</b>Threats</button><button onclick="openPanel('Mail')"><b>✉</b>Mail</button></div><div class="zoom"><button onclick="center()">⌂</button></div><div class="bottom"><div class="task" onclick="openPanel('Upgrade Cyber Lab')">◈ Upgrade Cyber Lab to level 12 · 11/12</div><div class="news">SYSTEM NEWS · Cyber City network operational</div><div class="nav"><button onclick="openPanel('Ops')"><b>⚔</b>Ops</button><button onclick="openPanel('Crew')"><b>♟</b>Crew</button><button onclick="openPanel('Inventory')"><b>▣</b>Inventory</button><button onclick="openPanel('Shop')"><b>◈</b>Shop</button><button onclick="openPanel('Alliance')"><b>⬡</b>Alliance</button><button onclick="openPanel('World')"><b>◎</b>World</button></div></div><div class="modal" id="modal" hidden><div class="panel"><h2 id="title"></h2><div id="detail"></div><button id="action">OPEN</button><button onclick="document.getElementById('modal').hidden=true">CLOSE</button></div></div><script>
const buildings=[['Headquarters',600,390,155,150,'#53d9ff',12,'Command and city progression','⬡'],['Data Centre',365,275,115,82,'#40efb2',11,'Generate data and credits','▣'],['Cyber Lab',820,280,120,100,'#c58aff',11,'Research new technologies','⚗'],['AI Core',365,525,105,125,'#5e9bff',10,'Crew and AI enhancements','◈'],['Quantum Reactor',825,535,110,120,'#f7b85e',10,'Power and quantum production','⚡'],['Nano Foundry',600,665,135,90,'#ff737c',9,'Train and deploy Nano bots','⚔'],['Crew Command',600,155,120,75,'#7be8ff',8,'Recruit and assign crew','♟'],['Repair Centre',245,720,105,65,'#75f6ad',8,'Recover damaged units','✚'],['Vault',965,720,110,65,'#e4c77a',8,'Protect resources and inventory','▣'],['Alliance Embassy',260,105,100,80,'#b1a4ff',7,'Alliance support and diplomacy','⬡'],['Recon Tower',940,110,85,125,'#ff9f7a',7,'Scout hostile targets','⌁'],['Black Market',600,890,125,65,'#ed81dc',6,'Trade and exclusive items','◆'],['Nexus HQ',600,30,85,65,'#8affff',6,'AI network command','◎']];let levels={};try{levels=JSON.parse(localStorage.getItem('cyber_city_levels')||'{}')}catch(e){}const scene=document.getElementById('scene');let art='<defs><pattern id="grid" width="80" height="40" patternUnits="userSpaceOnUse"><path d="M0 20 L40 0 L80 20 L40 40Z" fill="none" stroke="#1a3444" stroke-width="1"/></pattern><radialGradient id="ground"><stop stop-color="#203e4c"/><stop offset="1" stop-color="#091421"/></radialGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="1100" fill="url(#ground)"/><rect width="1200" height="1100" fill="url(#grid)"/>';
for(let b of buildings){if(b[0]==='Headquarters')continue;art+='<path d="M600 440 L'+b[1]+' 440 L'+b[1]+' '+(b[2]+45)+'" fill="none" stroke="#102c3a" stroke-width="19"/><path d="M600 440 L'+b[1]+' 440 L'+b[1]+' '+(b[2]+45)+'" fill="none" stroke="'+b[5]+'" stroke-width="2" stroke-dasharray="7 16" opacity=".7"><animate attributeName="stroke-dashoffset" from="0" to="-46" dur="2s" repeatCount="indefinite"/></path>'}
function details(w,h,d,c,i){let out='';for(let j=0;j<4;j++){let xx=w*.12+j*w*.13,yy=-h+d*.7-xx*.48;out+='<path d="M'+xx+' '+(yy+12)+' v'+(h*.48)+'" stroke="#39566c" stroke-width="9"/><path d="M'+xx+' '+(yy+15)+' v'+(h*.36)+'" stroke="'+c+'" stroke-width="2" opacity=".85"/>'}let type=i%4;if(type===0)out+='<path d="M-18 '+(-h-20)+' V'+(-h-65)+' L0 '+(-h-85)+' L18 '+(-h-65)+' V'+(-h-20)+'Z" fill="#243f58" stroke="'+c+'"/><path d="M0 '+(-h-85)+' v-20" stroke="'+c+'" stroke-width="3"/>';if(type===1)out+='<ellipse cy="'+(-h-10)+'" rx="32" ry="15" fill="#142a40" stroke="'+c+'"/><ellipse cy="'+(-h-20)+'" rx="24" ry="10" fill="#38546b" stroke="'+c+'"/>';if(type===2)out+='<path d="M-35 '+(-h)+' l0 -35 20 -12 0 35Z M15 '+(-h)+' l0 -35 20 -12 0 35Z" fill="#314e66" stroke="'+c+'"/>';if(type===3)out+='<circle cy="'+(-h-24)+'" r="23" fill="#17394d" stroke="'+c+'" stroke-width="3"/><ellipse cy="'+(-h-24)+'" rx="32" ry="9" fill="none" stroke="'+c+'"/>';return out}function building(b,i){let [name,x,y,w,h,c,lv,desc,icon]=b,d=w*.48;return '<g class="building" onclick="selectBuilding('+i+')" transform="translate('+x+','+y+')"><ellipse cy="'+(d*.65)+'" rx="'+(w*.75)+'" ry="'+(d*.55)+'" fill="#000" opacity=".35"/><path d="M0 '+(-d)+' L'+w+' 0 L0 '+d+' L'+(-w)+' 0Z" fill="#263b48" stroke="#446273"/><path d="M'+(-w*.7)+' 0 L0 '+(d*.7)+' L0 '+(d*.7-h)+' L'+(-w*.7)+' '+(-h)+'Z" fill="#152d40" stroke="#39586a"/><path d="M0 '+(d*.7)+' L'+(w*.7)+' 0 L'+(w*.7)+' '+(-h)+' L0 '+(d*.7-h)+'Z" fill="#0d1c30" stroke="#39586a"/><path d="M0 '+(-d*.7-h)+' L'+(w*.7)+' '+(-h)+' L0 '+(d*.7-h)+' L'+(-w*.7)+' '+(-h)+'Z" fill="#345367" stroke="'+c+'" stroke-width="2"/><path d="M'+(-w*.6)+' '+(-h+15)+' L0 '+(-h+d*.6+15)+' L'+(w*.6)+' '+(-h+15)+'" fill="none" stroke="'+c+'" stroke-width="3" filter="url(#glow)"/>'+Array.from({length:3},(_,j)=>'<path d="M'+(-w*.56+j*w*.19)+' '+(-h+28+j*d*.19)+' v'+(h*.35)+'" stroke="'+c+'" stroke-width="5" opacity=".75"/>').join('')+'<path d="M0 '+(-h-d*.45)+' L'+(w*.27)+' '+(-h)+' L0 '+(-h+d*.27)+' L'+(-w*.27)+' '+(-h)+'Z" fill="#122d43" stroke="'+c+'" stroke-width="2"/><circle cy="'+(-h-8)+'" r="9" fill="'+c+'" filter="url(#glow)"/><g transform="translate(0,'+(-h-d*.7-23)+')"><rect x="-19" y="-17" width="38" height="34" rx="9" fill="#102c40" stroke="'+c+'"/><text y="7" text-anchor="middle" font-size="22" fill="'+c+'">'+icon+'</text></g><rect x="'+(-w*.8)+'" y="'+(d*.75)+'" width="'+(w*1.6)+'" height="23" rx="5" fill="#081827" opacity=".9"/><text y="'+(d*.75+15)+'" text-anchor="middle" fill="#e3f5ff" font-size="12" font-weight="bold">'+name+' · '+(levels[name]||lv)+'</text>'+details(w,h,d,c,i)+'</g>'}
function draw(){scene.innerHTML=art+buildings.map((b,i)=>({b,i})).sort((a,b)=>a.b[2]-b.b[2]).map(o=>building(o.b,o.i)).join('')}draw();let x=0,y=0,z=.7;const city=document.getElementById('city'),map=document.getElementById('map');function apply(){x=Math.max(innerWidth-1200*z-100,Math.min(100,x));y=Math.max(innerHeight-1100*z-100,Math.min(100,y));city.style.transform='translate('+x+'px,'+y+'px) scale('+z+')'}function center(){z=.85;x=innerWidth/2-600*z;y=innerHeight*.47-390*z;apply()}function zoom(k){let nz=Math.max(.3,Math.min(1.7,z*k));x=innerWidth/2-(innerWidth/2-x)*nz/z;y=innerHeight/2-(innerHeight/2-y)*nz/z;z=nz;apply()}center();let pts=new Map(),moved=false;map.addEventListener('pointerdown',e=>{pts.set(e.pointerId,[e.clientX,e.clientY]);moved=false});map.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;let old=pts.get(e.pointerId),dx=e.clientX-old[0],dy=e.clientY-old[1];if(Math.abs(dx)+Math.abs(dy)>2)moved=true;if(pts.size===1){x+=dx;y+=dy;apply()}pts.set(e.pointerId,[e.clientX,e.clientY])});['pointerup','pointercancel','pointerleave'].forEach(t=>map.addEventListener(t,e=>pts.delete(e.pointerId)));map.addEventListener('wheel',e=>{e.preventDefault();x-=e.deltaX;y-=e.deltaY;apply()},{passive:false});const destinations={'VIP Nexus':'../vip-nexus/','Events':'../event-calendar/','Cyber Archives':'../cyber-archives/','World':'../world-map/','Nano Foundry':'../nano-v2/','Recon Tower':'../nano-v2/','Incoming threats':'../nano-v2/','Nexus HQ':'../quantum-pc-island/'};function openPanel(name){document.getElementById('title').textContent=name;document.getElementById('detail').textContent='Development preview · this destination will connect to the existing game during integration.';document.getElementById('action').hidden=true;document.getElementById('modal').hidden=false;if(destinations[name]){document.getElementById('detail').innerHTML='<iframe title="'+name+'" src="'+destinations[name]+'?build=city2"></iframe>'}}function selectBuilding(i){if(moved)return;let b=buildings[i];openPanel(b[0]);document.getElementById('detail').textContent=b[7]+' · Level '+(levels[b[0]]||b[6]);let a=document.getElementById('action');a.hidden=false;a.textContent=destinations[b[0]]?'OPEN FACILITY':'TEST UPGRADE';if(destinations[b[0]]){a.onclick=()=>openPanel(b[0]);return;}a.onclick=()=>{levels[b[0]]=Math.min(30,(levels[b[0]]||b[6])+1);localStorage.setItem('cyber_city_levels',JSON.stringify(levels));draw();selectBuilding(i)}} 
</script></body></html>

(function(){
var world="\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no\">\u003cmeta name=\"theme-color\" content=\"#050b17\">\u003ctitle>THE MATRIX | World Map Development\u003c/title>\n\u003cstyle>\n:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#050b17;color:#e5f5ff}*{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 20%,#142940,#050b17 70%)}header{padding:env(safe-area-inset-top) 12px 8px;border-bottom:1px solid #1b4c66;background:#071525}header h1{font-size:16px;letter-spacing:3px;margin:8px 0 4px;color:#75e9ff}header small{color:#84a4b9}#status{display:flex;justify-content:space-between;font-size:11px;color:#8bd8e7}#map{position:relative;flex:1;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at center,#14364a 0%,#0a1b2c 55%,#07121f 100%)}#terrain{position:absolute;inset:0;width:100%;height:100%}#field{position:absolute;width:1200px;height:1200px;transform-origin:0 0;background:radial-gradient(ellipse at 25% 28%,#144b53 0%,transparent 28%),radial-gradient(ellipse at 76% 64%,#233b55 0%,transparent 34%),radial-gradient(ellipse at 53% 78%,#123e36 0%,transparent 24%),#091b29}#field:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 35% 40%,#06b6d41b,transparent 35%),radial-gradient(circle at 70% 60%,#ef44441a,transparent 25%);pointer-events:none}.node{position:absolute;transform:translate(-50%,-50%);min-width:44px;min-height:44px;border:1px solid #4a7b8b;background:#091d2de8;border-radius:12px;box-shadow:0 0 18px #00c9ff33;display:grid;place-items:center;font-size:21px}.node span{font-size:9px;display:block;color:#d3faff}.node.me{border-color:#22d3ee;box-shadow:0 0 20px #22d3ee99}.node.enemy{border-color:#e66b79}.node.alliance{border-color:#a78bfa}.node.resource{border-color:#36d399}.territory{position:absolute;border:2px solid #2dd4bf;border-radius:14px;background:#14b8a626;pointer-events:none;box-shadow:inset 0 0 25px #2dd4bf22}.toolbar{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:7px}.toolbar button,.panel button,.nav button{background:#0a2034;border:1px solid #25516c;border-radius:9px;padding:9px}.toolbar button{min-width:40px}.panel{position:absolute;bottom:12px;left:10px;right:10px;padding:12px;background:#071827ef;border:1px solid #28728b;border-radius:14px;box-shadow:0 0 30px #0009;max-height:44%;overflow:auto}.panel h2{font-size:14px;color:#75e9ff;margin:0 0 6px}.panel p{font-size:12px;color:#a4c4d2;margin:6px 0}.actions{display:flex;flex-wrap:wrap;gap:6px}.actions button{font-size:12px;padding:8px}.nav{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px 5px calc(8px + env(safe-area-inset-bottom));background:#071320;border-top:1px solid #1f4d64}.nav button{padding:8px 1px;font-size:10px;display:flex;flex-direction:column;gap:4px;align-items:center}.nav button b{font-size:19px}.nav button.active{border-color:#4bdcf1;color:#76e7ff;background:#12354a}.notice{font-size:11px;color:#fbbf70;padding:4px 12px;background:#241b12}.tag{display:inline-block;border:1px solid #365d73;border-radius:6px;padding:3px 6px;margin:2px;font-size:10px;color:#aad7e5} .node{background:linear-gradient(145deg,#143a4e,#071624);border-radius:15px;box-shadow:0 5px 22px #000b,0 0 12px #3dd5ff33}.node span{font-weight:700;text-shadow:0 1px 5px #000}.panel{background:linear-gradient(160deg,#0d293ceF,#071322f5);backdrop-filter:blur(12px)}#field:after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.26;background:radial-gradient(ellipse at 18% 76%,#4cc3aa50,transparent 18%),radial-gradient(ellipse at 83% 20%,#a44fa850,transparent 18%)}.nav button{font-size:9px}.report{border:1px solid #28516a;background:#0a2434;padding:9px;margin:8px 0;border-radius:10px}.report strong{color:#79e5ff}.report small{color:#8ca9bb}.report p{margin:5px 0}.node.friendly{border-color:#30e4ba}.node.me{border:2px solid #6feaff}.node.alliance{border-color:#9b8cff}/* Continuous network world: no square tiles */#map{background:radial-gradient(ellipse at 52% 48%,#0b2434 0%,#061320 58%,#030a13 100%)}#field{background:radial-gradient(ellipse at 42% 47%,#113446 0%,#081b2b 38%,#061321 76%,#04101a 100%);isolation:isolate}#field:before{background:radial-gradient(circle at 25% 30%,#09e3dc15,transparent 27%),radial-gradient(circle at 73% 66%,#8a59fa13,transparent 30%)}#field:after{display:none}.network-circuit{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.88}.network-circuit .trace{fill:none;stroke:#1b6e81;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.network-circuit .trace.alt{stroke:#35578c}.network-circuit .trace.hot{stroke:#1faeaa;stroke-width:3}.network-circuit .signal{fill:none;stroke:#67f7e5;stroke-width:3;stroke-dasharray:5 28;stroke-linecap:round;animation:signalflow 10s linear infinite;opacity:.7}.network-circuit .signal.violet{stroke:#b294ff;animation-duration:15s;opacity:.5}.network-circuit .pad{fill:#123a4b;stroke:#2c8090;stroke-width:2}.network-circuit .junction{fill:#59d9db;filter:drop-shadow(0 0 6px #49e8ef)}@keyframes signalflow{to{stroke-dashoffset:-660}}.node{z-index:2;border-radius:50%;min-width:52px;min-height:52px;background:radial-gradient(circle at 30% 24%,#194b60,#071522 72%);box-shadow:0 0 0 5px #0b304255,0 0 23px #2ad7e950}.node.alliance{min-width:65px;min-height:65px;border:2px solid #ad89ff;box-shadow:0 0 0 7px #7d53e820,0 0 27px #a277f77a}.node.resource{border:2px solid #39e9a0;box-shadow:0 0 0 5px #26c99122,0 0 23px #24d8a77a}.node.enemy{border:2px solid #e56e83;box-shadow:0 0 0 5px #f4526a20,0 0 22px #e45b6b70}.node.friendly{border:2px solid #33e2b7}.node span{white-space:nowrap;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);font-size:11px;padding:3px 6px;background:#061421d9;border:1px solid #24495a;border-radius:5px}.territory{z-index:1;border:2px dashed #49e5d8;border-radius:50%;background:radial-gradient(circle,#16bfa81b,transparent 72%);box-shadow:0 0 28px #17d5c633}.nav button{min-width:0} \u003c/style>\u003c/head>\n\u003cbody>\u003cdiv id=\"app\">\u003cheader>\u003cdiv id=\"status\">\u003cspan>◈ DEVELOPMENT SANDBOX\u003c/span>\u003cspan id=\"clock\">SIMULATION\u003c/span>\u003c/div>\u003ch1>THE MATRIX · WORLD\u003c/h1>\u003csmall id=\"coords\">Sector 043 · Coordinates 600,600 · HQ 5\u003c/small>\u003c/header>\u003cdiv class=\"notice\">Prototype only · No live multiplayer or live-game changes\u003c/div>\u003cmain id=\"map\">\u003cdiv id=\"field\">\u003c/div>\u003cdiv class=\"toolbar\">\u003cbutton onclick=\"zoom(1.2)\">＋\u003c/button>\u003cbutton onclick=\"zoom(.83)\">－\u003c/button>\u003cbutton onclick=\"center()\">⌖\u003c/button>\u003c/div>\u003csection class=\"panel\" id=\"panel\">\u003c/section>\u003c/main>\u003cnav class=\"nav\" id=\"nav\">\u003c/nav>\u003c/div>\n\u003cscript>\nconst key='matrix-world-sandbox-v1',stored=JSON.parse(localStorage.getItem(key)||'null');let state=stored||{hq:5,energy:150,teleports:3,allianceCredits:800,personalCredits:300,alliances:[],territories:[],marches:[],reports:[],gathered:0,day:0,hqPos:{x:600,y:600}};state.reports=(state.reports||[]).map(x=>({...x,read:x.read===true}));state.mailFilter='All';state.simMarches=state.simMarches||[];state.reinforcements=state.reinforcements||[];state.simNext=state.simNext||Date.now()+18000;state.simEnabled=state.simEnabled!==false;state.bots=Number.isFinite(state.bots)?state.bots:650;state.botTier=state.botTier||2;state.research=state.research||{attack:3,defence:2};state.hqPos=state.hqPos||{x:600,y:600};let selected=null,tab='World',scale=.49,offsetX=0,offsetY=0,drag=null;const field=document.getElementById('field'),panel=document.getElementById('panel'),map=document.getElementById('map');const save=()=>localStorage.setItem(key,JSON.stringify(state));const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;\nlet nodes=[{id:'me',x:state.hqPos.x,y:state.hqPos.y,type:'me',name:'YOUR HQ',level:state.hq},{id:'a',x:420,y:420,type:'alliance',name:'NEON Collective',level:5},{id:'b',x:850,y:780,type:'alliance',name:'Red Protocol',level:6},{id:'friend',x:580,y:435,type:'friendly',name:'NEON Member',level:5},{id:'p1',x:680,y:460,type:'enemy',name:'Cipher',level:4},{id:'p2',x:330,y:720,type:'enemy',name:'ZeroByte',level:6},{id:'p3',x:900,y:350,type:'enemy',name:'NightShift',level:7},{id:'r1',x:520,y:320,type:'resource',name:'Data Cache',level:2},{id:'r2',x:780,y:640,type:'resource',name:'Power Relay',level:3},{id:'r3',x:270,y:530,type:'resource',name:'Quantum Deposit',level:4}];let activeTimers=[];function distance(a,b){return Math.round(Math.hypot(a.x-b.x,a.y-b.y))}function duration(n){return Math.max(18,Math.round(distance(nodes[0],n)/5))}function gatherTime(n){return (45+n.level*35)*1000}function addReport(kind,n,details){state.reports.unshift({id:Date.now()+Math.random(),kind,target:n.name,time:new Date().toLocaleString(),details,read:false});state.reports=state.reports.slice(0,100);save();renderNav()}function mailCategory(k){return k.includes('SCOUT')?'Scout':k.includes('BATTLE')||k.includes('ATTACK')?'Battle':k.includes('GATHER')?'Gather':k.includes('REINFORCE')?'Alliance':k.includes('SIM')?'World':'World'}function safeMail(s){return String(s).replace(/[&\u003c>\"']/g,x=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[x]))}function showMail(id){let r=state.reports.find(x=>x.id===id);if(!r)return;r.read=true;save();renderNav();panel.innerHTML='\u003ch2>✉ '+safeMail(r.kind)+' · '+safeMail(r.target)+'\u003c/h2>\u003cp>'+safeMail(r.time)+'\u003c/p>\u003cdiv class=\"report\">'+r.details.split(' | ').map(s=>'\u003cp>'+safeMail(s)+'\u003c/p>').join('')+'\u003c/div>\u003cdiv class=\"actions\">\u003cbutton onclick=\"renderPanel()\">Back to Mail\u003c/button>\u003c/div>'}function setMailFilter(v){state.mailFilter=v;renderPanel()}function mailList(){let filters=['All','Scout','Battle','Gather','Alliance','World'],unread=state.reports.filter(x=>!x.read).length,items=state.reports.filter(x=>state.mailFilter==='All'||mailCategory(x.kind)===state.mailFilter);return '\u003ch2>✉ WORLD MAP MAIL · '+unread+' UNREAD\u003c/h2>\u003cp>World Map activity and operation reports are stored here.\u003c/p>\u003cdiv class=\"actions\">'+filters.map(f=>'\u003cbutton onclick=\"setMailFilter(\\''+f+'\\')\" style=\"border-color:'+(state.mailFilter===f?'#68e6ff':'#25516c')+'\">'+f+'\u003c/button>').join('')+'\u003c/div>'+(items.map(x=>'\u003cbutton class=\"report\" style=\"display:block;width:100%;text-align:left;color:#e4f5ff\" onclick=\"showMail('+x.id+')\">\u003cstrong>'+(x.read?'':'● ')+safeMail(x.kind)+' · '+safeMail(x.target)+'\u003c/strong>\u003cbr>\u003csmall>'+safeMail(x.time)+'\u003c/small>\u003cp>'+safeMail(x.details.split(' | ')[0])+'\u003c/p>\u003c/button>').join('')||'\u003cp>No messages in this category yet.\u003c/p>')}function availableBots(){return Math.max(0,state.bots-state.marches.filter(m=>m.kind==='Attack').reduce((s,m)=>s+(m.survivors===undefined?m.bots:m.survivors),0)-state.reinforcements.reduce((s,x)=>s+x.bots,0)-state.marches.filter(m=>m.kind==='Reinforce').reduce((s,m)=>s+m.bots,0))}\nfunction reinforce(n){if(!n||(n.id!=='a'&&n.type!=='friendly')){message('You can reinforce only your own alliance HQ or alliance members.');return}if(availableBots()\u003c100){message('Reinforcement requires 100 available bots.');return}if(state.reinforcements.some(x=>x.target===n.id)||state.marches.some(m=>m.kind==='Reinforce'&&m.target===n.id)){message('100 bots are already reinforcing this location.');return}state.marches.push({kind:'Reinforce',target:n.id,bots:100,arrive:Date.now()+duration(n)*1000,stage:'outbound'});save();addReport('REINFORCE',n,'100 bots dispatched | Destination: '+n.name+' | ETA: '+duration(n)+'s | Status: en route');message('100 bots automatically dispatched to '+n.name+'. They remain committed until recalled.')}\nfunction recallReinforcement(id){let x=state.reinforcements.find(x=>x.target===id);if(!x)return;let n=nodes.find(n=>n.id===id);state.reinforcements=state.reinforcements.filter(x=>x.target!==id);state.marches.push({kind:'Reinforce',target:id,bots:x.bots,arrive:Date.now()+duration(n)*1000,stage:'returning'});save();addReport('REINFORCE',n,'100 bots recalled | Returning to your HQ | Travel time: '+duration(n)+'s');renderPanel()}\nfunction simulationStep(now){if(!state.simEnabled||now\u003cstate.simNext)return false;let actors=nodes.filter(n=>n.type==='enemy'),actor=actors[rnd(0,actors.length-1)],kind=['Scout','Gather','Attack','Reinforce'][rnd(0,3)],target=kind==='Gather'?nodes.filter(n=>n.type==='resource')[rnd(0,2)]:kind==='Reinforce'?nodes.find(n=>n.id==='b'):kind==='Attack'?nodes.find(n=>n.id==='friend'):nodes.find(n=>n.id==='a');let seconds=Math.max(20,Math.round(distance(actor,target)/5));state.simMarches.push({id:now,actor:actor.name,actorLevel:actor.level,kind,target:target.name,arrive:now+seconds*1000,stage:'outbound',bots:kind==='Attack'?Math.max(40,actor.level*45):kind==='Reinforce'?100:0});state.simNext=now+(rnd(30,75)*1000);state.simMarches=state.simMarches.slice(-12);save();return true}\nfunction simulationTick(now){let changed=false;for(const m of state.simMarches){if(now\u003cm.arrive)continue;if(m.stage==='outbound'){m.stage=m.kind==='Gather'?'gathering':m.kind==='Reinforce'?'stationed':'returning';m.arrive=now+(m.kind==='Gather'?rnd(70,160)*1000:rnd(25,65)*1000);let details='Simulated player: '+m.actor+' | HQ level: '+m.actorLevel+' | Target: '+m.target+' | Operation: '+m.kind+' | '+(m.kind==='Attack'?'Attack strength assessed against defender. No live-game resources or bots changed.':m.kind==='Scout'?'Recon completed; simulated intelligence collected.':m.kind==='Reinforce'?'100 simulated bots stationed to defend territory.':'Resource collection in progress.');addReport('SIM '+m.kind.toUpperCase(),{name:m.actor},details);changed=true}else if(m.stage==='gathering'){m.stage='returning';m.arrive=now+rnd(25,65)*1000;addReport('SIM GATHER',{name:m.actor},'Gathering completed at '+m.target+'. Simulated resources only.');changed=true}else if(m.stage==='returning'){m.done=true;changed=true}}if(changed){state.simMarches=state.simMarches.filter(m=>!m.done);save()}return changed}\nfunction attackPower(count,hq,tier,research){return Math.round(count*(8+tier*5)*(1+research*.12)*(1+hq*.09))}\nfunction defenderPower(n){return Math.round((80+n.level*115)*(8+Math.max(1,Math.ceil(n.level/3))*5)*(1+n.level*.10)*(1+n.level*.09))}\nfunction prepareAttack(n){if(!n||n.type!=='enemy'){message('You can only attack enemy players.');return}let available=availableBots();panel.innerHTML='\u003ch2>⚔ DEPLOY BOTS · '+n.name+'\u003c/h2>\u003cp>Enemy HQ '+n.level+' · Your HQ '+state.hq+'\u003c/p>\u003cp>Available bots: '+available+' · Tier '+state.botTier+' · Attack research '+state.research.attack+'\u003c/p>\u003cp>Estimated enemy strength: '+defenderPower(n).toLocaleString()+' · Scouting recommended.\u003c/p>\u003cp>Choose bots to commit. Deployed bots are unavailable until they return; casualties are permanently lost.\u003c/p>\u003cinput id=\"botCount\" type=\"number\" min=\"1\" max=\"'+available+'\" value=\"'+Math.min(available,200)+'\" style=\"width:100%;padding:12px;background:#081523;color:#fff;border:1px solid #32718a;border-radius:8px\">\u003cdiv class=\"actions\">\u003cbutton onclick=\"launchAttack()\">Launch Attack\u003c/button>\u003cbutton onclick=\"renderPanel()\">Cancel\u003c/button>\u003c/div>'}\nfunction launchAttack(){let count=Number(document.getElementById('botCount')?.value);if(!Number.isInteger(count)||count\u003c1||count>availableBots()){message('Choose a valid number of available bots.');return}march('Attack',selected,count)}\nfunction march(kind,n,bots=0){if(!n)return;if(kind==='Attack'&&n.type!=='enemy'){message('Friendly protection: you cannot attack your own HQ, alliance HQ or alliance members.');return}if(kind==='Scout'&&n.type!=='enemy'){message('Select an enemy HQ to scout.');return}if(kind==='Gather'&&n.type!=='resource'){message('Select a resource node to gather.');return}if(state.marches.some(m=>m.target===n.id&&m.kind===kind)){message('A '+kind+' mission is already travelling to this target.');return}let energy=kind==='Attack'?30:kind==='Scout'?10:15,credits=kind==='Scout'?Math.max(20,n.level*12):0;if(state.energy\u003cenergy||state.personalCredits\u003ccredits){message('Insufficient resources. Requires '+energy+' energy'+(credits?' and '+credits+' credits':'')+'.');return}if(kind==='Attack'&&(!Number.isInteger(bots)||bots\u003c1||bots>availableBots())){message('Not enough available bots.');return}state.energy-=energy;state.personalCredits-=credits;state.marches.push({kind,target:n.id,bots,arrive:Date.now()+duration(n)*1000,stage:'outbound'});save();addReport('DISPATCH',n,kind+' operation dispatched | Target: '+n.name+' | Travel time: '+duration(n)+'s'+(bots?' | Bots committed: '+bots:'')+(credits?' | Credits spent: '+credits:''));message(kind+' dispatched · ETA '+duration(n)+'s'+(credits?' · Recon cost '+credits+' credits':'')+(bots?' · '+bots+' bots deployed':''))}\nfunction message(t){panel.innerHTML='\u003ch2>◈ COMMAND UPDATE\u003c/h2>\u003cp>'+t+'\u003c/p>\u003cdiv class=\"actions\">\u003cbutton onclick=\"renderPanel()\">Close\u003c/button>\u003c/div>'}function networkBackdrop(){let svg='\u003csvg class=\"network-circuit\" viewBox=\"0 0 1200 1200\" aria-hidden=\"true\">\u003cdefs>\u003cradialGradient id=\"chipGlow\">\u003cstop stop-color=\"#16465b\"/>\u003cstop offset=\"1\" stop-color=\"#061624\"/>\u003c/radialGradient>\u003c/defs>';let routes=[[90,210,240,210,290,260,420,260],[70,680,230,680,285,610,420,610],[420,260,420,420,600,420,600,600],[420,610,520,610,600,690,780,690],[780,690,850,690,850,780,1040,780],[600,420,680,420,680,460,900,460],[850,780,850,910,1000,910,1070,980],[240,210,240,360,270,390,270,530],[600,600,680,600,780,640,900,640],[900,350,980,350,1020,300,1130,300],[270,530,160,530,160,810,300,810],[520,320,520,210,690,210,780,300]];routes.forEach((p,i)=>{let d='M'+p[0]+' '+p[1]+' L'+p[2]+' '+p[3]+' L'+p[4]+' '+p[5]+' L'+p[6]+' '+p[7];svg+='\u003cpath class=\"trace '+(i%3===0?'hot':i%2?'alt':'')+'\" d=\"'+d+'\"/>\u003cpath class=\"signal '+(i%3===0?'violet':'')+'\" d=\"'+d+'\"/>';for(let j=0;j\u003cp.length;j+=2){svg+='\u003ccircle class=\"pad\" cx=\"'+p[j]+'\" cy=\"'+p[j+1]+'\" r=\"'+(j===0?6:3)+'\"/>'}});for(let i=0;i\u003c45;i++){let x=50+(i*173)%1100,y=60+(i*317)%1070;svg+='\u003ccircle class=\"junction\" cx=\"'+x+'\" cy=\"'+y+'\" r=\"'+(i%5===0?3:1.5)+'\"/>'}return svg+'\u003c/svg>'}\nfunction renderMap(){field.querySelectorAll('.node,.territory,.network-circuit').forEach(e=>e.remove());field.insertAdjacentHTML('afterbegin',networkBackdrop());state.territories.forEach(t=>{let n=nodes.find(n=>n.id===t.id);if(!n)return;let e=document.createElement('div');e.className='territory';e.style.cssText='left:'+(n.x-70)+'px;top:'+(n.y-70)+'px;width:140px;height:140px';field.append(e)});nodes.forEach(n=>{let b=document.createElement('button');b.className='node '+n.type;b.style.left=n.x+'px';b.style.top=n.y+'px';b.innerHTML=({me:'⌂',enemy:'⬡',alliance:'◈',resource:'◆'})[n.type]+'\u003cspan>'+n.name+'\u003c/span>';b.onclick=()=>{selected=n;renderPanel()};field.append(b)});applyTransform()}function applyTransform(){field.style.transform='translate('+offsetX+'px,'+offsetY+'px) scale('+scale+')';document.getElementById('coords').textContent='Sector 043 · Coordinates '+Math.round((map.clientWidth/2-offsetX)/scale)+','+Math.round((map.clientHeight/2-offsetY)/scale)+' · HQ '+state.hq}function center(){offsetX=map.clientWidth/2-nodes[0].x*scale;offsetY=map.clientHeight/2-nodes[0].y*scale;applyTransform()}function zoom(f){let cx=(map.clientWidth/2-offsetX)/scale,cy=(map.clientHeight/2-offsetY)/scale;scale=Math.min(1.8,Math.max(.32,scale*f));offsetX=map.clientWidth/2-cx*scale;offsetY=map.clientHeight/2-cy*scale;applyTransform()}function renderNav(){document.getElementById('nav').innerHTML=[['World','◎'],['Alliance','⬡'],['Gather','◆'],['Marches','➤'],['Mail','✉'],['Locate','⌕']].map(([name,icon])=>'\u003cbutton class=\"'+(tab===name?'active':'')+'\" onclick=\"switchTab(\\''+name+'\\')\">\u003cb>'+icon+'\u003c/b>'+name+(name==='Mail'&&state.reports.some(x=>!x.read)?' ●'+state.reports.filter(x=>!x.read).length:'')+'\u003c/button>').join('')}function switchTab(t){tab=t;selected=null;renderNav();renderPanel()}function renderPanel(){if(selected){let n=selected,buttons=n.type==='enemy'?'\u003cbutton onclick=\"march(\\'Scout\\',selected)\">◉ Scout\u003c/button>\u003cbutton onclick=\"prepareAttack(selected)\">⚔ Attack\u003c/button>':n.type==='resource'?'\u003cbutton onclick=\"march(\\'Gather\\',selected)\">◆ Gather\u003c/button>':n.type==='alliance'?n.id==='a'?'\u003cbutton onclick=\"claim()\">⬡ Build Territory\u003c/button>\u003cbutton onclick=\"reinforce(selected)\">🛡 Reinforce 100 Bots\u003c/button>':'\u003cbutton onclick=\"message(\\'Rival alliance HQ. Reinforcements unavailable.\\')\">Rival Alliance\u003c/button>':n.type==='friendly'?'\u003cbutton onclick=\"reinforce(selected)\">🛡 Reinforce 100 Bots\u003c/button>':'\u003cbutton onclick=\"openHQ()\">⌂ Open HQ\u003c/button>\u003cbutton onclick=\"teleport()\">⌖ Teleport HQ\u003c/button>';panel.innerHTML='\u003ch2>'+n.name+'\u003c/h2>\u003cp>'+n.type.toUpperCase()+' · Level '+n.level+' · '+distance(nodes[0],n)+' units from HQ\u003c/p>\u003cdiv class=\"actions\">'+buttons+'\u003cbutton onclick=\"selected=null;renderPanel()\">Close\u003c/button>\u003c/div>';return}let html={World:'\u003ch2>◈ WORLD COMMAND\u003c/h2>\u003cp>Select a base or resource node to scout, attack, gather or expand. Drag to pan the world.\u003c/p>\u003cspan class=\"tag\">HQ '+state.hq+'\u003c/span>\u003cspan class=\"tag\">Network energy '+state.energy+'\u003c/span>\u003cspan class=\"tag\">Teleport charges '+state.teleports+'\u003c/span>\u003cspan class=\"tag\">Bots '+availableBots()+'/'+state.bots+'\u003c/span>',Alliance:'\u003ch2>⬡ ALLIANCE TERRITORY\u003c/h2>\u003cp>Select NEON Collective HQ to establish your first territory. Each build costs 200 alliance credits. Additional connected buildings will be added in the next expansion update.\u003c/p>\u003cspan class=\"tag\">Alliance credits '+state.allianceCredits+'\u003c/span>\u003cspan class=\"tag\">Territory nodes '+state.territories.length+'\u003c/span>\u003cdiv class=\"actions\">\u003cbutton onclick=\"selected=nodes[1];renderPanel()\">Choose Alliance HQ\u003c/button>\u003c/div>',Gather:'\u003ch2>◆ RESOURCE NETWORK\u003c/h2>\u003cp>Gather from personal resource nodes using timed marches. Alliance nodes feed shared alliance storage.\u003c/p>\u003cspan class=\"tag\">Personal credits '+state.personalCredits+'\u003c/span>\u003cspan class=\"tag\">Gathered '+state.gathered+'\u003c/span>',Marches:'\u003ch2>➤ ACTIVE OPERATIONS\u003c/h2>\u003cp>Your missions and simulated player activity. Simulated actions do not consume your resources.\u003c/p>'+(state.marches.map(m=>'\u003cp>'+m.kind+' → '+m.target+(m.bots?' · '+m.bots+' bots':'')+' · '+m.stage+' · '+Math.max(0,Math.ceil((m.arrive-Date.now())/1000))+'s\u003c/p>').join('')||'\u003cp>No player marches\u003c/p>')+'\u003ch2>🛡 ALLIANCE GARRISON\u003c/h2>'+(state.reinforcements.map(x=>'\u003cp>100 bots defending '+x.name+' \u003cbutton onclick=\"recallReinforcement(\\''+x.target+'\\')\">Recall\u003c/button>\u003c/p>').join('')||'\u003cp>No bots stationed\u003c/p>')+'\u003ch2>◈ SIMULATED PLAYER ACTIVITY\u003c/h2>'+(state.simMarches.map(m=>'\u003cp>'+m.actor+' · '+m.kind+' → '+m.target+' · '+m.stage+(m.stage==='stationed'?'':(' · '+Math.max(0,Math.ceil((m.arrive-Date.now())/1000))+'s'))+'\u003c/p>').join('')||'\u003cp>Waiting for simulated players...\u003c/p>'),Mail:mailList(),Locate:'\u003ch2>⌕ COORDINATE CONTROL\u003c/h2>\u003cp>Recenter your HQ or move it to an open location using a teleport charge.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton onclick=\"center()\">Locate HQ\u003c/button>\u003cbutton onclick=\"teleport()\">Teleport HQ\u003c/button>\u003c/div>'};panel.innerHTML=html[tab]}function openHQ(){message('HQ navigation is ready for integration. This standalone World Map cannot open the existing development HQ until both are combined.')}function claim(){let n=selected;if(!n||n.type!=='alliance')return;if(n.id!=='a'){message('This is a rival alliance HQ. You cannot claim its territory.');return}if(state.allianceCredits\u003c200){message('Not enough alliance credits.');return}if(state.territories.some(t=>t.id===n.id)){message('This location is already claimed.');return}state.allianceCredits-=200;state.territories.push({id:n.id});save();renderMap();addReport('TERRITORY',n,'Alliance territory established | Credits spent: 200 | Location: '+n.name);message('Alliance territory established. Further territory must connect to existing territory.')}function teleport(){if(state.teleports\u003c1){message('No teleport charges available.');return}state.teleports--;nodes[0].x=rnd(430,770);nodes[0].y=rnd(430,770);state.hqPos={x:nodes[0].x,y:nodes[0].y};save();renderMap();center();addReport('TELEPORT',nodes[0],'HQ relocated | New coordinates: '+nodes[0].x+','+nodes[0].y+' | Teleport charge consumed: 1');message('HQ relocated. One teleport charge consumed.')}function tick(){let now=Date.now(),changed=false;state.marches.forEach(m=>{if(now\u003cm.arrive)return;let n=nodes.find(n=>n.id===m.target);if(m.stage==='outbound'){if(m.kind==='Reinforce'){state.reinforcements.push({target:n.id,name:n.name,bots:100});addReport('REINFORCE',n,'100 bots arrived and are now stationed at '+n.name+'. They remain unavailable until recalled.');m.done=true;changed=true;return}if(m.kind==='Gather'){m.stage='gathering';m.arrive=now+gatherTime(n);changed=true;return}m.stage='returning';m.arrive=now+duration(n)*1000;if(m.kind==='Scout'){addReport('SCOUT',n,'Target: '+n.name+' | HQ level: '+n.level+' | Distance: '+distance(nodes[0],n)+' | Estimated defence: '+(n.level*120)+' | Threat: '+(n.level>state.hq?'HIGH — reinforce before attacking':'MODERATE — within your HQ range')+' | Recommendation: '+(n.level>state.hq?'Upgrade and scout again.':'Attack with sufficient operators.'))}else if(m.kind==='Attack'){let attacker=attackPower(m.bots,state.hq,state.botTier,state.research.attack),defender=defenderPower(n),gap=n.level-state.hq,win=gap\u003c10&&attacker>defender*1.12,ratio=attacker/Math.max(1,defender),lossRate=win?Math.min(.42,Math.max(.08,.35/Math.max(1,ratio))):Math.min(.95,Math.max(.48,.9-ratio*.18)),losses=Math.min(m.bots,Math.max(1,Math.round(m.bots*lossRate))),survivors=m.bots-losses,loot=win?40+n.level*12:0;m.survivors=survivors;state.bots=Math.max(0,state.bots-losses);addReport('BATTLE',n,'Outcome: '+(win?'VICTORY':'DEFEAT')+' | Bots deployed: '+m.bots+' | Bots lost: '+losses+' | Bots returning: '+survivors+' | Attacker power: '+attacker.toLocaleString()+' | Defender power: '+defender.toLocaleString()+' | Attacker HQ: '+state.hq+' | Defender HQ: '+n.level+' | Bot tier: '+state.botTier+' | Attack research: '+state.research.attack+' | Credits looted: '+loot+' | '+(gap>=10?'HQ gap protection: victory impossible.':win?'Attack successful.':'Insufficient effective combat power.'));if(win)state.personalCredits+=loot}changed=true}else if(m.stage==='gathering'){let reward=n.level*75;state.personalCredits+=reward;state.gathered+=reward;addReport('GATHER',n,'Resource: '+n.name+' | Node level: '+n.level+' | Collection time: '+Math.round(gatherTime(n)/1000)+'s | Credits collected: '+reward+' | Returning to HQ.');m.stage='returning';m.arrive=now+duration(n)*1000;changed=true}else{m.done=true;changed=true}});if(changed){state.marches=state.marches.filter(m=>!m.done);save()}simulationStep(now);simulationTick(now);document.getElementById('clock').textContent=new Date().toLocaleTimeString();if((tab==='Marches'||tab==='Mail ustify-content:space-between!important;gap:5px!important;align-items:center!important;padding:5px 8px!important;margin:0 0 3px!important;font-size:9px!important;min-height:27px!important}#map .nd-team-activity{display:flex!important;gap:5px!important;align-items:center!important;padding:4px 7px!important;margin:0 0 3px!important;min-height:24px!important;max-height:28px!important;overflow:hidden!important}#map .nd-team-activity strong{font-size:0!important;flex:none}#map .nd-team-activity strong:before{content:\"⚔ LOG\";font-size:9px!important;color:#b8a0ff}#map #teamActivity{display:block!important;white-space:nowrap!important;text-overflow:ellipsis!important;overflow:hidden!important;font-size:9px!important;flex:1}#map .nd-siege-instructions{display:flex!important;justify-content:space-between!important;align-items:center!important;gap:4px!important;padding:5px 7px!important;margin:0 0 3px!important;min-height:26px!important}#map .nd-siege-instructions strong{white-space:nowrap!important;font-size:8px!important}#map #siegeBanner{overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;font-size:9px!important}#map .nd-map-stage{margin-top:0!important;padding:3px!important}#map .map{height:min(73dvh,650px)!important;min-height:390px!important}@media(max-height:720px){#map .map{height:66dvh!important;min-height:330px!important}}\u003c/style>\u003c/head>\u003cbody>\u003cheader class=\"header\">\u003cdiv class=\"headtop\">\u003cspan class=\"tag\">THE MATRIX // EVENT COMMAND\u003c/span>\u003cspan class=\"status\">● DEV SIMULATION\u003c/span>\u003c/div>\u003ch1>◈ NETWORK DOMINION\u003c/h1>\u003cdiv class=\"sub\">SERVER WARFARE · COMMAND CORE · V 0.5.4\u003c/div>\u003c/header>\u003cmain>\n\u003csection id=\"overview\" class=\"page\">\u003cdiv class=\"nd-event-banner\">\u003cstrong>◈ NETWORK DOMINION\u003c/strong>\u003csmall>SERVER WAR · ACTIVE\u003c/small>\u003c/div>\u003cdiv class=\"panel hero\">\u003cdiv class=\"tag\">OPERATION 001 // NEXUS GRID\u003c/div>\u003ch2 style=\"font-size:18px;margin-top:9px\">Two servers. One network.\u003c/h2>\u003cdiv class=\"sub\">SYSTEM MOBILISATION · PREPARATION DAY \u003cspan id=\"activeDay\">3\u003c/span>\u003c/div>\u003cdiv class=\"versus\">\u003cdiv class=\"faction\">\u003csmall>YOUR SERVER\u003c/small>\u003cb class=\"cyan\">SERVER 43\u003c/b>\u003csmall>CYAN PROTOCOL\u003c/small>\u003c/div>\u003cb class=\"gold\">VS\u003c/b>\u003cdiv class=\"faction enemy\">\u003csmall>RIVAL SERVER\u003c/small>\u003cb class=\"red\">SERVER 67\u003c/b>\u003csmall>RED PROTOCOL\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"bar\">\u003ci id=\"mainbar\">\u003c/i>\u003c/div>\u003cdiv class=\"row small\">\u003cb class=\"cyan\" id=\"serverScore\">\u003c/b>\u003cspan class=\"muted\">INFLUENCE\u003c/span>\u003cb class=\"red\" id=\"enemyScore\">\u003c/b>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" data-go=\"prep\">EARN POINTS\u003c/button>\u003cbutton class=\"btn\" data-go=\"map\">WAR MAP\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"panel\">\u003ch2>EVENT TIMELINE\u003c/h2>\u003cdiv class=\"timeline\">\u003cdiv>\u003cb>✓\u003c/b>Detection\u003c/div>\u003cdiv class=\"current\">\u003cb>02\u003c/b>Mobilise\u003c/div>\u003cdiv>\u003cb>03\u003c/b>War\u003c/div>\u003cdiv>\u003cb>04\u003c/b>Recovery\u003c/div>\u003c/div>\u003cp class=\"sub\" style=\"line-height:1.6\">Development simulation: preparation and war mechanics can both be tested now. Captures generate Dominion Points; preparation objectives generate Influence.\u003c/p>\u003c/div>\u003cdiv class=\"section\">YOUR COMMAND STATUS\u003c/div>\u003cdiv class=\"metrics\">\u003cdiv class=\"metric\">\u003cb id=\"overviewInfluence\">\u003c/b>\u003csmall>Influence\u003c/small>\u003c/div>\u003cdiv class=\"metric\">\u003cb id=\"overviewDominion\">\u003c/b>\u003csmall>Dominion\u003c/small>\u003c/div>\u003cdiv class=\"metric\">\u003cb id=\"overviewTroops\">\u003c/b>\u003csmall>Botnets Ready\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"panel\">\u003ch2>COMMAND BRIEFING\u003c/h2>\u003cdiv class=\"item\">\u003cdiv class=\"ico\">🛰️\u003c/div>\u003cdiv class=\"info\">\u003cb>Scout enemy sectors\u003c/b>\u003csmall>Spend Intel to reveal their defences and attack probability.\u003c/small>\u003c/div>\u003cbutton class=\"btn\" data-go=\"map\">OPEN\u003c/button>\u003c/div>\u003cdiv class=\"item\">\u003cdiv class=\"ico\">⚔️\u003c/div>\u003cdiv class=\"info\">\u003cb>Capture the Nexus Grid\u003c/b>\u003csmall>Win battles, hold territory and earn Dominion Points.\u003c/small>\u003c/div>\u003cbutton class=\"btn\" data-go=\"map\">OPEN\u003c/button>\u003c/div>\u003cdiv class=\"item\">\u003cdiv class=\"ico\">🏆\u003c/div>\u003cdiv class=\"info\">\u003cb>Claim event milestones\u003c/b>\u003csmall>Earn Influence from preparation and combat operations.\u003c/small>\u003c/div>\u003cbutton class=\"btn\" data-go=\"rewards\">OPEN\u003c/button>\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"prep\" class=\"page hide\">\u003cdiv class=\"panel hero\">\u003cdiv class=\"tag\">PHASE 2 // PREPARATION\u003c/div>\u003ch2>SYSTEM MOBILISATION\u003c/h2>\u003cp class=\"sub\">Complete operations to build Influence and prepare your forces for the Dominion War.\u003c/p>\u003cdiv class=\"metrics\">\u003cdiv class=\"metric\">\u003cb id=\"prepInfluence\">\u003c/b>\u003csmall>Your Influence\u003c/small>\u003c/div>\u003cdiv class=\"metric\">\u003cb id=\"prepEnergy\">\u003c/b>\u003csmall>Energy\u003c/small>\u003c/div>\u003cdiv class=\"metric\">\u003cb id=\"prepIntel\">\u003c/b>\u003csmall>Intel\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"section\">FIVE-DAY OPERATION ROTATION\u003c/div>\u003cdiv class=\"days\" id=\"days\">\u003c/div>\u003cdiv class=\"panel\">\u003ch2 id=\"dayTitle\">\u003c/h2>\u003cdiv id=\"tasks\">\u003c/div>\u003c/div>\u003cdiv class=\"panel\">\u003ch2>BOTNET COMMAND\u003c/h2>\u003cdiv class=\"row\">\u003cdiv>\u003cb id=\"botnetCount\">\u003c/b>\u003cdiv class=\"sub\">Available combat units\u003c/div>\u003c/div>\u003cbutton class=\"btn green\" id=\"train\">TRAIN 50 · 20 ENERGY\u003c/button>\u003c/div>\u003cp class=\"sub\">Training consumes Energy and produces units that can be deployed in sector battles.\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003ch2>SUPPLY REGENERATION\u003c/h2>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" id=\"rest\">REPLENISH SUPPLIES\u003c/button>\u003cbutton class=\"btn\" id=\"recon\">RECON MISSION · 10 ENERGY\u003c/button>\u003c/div>\u003cp class=\"sub\">Replenishment has a 60-second cooldown. Recon missions generate Intel and preparation Influence.\u003c/p>\u003c/div>\u003c/section>\n\u003csection id=\"map\" class=\"page hide\">\u003cdiv class=\"nd-war-banner\">◈ \u003cb>SERVER 43\u003c/b> // NEXUS CONTROL // \u003cb>SERVER 67\u003c/b>\u003c/div>\u003cdiv class=\"nd-control-strip\">\u003cspan>◉ NEXUS CORE\u003c/span>\u003cb id=\"mapHolder\">CONTESTED\u003c/b>\u003cspan id=\"mapTimer\">--:-- LEFT\u003c/span>\u003c/div>\u003cdiv class=\"nd-team-activity\">\u003cstrong>⚔ ALLIANCE WAR ACTIVITY\u003c/strong>\u003cdiv id=\"teamActivity\">Awaiting simulated attacks...\u003c/div>\u003c/div>\u003cdiv class=\"nd-siege-instructions\">\u003cspan id=\"siegeBanner\">PREPARING...\u003c/span>\u003cstrong> · CAPTURE 2/4 TO UNLOCK NEXUS\u003c/strong>\u003c/div>\u003cdiv class=\"panel nd-map-stage\">\u003csvg class=\"map\" viewBox=\"0 0 340 315\" aria-label=\"Interactive Nexus Grid battlefield\">\u003cdefs>\u003cradialGradient id=\"ndbg\">\u003cstop stop-color=\"#1a4054\"/>\u003cstop offset=\"1\" stop-color=\"#081722\"/>\u003c/radialGradient>\u003clinearGradient id=\"ndPipe\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\u003cstop stop-color=\"#50f4ff\"/>\u003cstop offset=\"1\" stop-color=\"#a87bff\"/>\u003c/linearGradient>\u003c/defs>\u003crect width=\"340\" height=\"315\" fill=\"url(#ndbg)\"/>\u003cg class=\"nd-pipes\" fill=\"none\">\u003cpath d=\"M170 153L72 66 M170 153L268 66 M170 153L72 246 M170 153L268 246 M72 66H268 M72 246H268 M72 66V246 M268 66V246\" stroke=\"#214c66\" stroke-width=\"7\"/>\u003cpath d=\"M170 153L72 66 M170 153L268 66 M170 153L72 246 M170 153L268 246 M72 66H268 M72 246H268 M72 66V246 M268 66V246\" stroke=\"url(#ndPipe)\" stroke-width=\"2.5\" stroke-dasharray=\"5 13\" class=\"nd-pipe-pulse\"/>\u003c/g>\u003cg id=\"mapNodes\">\u003c/g>\u003ctext x=\"170\" y=\"304\" text-anchor=\"middle\" fill=\"#9cb8ca\" font-size=\"9\">SELECT A BUILDING TO OPEN ITS COMMANDS\u003c/text>\u003c/svg>\u003cdiv class=\"nd-map-legend\">\u003cspan style=\"color:#5bf3df\">● UNITY\u003c/span>\u003cspan style=\"color:#7ba9ff\">● NEXUS GUARD\u003c/span>\u003cspan style=\"color:#ff657d\">● RED LEGION\u003c/span>\u003cspan style=\"color:#b98aff\">● CIPHER ORDER\u003c/span>\u003cspan style=\"color:#e4b65f\">● AUTOMATED\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"panel\">\u003ch2>DOMINION POINT GENERATION\u003c/h2>\u003cp class=\"sub\" id=\"productionText\">\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn green\" id=\"collect\">COLLECT SECTOR OUTPUT\u003c/button>\u003cbutton class=\"btn\" id=\"repair\">REPAIR 40 UNITS · 20 ENERGY\u003c/button>\u003c/div>\u003cp class=\"sub\">Captured sectors generate points over real elapsed time, capped at one hour of uncollected output. State is saved on this device.\u003c/p>\u003c/div>\u003cdiv class=\"panel\">\u003ch2>COMBAT REPORTS\u003c/h2>\u003cdiv id=\"reports\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"ranks\" class=\"page hide\">\u003cdiv class=\"panel hero\">\u003cdiv class=\"tag\">CROSS-SERVER INTELLIGENCE\u003c/div>\u003ch2>DOMINION RANKINGS\u003c/h2>\u003cp class=\"sub\">Test leaderboards with simulated opponents. Your score updates from your own event actions.\u003c/p>\u003cdiv class=\"actions\">\u003cbutton class=\"btn primary\" id=\"playersBtn\">PLAYERS\u003c/button>\u003cbutton class=\"btn\" id=\"alliancesBtn\">ALLIANCES\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"panel nd-control-board\">\u003cdiv class=\"tag\">NEXUS CORE // CONTROL CHAMPIONSHIP\u003c/div>\u003ch2>LIVE HOLD-TIME LEADERBOARD\u003c/h2>\u003cdiv class=\"metrics\">\u003cdiv class=\"metric\">\u003cb id=\"eventCountdown\">--:--\u003c/b>\u003csmall>EVENT REMAINING\u003c/small>\u003c/div>\u003cdiv class=\"metric\">\u003cb id=\"currentHolder\">--\u003c/b>\u003csmall>CURRENT HOLDER\u003c/small>\u003c/div>\u003cdiv class=\"metric\">\u003cb id=\"yourHold\">00:00\u003c/b>\u003csmall>YOUR HOLD TIME\u003c/small>\u003c/div>\u003c/div>\u003cp class=\"sub\">The player and alliance with the longest accumulated Nexus Core control time win at the end of this simulated match. Opponents can recapture the core.\u003c/p>\u003cdiv id=\"winnerStatus\" class=\"nd-winner-status\">\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" id=\"simulationToggle\">PAUSE SIMULATION\u003c/button>\u003cbutton class=\"btn\" id=\"simulationSpeed\">SPEED: 1×\u003c/button>\u003c/div>\u003c/div>\u003cdiv class=\"panel\">\u003ch2 id=\"rankTitle\">\u003c/h2>\u003cdiv id=\"rankList\">\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"rewards\" class=\"page hide\">\u003cdiv class=\"panel hero\">\u003cdiv class=\"tag\">DOMINION VAULT\u003c/div>\u003ch2>PERSONAL MILESTONE CHESTS\u003c/h2>\u003cp class=\"sub\">Influence from training, scouting, missions and battles unlocks reward chests.\u003c/p>\u003cdiv class=\"bar\" style=\"background:#173449\">\u003ci id=\"rewardBar\">\u003c/i>\u003c/div>\u003cdiv class=\"row small\">\u003cb id=\"rewardProgress\">\u003c/b>\u003cspan class=\"muted\">200,000 TARGET\u003c/span>\u003c/div>\u003c/div>\u003cdiv class=\"panel\">\u003ch2>REWARD TRACK\u003c/h2>\u003cdiv class=\"chests\" id=\"chests\">\u003c/div>\u003c/div>\u003cdiv class=\"panel\">\u003ch2>ADDITIONAL REWARDS\u003c/h2>\u003cdiv class=\"item\">\u003cdiv class=\"ico\">🥇\u003c/div>\u003cdiv class=\"info\">\u003cb>Player Rankings\u003c/b>\u003csmall>Personal performance and special event titles.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"item\">\u003cdiv class=\"ico\">🤝\u003c/div>\u003cdiv class=\"info\">\u003cb>Alliance Contribution\u003c/b>\u003csmall>Coordinated server support and alliance standings.\u003c/small>\u003c/div>\u003c/div>\u003cdiv class=\"item\">\u003cdiv class=\"ico\">🌐\u003c/div>\u003cdiv class=\"info\">\u003cb>Server Victory\u003c/b>\u003csmall>Winning server rewards when the event is completed.\u003c/small>\u003c/div>\u003c/div>\u003c/div>\u003cdiv class=\"panel\">\u003ch2>DEVELOPMENT CONTROLS\u003c/h2>\u003cbutton class=\"btn danger\" id=\"reset\">RESET EVENT TEST PROGRESS\u003c/button>\u003cp class=\"sub\">Only clears this Network Dominion prototype's saved test data. Other THE MATRIX saves are unaffected.\u003c/p>\u003c/div>\u003c/section>\n\u003cdiv class=\"foot\">NETWORK DOMINION V 0.6.0 · LOCAL GAMEPLAY SIMULATION · NO LIVE ACCOUNT RESOURCES CHANGED\u003c/div>\u003c/main>\n\u003cnav class=\"tabs\" aria-label=\"Network Dominion navigation\">\u003cbutton data-go=\"overview\" class=\"active\">\u003cspan class=\"nd-icon\">\u003csvg viewBox=\"0 0 32 32\">\u003cpath d=\"M4 16L16 5L28 16V28H19V20H13V28H4Z\"/>\u003cpath d=\"M10 13H22\"/>\u003c/svg>\u003c/span>OVERVIEW\u003c/button>\u003cbutton data-go=\"prep\">\u003cspan class=\"nd-icon\">\u003csvg viewBox=\"0 0 32 32\">\u003cpath d=\"M19 2L6 18H15L12 30L27 13H18Z\"/>\u003c/svg>\u003c/span>PREPARE\u003c/button>\u003cbutton data-go=\"map\">\u003cspan class=\"nd-icon\">\u003csvg viewBox=\"0 0 32 32\">\u003ccircle cx=\"16\" cy=\"16\" r=\"12\"/>\u003ccircle cx=\"16\" cy=\"16\" r=\"5\"/>\u003cpath d=\"M16 1V9M16 23V31M1 16H9M23 16H31\"/>\u003c/svg>\u003c/span>WAR MAP\u003c/button>\u003cbutton data-go=\"ranks\">\u003cspan class=\"nd-icon\">\u003csvg viewBox=\"0 0 32 32\">\u003cpath d=\"M8 4H24V12C24 20 20 24 16 24S8 20 8 12Z\"/>\u003cpath d=\"M8 7H3V12C3 17 7 18 10 18M24 7H29V12C29 17 25 18 22 18M16 24V29M10 29H22\"/>\u003c/svg>\u003c/span>RANKS\u003c/button>\u003cbutton data-go=\"rewards\">\u003cspan class=\"nd-icon al=()=>({influence:84200,dominion:0,energy:120,intel:90,botnets:240,lost:0,day:2,claims:[],done:{},scouts:{},nodes:[{owner:'neutral',def:420,garrison:480},{owner:'neutral',def:470,garrison:520},{owner:'neutral',def:440,garrison:500},{owner:'neutral',def:490,garrison:540},{owner:'neutral',def:900,garrison:900}],reports:[],lastCollect:Date.now(),lastRest:0,earned:0});let state;try{state=Object.assign(initial(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){state=initial()}const UK_CLOCK=()=>{const f=new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',weekday:'short',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',hourCycle:'h23'});const p=Object.fromEntries(f.formatToParts(new Date()).filter(x=>x.type!=='literal').map(x=>[x.type,x.value]));return {day:p.weekday,date:p.year+'-'+p.month+'-'+p.day}};const isMonday=()=>UK_CLOCK().day==='Mon';const previewMode=()=>sessionStorage.getItem('nd_test_preview')==='yes';const eventOpen=()=>isMonday()||previewMode();const nextMonday=()=>{const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];const offset=(8-days.indexOf(UK_CLOCK().day))%7||7;return offset+' day'+(offset===1?'':'s')};const currentWeek=()=>{const d=new Date(UK_CLOCK().date+'T12:00:00Z');d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10)};const SIM_DURATION=20*60*1000;const SIEGE_COUNTDOWN=10*1000;const SCOUT_LIFETIME=30000;const hasScout=i=>typeof state.scouts[i]===\"number\"&&Date.now()-state.scouts[i]\u003cSCOUT_LIFETIME;const allianceColors={\"UNITY\":\"#5bf3df\",\"NEXUS GUARD\":\"#7ba9ff\",\"RED LEGION\":\"#ff657d\",\"CIPHER ORDER\":\"#b98aff\"};const sectorColor=n=>n.owner===\"neutral\"?\"#e4b65f\":allianceColors[n.claimAlliance]||(n.owner===\"you\"?\"#5bf3df\":\"#ff657d\");const siegeCounts=()=>({you:state.nodes.slice(0,4).filter(n=>n.owner==='you').length,enemy:state.nodes.slice(0,4).filter(n=>n.owner==='enemy').length});const siegeOpen=()=>eventOpen()&&Date.now()>=state.sim.started+SIEGE_COUNTDOWN;const canAttackCore=side=>siegeCounts()[side]>=2;const SIM_INTERVAL=7*1000;const SIM_PLAYERS=[{name:'YOU',alliance:'UNITY',server:'43'},{name:'GhostZero',alliance:'UNITY',server:'43'},{name:'NovaPulse',alliance:'UNITY',server:'43'},{name:'ByteKnight',alliance:'UNITY',server:'43'},{name:'CipherQueen',alliance:'RED LEGION',server:'67'},{name:'NullVector',alliance:'NEXUS GUARD',server:'43'},{name:'RedSpectre',alliance:'RED LEGION',server:'67'},{name:'HexBlade',alliance:'CIPHER ORDER',server:'67'},{name:'IronHex',alliance:'RED LEGION',server:'67'},{name:'NightRoot',alliance:'CIPHER ORDER',server:'67'}];function simInit(){if(!state.siegeV1){state.nodes=initial().nodes;state.scouts={};state.siegeV1=true;state.sim=null;}if(!state.sim||!Number.isFinite(state.sim.started)){state.sim={started:Date.now(),lastTick:Date.now(),lastRaid:Date.now(),holder:null,playerTimes:{},paused:false,speed:1,finished:false,winners:null,raidCount:0};}if(!state.sim.playerTimes)state.sim.playerTimes={};if(!state.sim.actorStats)state.sim.actorStats={};if(!state.sim.lastActions)state.sim.lastActions=[];if(!state.sim.teamV1){state.sim.teamV1=true;state.nodes.forEach(n=>{if(n.owner==='neutral')return;n.claimAlliance=n.claimAlliance||(n.owner==='you'?'UNITY':'RED LEGION');n.claimPlayer=n.claimPlayer||(n.owner==='you'?'YOU':'CipherQueen')});if(state.nodes[4].owner==='neutral')state.sim.holder=null;else if(state.sim.holder)state.nodes[4].claimPlayer=state.sim.holder;}if(!state.sim.rulesV2){state.sim.rulesV2=true;state.sim.started=Date.now();state.sim.lastTick=Date.now();state.sim.lastRaid=Date.now();state.sim.elapsed=0;state.sim.playerTimes={};state.sim.holder=null;state.nodes=initial().nodes;state.scouts={};}if(state.sim.weekKey!==currentWeek()){state.sim.weekKey=currentWeek();state.sim.started=Date.now();state.sim.lastTick=Date.now();state.sim.lastRaid=Date.now();state.sim.elapsed=0;state.sim.finished=false;state.sim.winners=null;state.sim.playerTimes={};state.sim.holder=null;state.nodes=initial().nodes;state.scouts={};state.claims=[];state.influence=0;state.dominion=0;state.sim.playerScores={};state.sim.allianceScores={};state.sim.serverScores={};}if(!state.sim.playerScores)state.sim.playerScores={};if(!state.sim.allianceScores)state.sim.allianceScores={};if(!state.sim.serverScores)state.sim.serverScores={};}simInit();const nodes=[{name:'DATA VAULT',x:72,y:66,rate:3,desc:'Produces extra Dominion Points and server resources.'},{name:'FIREWALL',x:268,y:66,rate:2,desc:'Defensive fortification supporting nearby sectors.'},{name:'RELAY',x:72,y:246,rate:3,desc:'Controls reinforcement traffic and data routing.'},{name:'CIPHER',x:268,y:246,rate:2,desc:'Offensive cipher node supporting attacks.'},{name:'NEXUS CORE',x:170,y:153,rate:10,desc:'Central objective with the highest Dominion Point generation.'}];const days=[['INFRASTRUCTURE',[['🏗️','Upgrade HQ infrastructure',2200,20],['⚙️','Improve production facilities',1600,16],['📦','Secure strategic resources',1100,12]]],['RESEARCH',[['🧪','Complete research protocol',2400,24],['🤖','Improve AI Core systems',1900,18],['💾','Analyse encrypted data',1200,12]]],['BOTNET EXPANSION',[['🦾','Train specialist botnets',2200,20],['🛠️','Manufacture combat hardware',1700,16],['📡','Complete tactical operations',1300,12]]],['INTELLIGENCE',[['🔎','Run a reconnaissance sweep',1900,18],['🛰️','Decode enemy communications',1700,16],['🤝','Coordinate alliance support',1300,12]]],['TOTAL MOBILISATION',[['🏢','Expand infrastructure',2100,20],['🧠','Finish research objectives',2100,20],['⚔️','Mobilise combat units',2100,20],['📡','Complete elite missions',1800,18]]]];let selected=4,rankMode='players',toastTimer;function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}function toast(s){let e=$('#toast');e.textContent=s;e.classList.remove('hide');clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.classList.add('hide'),2600)}function awardPoints(player,alliance,server,amount,reason){if(!state.sim||amount\u003c=0)return;const sim=state.sim;sim.playerScores[player]=(sim.playerScores[player]||0)+amount;sim.allianceScores[alliance]=(sim.allianceScores[alliance]||0)+amount;sim.serverScores[server]=(sim.serverScores[server]||0)+amount;if(player==='YOU')state.influence+=amount;report('+'+fmt(amount)+' WAR POINTS · '+player+' · '+reason)}function report(s){state.reports.unshift({t:new Date().toLocaleTimeString(),s:s});state.reports=state.reports.slice(0,15)}function go(id){if(id==='map'&&!eventOpen()){showClosedEvent();return;}$('.page').forEach(e=>e.classList.toggle('hide',e.id!==id));$$('.tabs button').forEach(e=>e.classList.toggle('active',e.dataset.go===id));window.scrollTo(0,0);render()}$$('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));function update(){save();render();renderSimulation()}function render(){const my=12840500+(state.sim.serverScores['43']||0);$('#serverScore').textContent=fmt(my);$('#enemyScore').textContent=fmt(10920300+(state.sim.serverScores['67']||0));$('#mainbar').style.width=(my/(my+10920300+(state.sim.serverScores['67']||0))*100)+'%';$('#overviewInfluence').textContent=fmt(state.influence);$('#overviewDominion').textContent=fmt(state.dominion);$('#overviewTroops').textContent=fmt(state.botnets);$('#prepInfluence').textContent=fmt(state.influence);$('#prepEnergy').textContent=fmt(state.energy);$('#prepIntel').textContent=fmt(state.intel);$('#botnetCount').textContent=fmt(state.botnets);$('#mapBotnets').textContent=fmt(state.botnets);$('#mapIntel').textContent=fmt(state.intel);$('#mapControl').textContent=state.nodes.filter(n=>n.owner==='you').length+'/5';$('#rewardBar').style.width=Math.min(100,state.influence/200000*100)+'%';$('#rewardProgress').textContent=fmt(state.influence);$('#activeDay').textContent=state.day+1;renderDays();renderTasks();renderMap();renderRanks();renderChests();renderReports();renderProduction()}function renderDays(){$('#days').innerHTML=days.map((d,i)=>'\u003cbutton class=\"'+(state.day===i?'active':'')+'\" data-day=\"'+i+'\">DAY '+(i+1)+'\u003c/

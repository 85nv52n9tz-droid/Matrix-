<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Black Market</title><style>
*{box-sizing:border-box}body{margin:0;background:#080c17;color:#eee7d6;font:13px system-ui}#app{height:100dvh;display:flex;flex-direction:column}header{padding:16px;background:linear-gradient(135deg,#202034,#101421);border-bottom:1px solid #b99a59}small{color:#b5a78e;letter-spacing:2px}h1{font-size:23px;letter-spacing:3px;margin:5px 0;color:#ffe2a1}.wallet{display:flex;justify-content:space-between;align-items:center;margin-top:12px;background:#0b101b;border:1px solid #665437;padding:10px;border-radius:10px}.wallet strong{font-size:23px;color:#ffdc86}button{font:inherit;color:inherit;cursor:pointer;background:#222431;border:1px solid #6a5b42;border-radius:8px;padding:9px}button:disabled{opacity:.4}nav{display:flex;overflow:auto;gap:5px;padding:9px;flex-shrink:0}nav button{white-space:nowrap;font-size:11px}nav .active,.gold{background:linear-gradient(135deg,#ffe4a0,#aa7e31);color:#17130c;font-weight:800}main{flex:1;overflow:auto;padding:10px}.hero{position:relative;overflow:hidden;border:1px solid #b99a59;background:radial-gradient(ellipse at 90% 15%,#a17c4255,transparent 65%),linear-gradient(145deg,#232336,#101522);padding:17px;border-radius:12px;margin-bottom:10px}.hero h2{font-size:19px;margin:7px 0;color:#ffdf99}.hero p{color:#c6bfaf;font-size:12px;line-height:1.5}.pack{display:flex;gap:10px;align-items:center;padding:11px;margin:8px 0;background:linear-gradient(125deg,#1d2637,#111622);border:1px solid #444454;border-radius:10px}.art{width:75px;height:80px;flex:none}.info{flex:1;min-width:0}.info b{color:#ffe2a1}.info p{font-size:11px;color:#b9c3d3;margin:6px 0}.pack button{font-size:11px;min-width:68px}.tag{font-size:9px;color:#bba275;letter-spacing:1px}.foot{padding:8px 12px;color:#9a9eab;font-size:10px;border-top:1px solid #393445}input{width:100%;padding:13px;background:#0c1522;border:1px solid #8b784e;color:white;border-radius:8px;margin:8px 0}dialog{max-width:340px;width:90%;background:#171e2c;color:#f9e6b1;border:1px solid #aa925c;border-radius:14px;padding:20px}dialog::backdrop{background:#000b}dialog button{margin:5px}.notice{color:#91d9c4;min-height:20px;margin:8px 0}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.card{background:#141d2b;border:1px solid #59503d;border-radius:10px;padding:13px;margin:8px 0}
</style></head><body><div id="app"><header><small>THE MATRIX · PRIVATE ACCESS</small><h1>BLACK MARKET</h1><div class="wallet"><div><small>ONYX CREDITS</small><br><strong>⬢ <span id="bal">0</span></strong></div><button class="gold" onclick="setTab('Gift Cards')">＋ REDEEM</button></div></header><nav id="nav"></nav><main id="main"></main><div class="foot">DEVELOPMENT ONLY · No real payments · Fixed contents</div></div><dialog id="modal"><h2 id="mt"></h2><p id="md"></p><button class="gold" id="confirm">CONFIRM</button><button onclick="modal.close()">CANCEL</button></dialog><script>
const key='matrix_onyx_store_dev1';let s={balance:0,used:[],claims:{},orders:[]};try{s={...s,...JSON.parse(localStorage.getItem(key)||'{}')}}catch(e){}let tab='Featured',notice='';const tabs=['Featured','Daily','Weekly','Monthly','Growth','Heroes','Nano','Equipment','Skins','Events','Gift Cards','Free Credits','History'];const catalog=[['Featured','Blacksite Starter',99,'10 × 1h speedups · 100K data · 5 recruitment modules','cyan'],['Featured','Obsidian Elite',499,'50 × 1h speedups · 500K data · 20 elite modules','gold'],['Daily','Daily Supply',49,'5 × 1h speedups · 25K data','cyan'],['Weekly','Weekly Operations',199,'25 × 1h speedups · 10 recruitment modules','violet'],['Monthly','Monthly Command',499,'100 × 1h speedups · 30 modules','gold'],['Growth','HQ Advancement Fund',699,'Milestone reward preview · 600K data · 120h speedups','gold'],['Heroes','Elite Recruitment',299,'20 hero recruitment modules','violet'],['Nano','Nano Reinforcement',199,'500 training modules · 20h training boosts','cyan'],['Equipment','Quantum Arsenal',399,'20 refinement cores · 10 equipment modules','violet'],['Skins','Obsidian Citadel',999,'Permanent HQ skin entitlement preview','gold'],['Events','Network Dominion Kit',249,'30h boosts · 10 operational modules','cyan']];const colors={cyan:'#55eaff',gold:'#ffd47c',violet:'#c09aff'};function art(c){c=colors[c]||colors.gold;return '<svg class="art" viewBox="0 0 90 90"><defs><linearGradient id="g'+c.slice(1)+'"><stop stop-color="#172839"/><stop offset="1" stop-color="#426078"/></linearGradient></defs><ellipse cx="45" cy="76" rx="37" ry="8" fill="#0008"/><path d="M10 34L45 15 80 34 45 53Z" fill="#3a475b" stroke="'+c+'" stroke-width="2"/><path d="M10 34V65L45 84V53Z" fill="#23384a" stroke="'+c+'"/><path d="M45 53L80 34V65L45 84Z" fill="#101b2b" stroke="'+c+'"/><path d="M24 26L60 45V76M60 23L26 43V73" fill="none" stroke="'+c+'" stroke-width="4"/><path d="M39 46L45 42 51 46V53L45 57 39 53Z" fill="'+c+'"/></svg>'}function save(){localStorage.setItem(key,JSON.stringify(s));render()}function setTab(t){tab=t;notice='';render()}function period(t){let d=new Date(),day=d.toISOString().slice(0,10);if(t==='Daily')return day;if(t==='Weekly'){d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));return d.toISOString().slice(0,10)}if(t==='Monthly')return day.slice(0,7);return 'once'}function claimkey(p){return p[1]+':'+period(p[0])}function ask(title,desc,fn){mt.textContent=title;md.textContent=desc;confirm.onclick=()=>{modal.close();fn()};modal.showModal()}function buy(i){let p=catalog[i];if(s.balance<p[2]||s.claims[claimkey(p)])return;ask(p[1],'Spend '+p[2]+' Onyx Credits for '+p[3]+'?',()=>{if(s.balance<p[2]||s.claims[claimkey(p)])return;s.balance-=p[2];s.claims[claimkey(p)]=true;s.orders.unshift({name:p[1],amount:-p[2],date:new Date().toISOString()});notice='Pack purchased · reward recorded in test ledger';save()})}function credit(n,name){s.balance+=n;s.orders.unshift({name,amount:n,date:new Date().toISOString()});notice='+'+n+' Onyx Credits received';save()}const codes={'MATRIXDEV100':100,'ONYXDEMO500':500,'WELCOMEONYX':25};function redeem(){let c=document.getElementById('code').value.trim().toUpperCase();if(!codes[c]||s.used.includes(c)){notice='Invalid or already redeemed code';render();return}s.used.push(c);credit(codes[c],'Gift code '+c)}function free(id,n){id+=':'+period(id==='weekly'?'Weekly':'Daily');if(s.claims[id])return;s.claims[id]=true;credit(n,'Free reward '+id)}function render(){bal.textContent=s.balance.toLocaleString();nav.innerHTML=tabs.map(t=>'<button class="'+(t===tab?'active':'')+'" onclick="setTab(\''+t+'\')">'+t+'</button>').join('');let h='<div class="notice">'+notice+'</div>';if(tab==='Gift Cards'){h+='<div class="hero"><small>SECURE REDEMPTION</small><h2>Onyx Gift Cards</h2><p>Only Onyx Credits can purchase packs. Redeem a gift code to fund your private wallet.</p><input id="code" placeholder="ENTER GIFT CODE" autocomplete="off"><button class="gold" onclick="redeem()">REDEEM CODE</button></div><div class="card">Development codes: MATRIXDEV100 · ONYXDEMO500 · WELCOMEONYX<br>Each works once per local test save.</div>';for(let n of [100,500,1000,2500,5000,10000])h+='<div class="pack">'+art('gold')+'<div class="info"><b>⬢ '+n+' Onyx</b><p>Gift card denomination · payment disabled</p></div><button disabled>PREVIEW</button></div>'}else if(tab==='Free Credits'){h+='<div class="hero"><h2>Earn Onyx</h2><p>Small rewards, no payment required. Proposed earning rates.</p></div>';for(let [id,n,label] of [['daily',2,'Daily login'],['weekly',10,'Weekly milestone test']])h+='<div class="card row"><div><b>'+label+'</b><p>⬢ '+n+'</p></div><button '+(s.claims[id+':'+period(id==='weekly'?'Weekly':'Daily')]?'disabled':'')+' onclick="free(\''+id+'\','+n+')">CLAIM</button></div>';h+='<div class="card">Future gameplay sources: monthly milestones, major achievements and official gift codes. Not connected yet.</div>'}else if(tab==='History'){h+=s.orders.map(o=>'<div class="card row"><span>'+o.name+'</span><b>'+ (o.amount>0?'+':'')+o.amount+'</b></div>').join('')||'<div class="card">No transactions yet.</div>'}else{h+='<div class="hero"><small>EXCLUSIVE EXCHANGE</small><h2>'+tab+' Collection</h2><p>Curated fixed-content packs. All purchases use Onyx Credits only.</p></div>';h+=catalog.map((p,i)=>p[0]===tab?'<div class="pack">'+art(p[4])+'<div class="info"><span class="tag">'+p[0].toUpperCase()+'</span><br><b>'+p[1]+'</b><p>'+p[3]+'</p></div><button class="gold" '+(s.claims[claimkey(p)]||s.balance<p[2]?'disabled':'')+' onclick="buy('+i+')">'+(s.claims[claimkey(p)]?'OWNED':'⬢ '+p[2])+'</button></div>':'').join('')}main.innerHTML=h}render();
</script></body></html>

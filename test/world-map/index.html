<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#050b17;color:#e5f5ff}*{box-sizing:border-box}body{margin:0;overflow:hidden}button{font:inherit;color:inherit;cursor:pointer}#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 20%,#142940,#050b17 70%)}header{padding:env(safe-area-inset-top) 12px 8px;border-bottom:1px solid #1b4c66;background:#071525}header h1{font-size:16px;letter-spacing:3px;margin:8px 0 4px;color:#75e9ff}header small{color:#84a4b9}#status{display:flex;justify-content:space-between;font-size:11px;color:#8bd8e7}#map{position:relative;flex:1;overflow:hidden;touch-action:none;background:radial-gradient(ellipse at center,#14364a 0%,#0a1b2c 55%,#07121f 100%)}#terrain{position:absolute;inset:0;width:100%;height:100%}#field{position:absolute;width:3600px;height:3600px;transform-origin:0 0;background:radial-gradient(ellipse at 25% 28%,#144b53 0%,transparent 28%),radial-gradient(ellipse at 76% 64%,#233b55 0%,transparent 34%),radial-gradient(ellipse at 53% 78%,#123e36 0%,transparent 24%),#091b29}#field:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 35% 40%,#06b6d41b,transparent 35%),radial-gradient(circle at 70% 60%,#ef44441a,transparent 25%);pointer-events:none}.node{position:absolute;transform:translate(-50%,-50%);min-width:44px;min-height:44px;border:1px solid #4a7b8b;background:#091d2de8;border-radius:12px;box-shadow:0 0 18px #00c9ff33;display:grid;place-items:center;font-size:21px}.node span{font-size:9px;display:block;color:#d3faff}.node.me{border-color:#22d3ee;box-shadow:0 0 20px #22d3ee99}.node.enemy{border-color:#e66b79}.node.alliance{border-color:#a78bfa}.node.resource{border-color:#36d399}.territory{position:absolute;border:2px solid #2dd4bf;border-radius:14px;background:#14b8a626;pointer-events:none;box-shadow:inset 0 0 25px #2dd4bf22}.toolbar{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:7px}.toolbar button,  solid #ffe08a;box-shadow:0 0 65px #ffc45a80,0 0 0 18px #ffd56c16;font-size:40px;z-index:3}.node.facility{min-width:85px;min-height:85px;border:2px solid #b28eff;box-shadow:0 0 42px #a36cff75;font-size:32px}.territory-sector{position:absolute;width:110px;height:110px;border:2px solid #2ee7ca;background:#16c6aa24;box-shadow:inset 0 0 20px #3ef9e72a;pointer-events:none;z-index:1}.march-line{position:absolute;height:2px;transform-origin:left center;border-top:2px dashed #49e9e2;pointer-events:none;z-index:2;opacity:.85}.march-line i{position:absolute;top:-7px;width:13px;height:13px;background:#b4fff3;border:2px solid #1da8ac;border-radius:50%;box-shadow:0 0 15px #50fff4;animation:marchTravel 5s linear infinite}@keyframes marchTravel{from{left:0}to{left:calc(100% - 13px)}}  .march-line.scout{border-color:#3be9a8}.march-line.scout i{background:#70ffca;border-color:#0eaa76;box-shadow:0 0 16px #4bffb1}.march-line.attack{border-color:#ff627a}.march-line.attack i{background:#ff8090;border-color:#c62945;box-shadow:0 0 16px #ff4869}.march-line.gather{border-color:#f9c75c}.march-line.gather i{background:#ffe18d;border-color:#b98115}.march-line.reinforce{border-color:#a58bff}.march-line.reinforce i{background:#c4b2ff;border-color:#7153c9}  #map{touch-action:none!important;overscroll-behavior:contain!important}#field{background-color:#06121e!important} .node.enemy{box-shadow:0 0 14px #ff547048} .node.friendly{box-shadow:0 0 14px #42e7be6b}  .node.allianceResource{border:2px solid #ffe17a;box-shadow:0 0 23px #ffd64b88;background:#29331b;color:#ffeeb5}.node.allianceResource span{color:#ffebad} </style></head>
<body><div id="app"><header><div id="status"><span>◈ DEVELOPMENT SANDBOX</span><span id="clock">SIMULATION</span></div><h1>THE MATRIX · WORLD</h1><small id="coords">Sector 043 · Coordinates 600,600 · HQ 5</small></header><div class="notice">Prototype only · No live multiplayer or live-game changes</div><div id="wm-alliance-status" style="display:flex;align-items:center;gap:8px;padding:7px 12px;background:#082b34;color:#a4fff0;font:700 12px system-ui;border-bottom:1px solid #236475;flex-wrap:wrap"><span>⬡ ALLIANCE CREDITS <b id="wm-credit-balance">0</b></span><span style="color:#79aeb3">+15/min</span><span>Territory <b id="wm-sector-balance">0/25</b></span><button type="button" onclick="switchTab('Alliance')" style="margin-left:auto;background:#13495b;color:#e4ffff;border:1px solid #2c8297;border-radius:7px;padding:5px 9px">BUILD / CREDITS</button></div><main id="map"><div id="field"></div><div class="toolbar"><button onclick="zoom(1.2)">＋</button><button onclick="zoom(.83)">－</button><button onclick="center()">⌖</button></div><section class="panel" id="panel"></section></main><nav class="nav" id="nav"></nav></div>
<script>
const key='matrix-world-sandbox-v1',stored=JSON.parse(localStorage.getItem(key)||'null');let state=stored||{hq:5,energy:150,teleports:3,allianceCredits:800,personalCredits:300,alliances:[],territories:[],marches:[],reports:[],gathered:0,day:0,hqPos:{x:600,y:600}};state.reports=(state.reports||[]).map(x=>({...x,read:x.read===true}));state.mailFilter='All';state.simMarches=(state.simMarches||[]).filter(m=>m&&m.origin&&m.target&&m.target!==m.targetName);state.reinforcements=state.reinforcements||[];state.simNext=state.simNext||Date.now()+18000;state.simEnabled=state.simEnabled!==false;state.bots=Number.isFinite(state.bots)?state.bots:650;state.botTier=state.botTier||2;state.research=state.research||{attack:3,defence:2};state.hqPos=state.hqPos||{x:600,y:600};state.playerProfiles=state.playerProfiles||{};state.linkedNano=null;state.casualtySequence=state.casualtySequence||0;state.allianceResourceStock=state.allianceResourceStock||0;state.allianceResourceLast=state.allianceResourceLast||Date.now();state.allianceEarnLast=state.allianceEarnLast||Date.now();state.allianceCredits=Number.isFinite(Number(state.allianceCredits))?Number(state.allianceCredits):800;state.territories=state.territories||[];state.marches=state.marches||[];let selected=null,tab='World',panelOpen=false,scale=.19,offsetX=0,offsetY=0,drag=null;const field=document.getElementById('field'),panel=document.getElementById('panel'),map=document.getElementById('map');const save=()=>localStorage.setItem(key,JSON.stringify(state));const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
let nodes=[{id:'me',x:state.hqPos.x,y:state.hqPos.y,type:'me',name:'YOUR HQ',level:state.hq},{id:'a',x:650,y:690,type:'alliance',name:'NEON Collective',level:5},{id:'b',x:2990,y:2920,type:'alliance',name:'Red Protocol',level:6},{id:'friend',x:830,y:750,type:'friendly',name:'NEON Member',level:5},{id:'p1',x:2650,y:690,type:'enemy',name:'Cipher',level:4},{id:'p2',x:730,y:2760,type:'enemy',name:'ZeroByte',level:6},{id:'p3',x:2870,y:940,type:'enemy',name:'NightShift',level:7},{id:'r1',x:1260,y:1120,type:'resource',name:'Data Cache',level:2},{id:'r2',x:2360,y:2310,type:'resource',name:'Power Relay',level:3},{id:'r3',x:1030,y:2350,type:'resource',name:'Quantum Deposit',level:4}];let activeTimers=[];const allianceResourceNodes=[{id:'ar1',gx:-2,gy:0,name:'Alliance Data Mine',level:2},{id:'ar2',gx:1,gy:-1,name:'Alliance Power Plant',level:3},{id:'ar3',gx:2,gy:2,name:'Alliance Quantum Node',level:5},{id:'ar4',gx:-1,gy:2,name:'Alliance Relay',level:4}];for(const r of allianceResourceNodes)nodes.push({id:r.id,x:650+r.gx*110,y:690+r.gy*110,type:'allianceResource',name:r.name,level:r.level});for(let i=0;i<95;i++){let a=i*2.39996,r=420+((i*347)%1280),x=Math.round(1800+Math.cos(a)*r),y=Math.round(1800+Math.sin(a)*r);if(x<120||x>3480||y<120||y>3480)continue;nodes.push({id:'npc'+i,x,y,type:i%6===0?'friendly':'enemy',name:(i%6===0?'NEON Ally ':'Network User ')+(i+1),level:3+(i*7)%28})}const core={id:'core',x:1800,y:1800,type:'core',name:'NETWORK CORE',level:30};const facilities=[{id:'f1',x:1800,y:580,type:'facility',name:'Cipher Citadel',level:20},{id:'f2',x:3020,y:1800,type:'facility',name:'Firewall Array',level:20},{id:'f3',x:1800,y:3020,type:'facility',name:'Quantum Vault',level:20},{id:'f4',x:580,y:1800,type:'facility',name:'Signal Nexus',level:20}];nodes.push(core,...facilities);state.territorySectors=state.territorySectors||[];function distance(a,b){return Math.round(Math.hypot(a.x-b.x,a.y-b.y))}function duration(n){return Math.max(18,Math.round(distance(nodes[0],n)/5))}function gatherTime(n){return (45+n.level*35)*1000}function addReport(kind,n,details){state.reports.unshift({id:Date.now()+Math.random(),kind,target:n.name,time:new Date().toLocaleString(),details,read:false});state.reports=state.reports.slice(0,100);save();renderNav()}function mailCategory(k){return k.includes('SCOUT')?'Scout':k.includes('BATTLE')||k.includes('ATTACK')?'Battle':k.includes('GATHER')?'Gather':k.includes('REINFORCE')?'Alliance':k.includes('SIM')?'World':'World'}function safeMail(s){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}function showMail(id){let r=state.reports.find(x=>x.id===id);if(!r)return;r.read=true;save();renderNav();panel.innerHTML='<h2>✉ '+safeMail(r.kind)+' · '+safeMail(r.target)+'</h2><p>'+safeMail(r.time)+'</p><div class="report">'+r.details.split(' | ').map(s=>'<p>'+safeMail(s)+'</p>').join('')+'</div><div class="actions"><button onclick="renderPanel()">Back to Mail</button></div>'}function setMailFilter(v){state.mailFilter=v;renderPanel()}function mailList(){let filters=['All','Scout','Battle','Gather','Alliance','World'],unread=state.reports.filter(x=>!x.read).length,items=state.reports.filter(x=>state.mailFilter==='All'||mailCategory(x.kind)===state.mailFilter);return '<h2>✉ WORLD MAP MAIL · '+unread+' UNREAD</h2><p>World Map activity and operation reports are stored here.</p><div class="actions">'+filters.map(f=>'<button onclick="setMailFilter(\''+f+'\')" style="border-color:'+(state.mailFilter===f?'#68e6ff':'#25516c')+'">'+f+'</button>').join('')+'</div>'+(items.map(x=>'<button class="report" style="display:block;width:100%;text-align:left;color:#e4f5ff" onclick="showMail('+x.id+')"><strong>'+(x.read?'':'● ')+safeMail(x.kind)+' · '+safeMail(x.target)+'</strong><br><small>'+safeMail(x.time)+'</small><p>'+safeMail(x.details.split(' | ')[0])+'</p></button>').join('')||'<p>No messages in this category yet.</p>')}function availableBots(){return Math.max(0,state.bots-state.marches.filter(m=>m.kind==='Attack'||m.kind==='Gather').reduce((s,m)=>s+(m.survivors===undefined?m.bots:m.survivors),0)-state.reinforcements.reduce((s,x)=>s+x.bots,0)-state.marches.filter(m=>m.kind==='Reinforce').reduce((s,m)=>s+m.bots,0))}function applyCasualties(losses,reason){losses=Math.max(0,Math.floor(losses));if(!losses)return;state.bots=Math.max(0,state.bots-losses);state.casualtySequence++;try{parent.postMessage({kind:'MATRIX_WORLD_CASUALTIES',id:state.casualtySequence,losses,reason},'*')}catch(e){}save()}
function reinforce(n){if(!n||(n.id!=='a'&&n.type!=='friendly')){message('You can reinforce only your own alliance HQ or alliance members.');return}if(availableBots()<100){message('Reinforcement requires 100 available bots.');return}if(state.reinforcements.some(x=>x.target===n.id)||state.marches.some(m=>m.kind==='Reinforce'&&m.target===n.id)){message('100 bots are already reinforcing this location.');return}state.marches.push({kind:'Reinforce',target:n.id,bots:100,arrive:Date.now()+duration(n)*1000,stage:'outbound'});save();addReport('REINFORCE',n,'100 bots dispatched | Destination: '+n.name+' | ETA: '+duration(n)+'s | Status: en route');message('100 bots automatically dispatched to '+n.name+'. They remain committed until recalled.')}
function recallReinforcement(id){let x=state.reinforcements.find(x=>x.target===id);if(!x)return;let n=nodes.find(n=>n.id===id);state.reinforcements=state.reinforcements.filter(x=>x.target!==id);state.marches.push({kind:'Reinforce',target:id,bots:x.bots,arrive:Date.now()+duration(n)*1000,stage:'returning'});save();addReport('REINFORCE',n,'100 bots recalled | Returning to your HQ | Travel time: '+duration(n)+'s');renderPanel()}
function simulationStep(now){if(!state.simEnabled||now<state.simNext)return false;let actors=nodes.filter(n=>n.type==='enemy'),actor=actors[rnd(0,actors.length-1)],kind=['Scout','Gather','Attack','Reinforce'][rnd(0,3)],targets=kind==='Gather'?nodes.filter(n=>n.type==='resource'):kind==='Reinforce'?nodes.filter(n=>n.type==='alliance'):kind==='Attack'?nodes.filter(n=>(n.type==='enemy'&&n.id!==actor.id)||n.type==='friendly'||n.id==='a'):nodes.filter(n=>n.type==='enemy'&&n.id!==actor.id);let target=targets[rnd(0,targets.length-1)],seconds=Math.max(20,Math.round(distance(actor,target)/8));state.simMarches.push({id:now,origin:actor.id,actor:actor.name,actorLevel:actor.level,kind,target:target.id,targetName:target.name,arrive:now+seconds*1000,stage:'outbound',bots:kind==='Attack'?Math.max(40,actor.level*45):kind==='Reinforce'?100:0});state.simNext=now+rnd(3,8)*1000;state.simMarches=state.simMarches.slice(-65);save();return true}
function simulationTick(now){let changed=false;for(const m of state.simMarches){if(now<m.arrive)continue;if(m.stage==='outbound'){if(m.kind==='Attack'){let target=nodes.find(n=>n.id===m.target);let reinforce=state.reinforcements.find(x=>x.target===m.target);if(target&&reinforce&&reinforce.bots>0){let attacker=nodes.find(n=>n.id===m.origin),attackerProfile=attacker?playerProfile(attacker):{hq:m.actorLevel,tier:1,attackTech:1};let attack=attackPower(m.bots,attackerProfile.hq,attackerProfile.tier,attackerProfile.attackTech);let defence=attackPower(reinforce.bots,state.hq,state.botTier,state.research.defence);let loss=Math.min(reinforce.bots,Math.max(1,Math.round(reinforce.bots*(attack/(attack+defence))*.65)));reinforce.bots-=loss;applyCasualties(loss,'Reinforcement defence at '+target.name);addReport('BATTLE',target,'INCOMING ATTACK | Defender: your reinforcement | Attacker: '+m.actor+' | Bots defending: '+(reinforce.bots+loss)+' | Defender power: '+defence+' | Attacker power: '+attack+' | Defending bots lost: '+loss+' | Surviving reinforcement: '+reinforce.bots);if(!reinforce.bots)state.reinforcements=state.reinforcements.filter(x=>x!==reinforce)}}m.stage=m.kind==='Gather'?'gathering':m.kind==='Reinforce'?'stationed':'returning';m.arrive=now+(m.kind==='Gather'?rnd(70,160)*1000:rnd(25,65)*1000);let details='Simulated player: '+m.actor+' | HQ level: '+m.actorLevel+' | Target: '+(m.targetName||m.target)+' | Operation: '+m.kind+' | '+(m.kind==='Attack'?'Attack strength assessed against defender. No live-game resources or bots changed.':m.kind==='Scout'?'Recon completed; simulated intelligence collected.':m.kind==='Reinforce'?'100 simulated bots stationed to defend territory.':'Resource collection in progress.');addReport('SIM '+m.kind.toUpperCase(),{name:m.actor},details);changed=true}else if(m.stage==='gathering'){m.stage='returning';m.arrive=now+rnd(25,65)*1000;addReport('SIM GATHER',{name:m.actor},'Gathering completed at '+(m.targetName||m.target)+'. Simulated resources only.');changed=true}else if(m.stage==='returning'){m.done=true;changed=true}}if(changed){state.simMarches=state.simMarches.filter(m=>!m.done);save()}return changed}
function playerProfile(n){if(n.id==='me')return {hq:state.hq,bots:state.bots,tier:state.botTier,attackTech:state.research.attack,defenceTech:state.research.defence,defenceGear:Math.max(1,Math.floor(state.hq/4))};let p=state.playerProfiles[n.id];if(!p||p.hq!==n.level){let level=n.level;let seed=[...n.id].reduce((a,c)=>a+c.charCodeAt(0),0);p={hq:level,bots:Math.round(90+level*48+seed%150),tier:Math.max(1,Math.min(10,Math.ceil(level/4))),attackTech:Math.max(1,Math.floor(level*.8)+seed%3),defenceTech:Math.max(1,Math.floor(level*.85)+seed%4),defenceGear:Math.max(1,Math.floor(level/3))};state.playerProfiles[n.id]=p;save()}return p}
function profileDefence(n){if(n.id==='me'&&state.linkedNano&&state.linkedNano.defencePower)return state.linkedNano.defencePower;let p=playerProfile(n);return Math.round(attackPower(p.bots,p.hq,p.tier,p.defenceTech)*(1+p.defenceGear*.055))}
function attackPower(count,hq,tier,research){if(state.linkedNano&&hq===state.hq&&state.linkedNano.attackPower&&state.linkedNano.bots>0)return Math.round(state.linkedNano.attackPower*(count/state.linkedNano.bots));return Math.round(count*(8+tier*5)*(1+research*.12)*(1+hq*.09))}
function defenderPower(n){return profileDefence(n)}
function prepareAttack(n){panelOpen=true;if(!n||n.type!=='enemy'){message('You can only attack enemy players.');return}let available=availableBots();panel.innerHTML='<h2>⚔ DEPLOY BOTS · '+n.name+'</h2><p>Choose how many bots to deploy. Combat uses HQ, bot tiers, research and defence technology in the background. Scout for intelligence.</p><p>Available bots: '+available+'</p><p>Choose bots to commit. Deployed bots are unavailable until they return; casualties are permanently lost.</p><input id="botCount" type="number" min="1" max="'+available+'" value="'+Math.min(available,200)+'" style="width:100%;padding:12px;background:#081523;color:#fff;border:1px solid #32718a;border-radius:8px"><div class="actions"><button onclick="launchAttack()">Launch Attack</button><button onclick="renderPanel()">Cancel</button></div>'}
function launchAttack(){let count=Number(document.getElementById('botCount')?.value);if(!Number.isInteger(count)||count<1||count>availableBots()){message('Choose a valid number of available bots.');return}march('Attack',selected,count)}
function march(kind,n,bots=0){if(!n)return;if(kind==='Attack'&&n.type!=='enemy'){message('Friendly protection: you cannot attack your own HQ, alliance HQ or alliance members.');return}if(kind==='Scout'&&n.type!=='enemy'){message('Select an enemy HQ to scout.');return}if(kind==='Gather'&&n.type!=='resource'){message('Select a resource node to gather.');return}if(state.marches.some(m=>m.target===n.id&&m.kind===kind)){message('A '+kind+' mission is already travelling to this target.');return}let energy=kind==='Attack'?30:kind==='Scout'?10:15,credits=kind==='Scout'?Math.max(20,n.level*12):0;if(state.energy<energy||state.personalCredits<credits){message('Insufficient resources. Requires '+energy+' energy'+(credits?' and '+credits+' credits':'')+'.');return}if(kind==='Attack'&&(!Number.isInteger(bots)||bots<1||bots>availableBots())){message('Not enough available bots.');return}state.energy-=energy;state.personalCredits-=credits;if(kind==='Gather')bots=Math.min(50,availableBots());state.marches.push({kind,target:n.id,bots,arrive:Date.now()+duration(n)*1000,stage:'outbound'});save();addReport('DISPATCH',n,kind+' operation dispatched | Target: '+n.name+' | Travel time: '+duration(n)+'s'+(bots?' | Bots committed: '+bots:'')+(credits?' | Credits spent: '+credits:''));message(kind+' dispatched · ETA '+duration(n)+'s'+(credits?' · Recon cost '+credits+' credits':'')+(bots?' · '+bots+' bots deployed':''))}
function message(t){panel.innerHTML='<h2>◈ COMMAND UPDATE</h2><p>'+t+'</p><div class="actions"><button onclick="renderPanel()">Close</button></div>'}function networkBackdrop(){let svg='<svg class="network-circuit" viewBox="0 0 3600 3600" aria-hidden="true"><defs><radialGradient id="chipGlow"><stop stop-color="#16465b"/><stop offset="1" stop-color="#061624"/></radialGradient></defs>';let routes=[];for(let zoneX=0;zoneX<6;zoneX++)for(let zoneY=0;zoneY<6;zoneY++){let bx=zoneX*600+65,by=zoneY*600+65;for(let k=0;k<5;k++){let x=bx+((k*107+zoneY*37)%460),y=by+((k*89+zoneX*53)%440);routes.push([x,y,x+65,y,x+100,y+35,x+185,y+35])}};routes.forEach((p,i)=>{let d='M'+p[0]+' '+p[1]+' L'+p[2]+' '+p[3]+' L'+p[4]+' '+p[5]+' L'+p[6]+' '+p[7];svg+='<path class="trace '+(i%3===0?'hot':i%2?'alt':'')+'" d="'+d+'"/><path class="signal '+(i%3===0?'violet':'')+'" d="'+d+'"/>';for(let j=0;j<p.length;j+=2){svg+='<circle class="pad" cx="'+p[j]+'" cy="'+p[j+1]+'" r="'+(j===0?6:3)+'"/>'}});for(let i=0;i<260;i++){let x=50+(i*173)%3500,y=60+(i*317)%3500;svg+='<circle class="junction" cx="'+x+'" cy="'+y+'" r="'+(i%5===0?3:1.5)+'"/>'}return svg+'</svg>'}
function capturedAllianceNodes(){const used=new Set(state.territorySectors.map(t=>t.gx+','+t.gy));return allianceResourceNodes.filter(r=>used.has(r.gx+','+r.gy))}function earnAllianceCredits(){const now=Date.now(),steps=Math.min(144,Math.floor((now-state.allianceEarnLast)/60000));if(steps>0){state.allianceCredits+=steps*15;state.allianceEarnLast+=steps*60000;save()}}function collectAllianceProduction(){const now=Date.now(),elapsed=Math.min(now-state.allianceResourceLast,24*3600000),owned=capturedAllianceNodes();if(elapsed>=10000&&owned.length){const gain=Math.floor(elapsed/10000)*owned.reduce((v,r)=>v+r.level*2,0);state.allianceResourceStock+=gain;state.allianceResourceLast+=Math.floor(elapsed/10000)*10000;save()}else if(!owned.length)state.allianceResourceLast=now}function renderMap(){field.querySelectorAll('.node,.territory,.network-circuit,.march-line,.territory-sector').forEach(e=>e.remove());field.insertAdjacentHTML('afterbegin',networkBackdrop());state.territorySectors.forEach(t=>{let e=document.createElement('div');e.className='territory-sector';e.style.left=t.x+'px';e.style.top=t.y+'px';field.append(e)});nodes.forEach(n=>{let b=document.createElement('button');b.className='node '+n.type;b.style.left=n.x+'px';b.style.top=n.y+'px';b.innerHTML=({me:'⌂',enemy:'⬡',alliance:'◈',resource:'◆',allianceResource:'◈',friendly:'◈',core:'✺',facility:'▣'})[n.type]+'<span>'+n.name+'</span>';b.onclick=()=>{selected=n;panelOpen=true;renderNav();renderPanel()};field.append(b)});drawMarchLines();applyTransform()}function drawMarchLines(){field.querySelectorAll('.march-line').forEach(e=>e.remove());for(const m of [...state.marches,...state.simMarches]){if(m.done)continue;const target=nodes.find(n=>n.id===m.target);if(!target)continue;const start=nodes.find(n=>n.id===m.origin)||nodes[0];const line=document.createElement('div');line.className='march-line '+String(m.kind||'').toLowerCase();let dx=target.x-start.x,dy=target.y-start.y;line.style.left=start.x+'px';line.style.top=start.y+'px';line.style.width=Math.hypot(dx,dy)+'px';line.style.transform='rotate('+Math.atan2(dy,dx)+'rad)';line.innerHTML='<i></i>';field.append(line)}}function applyTransform(){const vw=map.clientWidth,vh=map.clientHeight,minX=vw-3500*scale,maxX=100,minY=vh-3500*scale,maxY=100;offsetX=Math.min(maxX,Math.max(minX,offsetX));offsetY=Math.min(maxY,Math.max(minY,offsetY));scale=Math.max(.16,Math.min(1.8,scale));field.style.transform='translate('+offsetX+'px,'+offsetY+'px) scale('+scale+')';document.getElementById('coords').textContent='Sector 043 · Coordinates '+Math.round((map.clientWidth/2-offsetX)/scale)+','+Math.round((map.clientHeight/2-offsetY)/scale)+' · HQ '+state.hq}function center(){offsetX=map.clientWidth/2-nodes[0].x*scale;offsetY=map.clientHeight/2-nodes[0].y*scale;applyTransform()}function zoom(f){let cx=(map.clientWidth/2-offsetX)/scale,cy=(map.clientHeight/2-offsetY)/scale;scale=Math.min(1.8,Math.max(.16,scale*f));offsetX=map.clientWidth/2-cx*scale;offsetY=map.clientHeight/2-cy*scale;applyTransform()}function updateAllianceBalance(){let el=document.getElementById('wm-credit-balance');if(el)el.textContent=Math.floor(state.allianceCredits).toLocaleString();let sec=document.getElementById('wm-sector-balance');if(sec)sec.textContent=state.territorySectors.length+'/25'}function renderNav(){updateAllianceBalance();document.getElementById('nav').innerHTML=[['World','◎'],['Alliance','⬡'],['Gather','◆'],['Marches','➤'],['Mail','✉'],['Locate','⌕']].map(([name,icon])=>'<button class="'+(tab===name&&panelOpen?'active':'')+'" onclick="switchTab(\''+name+'\')"><b>'+icon+'</b>'+name+(name==='Mail'&&state.reports.some(x=>!x.read)?' ●'+state.reports.filter(x=>!x.read).length:'')+'</button>').join('')}function switchTab(t){if(tab===t&&panelOpen){panelOpen=false;selected=null}else{tab=t;selected=null;panelOpen=true}renderNav();renderPanel()}function renderPanel(){panel.style.display=panelOpen?'':'none';if(!panelOpen)return;if(selected){let n=selected,buttons=n.type==='enemy'?'<button onclick="march(\'Scout\',selected)">◉ Scout</button><button onclick="prepareAttack(selected)">⚔ Attack</button>':n.type==='resource'?'<button onclick="march(\'Gather\',selected)">◆ Gather</button>':n.type==='allianceResource'?'<button onclick="message(\'Alliance resource node: produces automatically when its square sector is claimed.\')">View Production</button>':n.type==='alliance'?n.id==='a'?'<button onclick="claim()">⬡ Build Territory</button><button onclick="buildSector()">＋ Expand Sector</button><button onclick="devGrantCredits()">＋ Test Credits</button><button onclick="reinforce(selected)">🛡 Reinforce 100 Bots</button>':'<button onclick="message(\'Rival alliance HQ. Reinforcements unavailable.\')">Rival Alliance</button>':n.type==='friendly'?'<button onclick="reinforce(selected)">🛡 Reinforce 100 Bots</button>':n.type==='core'||n.type==='facility'?'<button onclick="message(\'Strategic objective: not capturable in this development build.\')">View Objective</button>':'<button onclick="openHQ()">⌂ Open HQ</button><button onclick="teleportNearAlliance()">⌖ Teleport Near Alliance HQ</button>';panel.innerHTML='<h2>'+n.name+'</h2><p>'+n.type.toUpperCase()+' · Level '+n.level+' · '+distance(nodes[0],n)+' units from HQ</p><div class="actions">'+buttons+'<button onclick="selected=null;panelOpen=false;renderPanel()">Close</button></div>';return}let html={World:'<h2>◈ WORLD COMMAND</h2><p>Select a base or resource node to scout, attack, gather or expand. Drag to pan the world.</p><span class="tag">HQ '+state.hq+'</span><span class="tag">Network energy '+state.energy+'</span><span class="tag">Teleport charges '+state.teleports+'</span><span class="tag">Bots '+availableBots()+'/'+state.bots+'</span>',Alliance:'<h2>⬡ ALLIANCE TERRITORY</h2><p>Select NEON Collective HQ to establish your first territory. Each build costs 200 alliance credits. Build adjacent square sectors to grow alliance territory.</p><span class="tag">Alliance credits '+state.allianceCredits+'</span><span class="tag">+15 credits/min</span><span class="tag">Sectors '+state.territorySectors.length+'/25</span><span class="tag">Alliance resource stock '+state.allianceResourceStock+'</span><span class="tag">Producing nodes '+capturedAllianceNodes().length+'/'+allianceResourceNodes.length+'</span><span class="tag">Territory nodes '+state.territories.length+'</span><div class="actions"><button onclick="selected=nodes[1];renderPanel()">Choose Alliance HQ</button><button onclick="buildSector()">＋ Build Territory Sector</button><button onclick="devGrantCredits()">＋ 1,000 Test Credits</button><button onclick="teleportNearAlliance()">⌖ Teleport Near Alliance HQ</button></div>',Gather:'<h2>◆ RESOURCE NETWORK</h2><p>Gather from personal resource nodes using timed marches. Alliance nodes feed shared alliance storage.</p><span class="tag">Personal credits '+state.personalCredits+'</span><span class="tag">Gathered '+state.gathered+'</span>',Marches:'<h2>➤ ACTIVE OPERATIONS</h2><p>Your missions and simulated player activity. Simulated actions do not consume your resources.</p>'+(state.marches.map(m=>'<p>'+m.kind+' → '+m.target+(m.bots?' · '+m.bots+' bots':'')+' · '+m.stage+' · '+Math.max(0,Math.ceil((m.arrive-Date.now())/1000))+'s</p>').join('')||'<p>No player marches</p>')+'<h2>🛡 ALLIANCE GARRISON</h2>'+(state.reinforcements.map(x=>'<p>100 bots defending '+x.name+' <button onclick="recallReinforcement(\''+x.target+'\')">Recall</button></p>').join('')||'<p>No bots stationed</p>')+'<h2>◈ SIMULATED PLAYER ACTIVITY</h2>'+(state.simMarches.map(m=>'<p>'+m.actor+' · '+m.kind+' → '+m.target+' · '+m.stage+(m.stage==='stationed'?'':(' · '+Math.max(0,Math.ceil((m.arrive-Date.now())/1000))+'s'))+'</p>').join('')||'<p>Waiting for simulated players...</p>'),Mail:mailList(),Locate:'<h2>⌕ COORDINATE CONTROL</h2><p>Recenter your HQ or move it to an open location using a teleport charge.</p><div class="actions"><button onclick="center()">Locate HQ</button><button onclick="teleport()">Teleport HQ</button></div>'};panel.innerHTML=html[tab]}function openHQ(){message('HQ navigation is ready for integration. This standalone World Map cannot open the existing development HQ until both are combined.')}function devGrantCredits(){state.allianceCredits+=1000;save();updateAllianceBalance();renderPanel();message('Development simulation: 1,000 alliance credits added.')}function buildSector(){if(state.allianceCredits<100){message('Requires 100 alliance credits.');return}const h=nodes[1],size=110;let used=new Set(state.territorySectors.map(t=>t.gx+','+t.gy));let candidates=[];if(!state.territorySectors.length)candidates=[{gx:0,gy:0}];else for(const t of state.territorySectors)for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){let gx=t.gx+dx,gy=t.gy+dy;if(!used.has(gx+','+gy)&&Math.abs(gx)<=2&&Math.abs(gy)<=2)candidates.push({gx,gy})}if(!candidates.length||state.territorySectors.length>=25){message('Alliance territory is at its maximum 5 × 5 size (25 sectors).');return}candidates.sort((a,b)=>{const bonus=t=>allianceResourceNodes.some(r=>r.gx===t.gx&&r.gy===t.gy)?-100:0;return (Math.abs(a.gx)+Math.abs(a.gy)+bonus(a))-(Math.abs(b.gx)+Math.abs(b.gy)+bonus(b))});const t=candidates[0];state.territorySectors.push({...t,x:h.x+t.gx*size-size/2,y:h.y+t.gy*size-size/2});state.allianceCredits-=100;collectAllianceProduction();save();updateAllianceBalance();renderMap();renderPanel();addReport('TERRITORY',h,'New square sector constructed | Sectors: '+state.territorySectors.length+' | Alliance credits spent: 100 | Producing resource nodes: '+capturedAllianceNodes().length+' | Alliance resource stock: '+state.allianceResourceStock)}function teleportNearAlliance(){if(state.teleports<1){message('No teleport charges available.');return}const a=nodes[1];state.teleports--;nodes[0].x=a.x+210;nodes[0].y=a.y+150;state.hqPos={x:nodes[0].x,y:nodes[0].y};save();renderMap();center();addReport('TELEPORT',nodes[0],'Relocated near NEON Collective HQ | New coordinates: '+nodes[0].x+','+nodes[0].y);message('HQ teleported near your alliance HQ.')}function claim(){let n=selected;if(!n||n.type!=='alliance')return;if(n.id!=='a'){message('This is a rival alliance HQ. You cannot claim its territory.');return}if(state.allianceCredits<200){message('Not enough alliance credits.');return}if(state.territorySectors.length){message('Alliance territory already founded. Build additional sectors.');return}state.allianceCredits-=200;updateAllianceBalance();state.territories.push({id:n.id});state.territorySectors.push({gx:0,gy:0,x:n.x-55,y:n.y-55});save();renderMap();addReport('TERRITORY',n,'Alliance territory established | Credits spent: 200 | Location: '+n.name);message('Alliance territory established. Further territory must connect to existing territory.')}function teleport(){if(state.teleports<1){message('No teleport charges available.');return}state.teleports--;nodes[0].x=rnd(430,770);nodes[0].y=rnd(430,770);state.hqPos={x:nodes[0].x,y:nodes[0].y};save();renderMap();center();addReport('TELEPORT',nodes[0],'HQ relocated | New coordinates: '+nodes[0].x+','+nodes[0].y+' | Teleport charge consumed: 1');message('HQ relocated. One teleport charge consumed.')}function tick(){earnAllianceCredits();collectAllianceProduction();updateAllianceBalance();drawMarchLines();let now=Date.now(),changed=false;state.marches.forEach(m=>{if(now<m.arrive)return;let n=nodes.find(n=>n.id===m.target);if(m.stage==='outbound'){if(m.kind==='Reinforce'){state.reinforcements.push({target:n.id,name:n.name,bots:m.bots});addReport('REINFORCE',n,'100 bots arrived and are now stationed at '+n.name+'. They remain unavailable until recalled.');m.done=true;changed=true;return}if(m.kind==='Gather'){m.stage='gathering';m.arrive=now+gatherTime(n);changed=true;return}m.stage='returning';m.arrive=now+duration(n)*1000;if(m.kind==='Scout'){let p=playerProfile(n);addReport('SCOUT',n,'Target: '+n.name+' | HQ level: '+p.hq+' | Bots stationed: '+p.bots+' | Bot tier: '+p.tier+' | Attack technology: '+p.attackTech+' | Defence technology: '+p.defenceTech+' | Defence equipment: '+p.defenceGear+' | Total calculated defence: '+defenderPower(n).toLocaleString()+' | Your attack technology: '+state.research.attack+' | Distance: '+distance(nodes[0],n)+' | Threat: '+(defenderPower(n)>attackPower(availableBots(),state.hq,state.botTier,state.research.attack)?'HIGH':'MANAGEABLE')+' | Intelligence: simulated profile snapshot; not a live player account')}else if(m.kind==='Attack'){let attacker=attackPower(m.bots,state.hq,state.botTier,state.research.attack),defender=defenderPower(n),gap=n.level-state.hq,win=gap<10&&attacker>defender*1.12,ratio=attacker/Math.max(1,defender),lossRate=win?Math.min(.42,Math.max(.08,.35/Math.max(1,ratio))):Math.min(.95,Math.max(.48,.9-ratio*.18)),losses=Math.min(m.bots,Math.max(1,Math.round(m.bots*lossRate))),survivors=m.bots-losses,loot=win?40+n.level*12:0;m.survivors=survivors;applyCasualties(losses,'Attack against '+n.name);addReport('BATTLE',n,'Outcome: '+(win?'VICTORY':'DEFEAT')+' | Bots deployed: '+m.bots+' | Bots lost: '+losses+' | Bots returning: '+survivors+' | Attacker power: '+attacker.toLocaleString()+' | Defender power: '+defender.toLocaleString()+' | Attacker HQ: '+state.hq+' | Defender HQ: '+n.level+' | Bot tier: '+state.botTier+' | Attack research: '+state.research.attack+' | Defender bots: '+playerProfile(n).bots+' | Defender tier: '+playerProfile(n).tier+' | Defender defence research: '+playerProfile(n).defenceTech+' | Defender equipment: '+playerProfile(n).defenceGear+' | Credits looted: '+loot+' | '+(gap>=10?'HQ gap protection: victory impossible.':win?'Attack successful.':'Insufficient effective combat power.'));if(win)state.personalCredits+=loot}changed=true}else if(m.stage==='gathering'){let reward=n.level*75;state.personalCredits+=reward;state.gathered+=reward;addReport('GATHER',n,'Resource: '+n.name+' | Node level: '+n.level+' | Collection time: '+Math.round(gatherTime(n)/1000)+'s | Credits collected: '+reward+' | Returning to HQ.');m.stage='returning';m.arrive=now+duration(n)*1000;changed=true}else{m.done=true;changed=true}});if(changed){state.marches=state.marches.filter(m=>!m.done);save()}simulationStep(now);simulationTick(now);document.getElementById('clock').textContent=new Date().toLocaleTimeString();if((tab==='Marches'||tab==='Mail')&&!selected)renderPanel()}const touches=new Map();let pinch=null;function pinchMetrics(){let p=[...touches.values()];return {x:(p[0].x+p[1].x)/2,y:(p[0].y+p[1].y)/2,d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}}map.addEventListener('pointerdown',e=>{if(e.target.closest('.panel,.toolbar,.nav'))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size===2){let p=pinchMetrics();pinch={d:p.d,scale,wx:(p.x-offsetX)/scale,wy:(p.y-offsetY)/scale};drag=null}else if(touches.size===1){drag={x:e.clientX,y:e.clientY,ox:offsetX,oy:offsetY}}try{map.setPointerCapture(e.pointerId)}catch(_){} });map.addEventListener('pointermove',e=>{if(!touches.has(e.pointerId))return;touches.set(e.pointerId,{x:e.clientX,y:e.clientY});if(touches.size>=2&&pinch){let p=pinchMetrics();scale=Math.max(.16,Math.min(1.8,pinch.scale*p.d/Math.max(1,pinch.d)));offsetX=p.x-pinch.wx*scale;offsetY=p.y-pinch.wy*scale;applyTransform()}else if(drag){offsetX=drag.ox+e.clientX-drag.x;offsetY=drag.oy+e.clientY-drag.y;applyTransform()}});function pointerEnd(e){touches.delete(e.pointerId);pinch=null;drag=null;if(touches.size===1){let p=[...touches.values()][0];drag={x:p.x,y:p.y,ox:offsetX,oy:offsetY}}}map.addEventListener('pointerup',pointerEnd);map.addEventListener('pointercancel',pointerEnd);map.addEventListener('touchstart',e=>{if(e.touches.length===2){let a=e.touches[0],b=e.touches[1],mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;pinch={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY),scale,wx:(mx-offsetX)/scale,wy:(my-offsetY)/scale};drag=null}},{passive:false});map.addEventListener('touchmove',e=>{if(e.touches.length===2&&pinch){e.preventDefault();let a=e.touches[0],b=e.touches[1],mx=(a.clientX+b.clientX)/2,my=(a.clientY+b.clientY)/2;scale=Math.max(.16,Math.min(1.8,pinch.scale*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/Math.max(1,pinch.d)));offsetX=mx-pinch.wx*scale;offsetY=my-pinch.wy*scale;applyTransform()}},{passive:false});map.addEventListener('touchend',()=>{pinch=null});map.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.12:.89)},{passive:false});window.addEventListener('message',function(e){if(!e.data||e.data.kind!=='MATRIX_WORLD_SNAPSHOT'||e.source!==parent)return;const d=e.data.data;if(!d||!Array.isArray(d.tiers))return;state.linkedNano=d;state.hq=Math.max(1,Math.round(d.hq||state.hq));state.bots=Math.max(0,Math.round(d.bots||0));state.botTier=Math.max(1,d.tiers.reduce((a,n,i)=>n>0?i+1:a,1));nodes[0].level=state.hq;renderPanel();renderMap()});function requestNano(){try{if(typeof parent.BHQ_WORLD_SNAPSHOT==='function'){let d=parent.BHQ_WORLD_SNAPSHOT();if(d&&Array.isArray(d.tiers)){state.linkedNano=d;state.hq=Math.max(1,Math.round(d.hq||state.hq));state.bots=Math.max(0,Math.round(d.bots||0));state.botTier=Math.max(1,d.tiers.reduce((a,n,i)=>n>0?i+1:a,1));nodes[0].level=state.hq;renderPanel();return}}parent.postMessage({kind:'MATRIX_WORLD_REQUEST'},'*')}catch(e){try{parent.postMessage({kind:'MATRIX_WORLD_REQUEST'},'*')}catch(_){}}}renderNav();renderMap();center();renderPanel();requestNano();setInterval(tick,1000);setInterval(requestNano,2000);
</script></body></html>

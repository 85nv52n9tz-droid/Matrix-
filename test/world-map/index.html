<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07111e"><title>THE MATRIX · World Map</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050e18;color:#e9faff;font:12px system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer;color:#def8ff;border:1px solid #4c7b94;border-radius:8px;background:#102d40;padding:9px}button:active{filter:brightness(1.4)}#world{position:absolute;inset:0;touch-action:none;overflow:hidden;background:radial-gradient(ellipse at center,#0e3040,#06121d 75%)}canvas{display:block;width:100%;height:100%}.top{position:absolute;top:env(safe-area-inset-top);left:0;right:0;display:flex;justify-content:space-between;gap:5px;padding:8px;pointer-events:none}.top>*{pointer-events:auto}.pill{background:#081c2be8;border:1px solid #3b6b87;border-radius:9px;padding:8px;box-shadow:0 0 12px #35b8f329;white-space:nowrap}.pill b{color:#75e8ff}.bottom{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 9px);left:8px;right:8px;display:flex;gap:6px;justify-content:space-between}.bottom button{flex:1;background:#0b2838ed;font-size:11px;padding:10px 4px}.hud{position:absolute;right:8px;top:65px;display:flex;flex-direction:column;gap:5px}.hud button{min-width:40px}.dialog{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 66px);left:9px;right:9px;border:1px solid #9476ec;border-radius:14px;background:linear-gradient(130deg,#16263d,#091623);padding:14px;box-shadow:0 0 28px #8b61f455;display:none;max-width:440px;margin:auto}.dialog.open{display:block}.dialog h3{margin:0 0 6px;color:#aeeeff;font-size:16px}.dialog p{color:#b8cbd9;line-height:1.5}.actions{display:flex;gap:5px;flex-wrap:wrap}.actions button{flex:1}.close{float:right}.toast{position:absolute;top:80px;left:50%;transform:translateX(-50%);background:#112d42;border:1px solid #60c5e6;border-radius:9px;padding:9px 12px;display:none;max-width:85%;text-align:center}.search{position:absolute;top:64px;left:8px;display:none;background:#091b2d;border:1px solid #5d83a1;border-radius:10px;padding:10px}.search.open{display:block}.search input{width:72px;background:#081623;color:#fff;border:1px solid #53728d;padding:8px;border-radius:6px}.hint{position:absolute;top:53px;left:8px;color:#8fb7c5;font-size:10px;pointer-events:none} .legend{position:absolute;left:8px;bottom:calc(env(safe-area-inset-bottom) + 60px);color:#a2b8cb;background:#071925c9;padding:5px;border-radius:5px;font-size:9px}</style></head><body>
<div id="world"><canvas id="map"></canvas></div><div class="top"><div class="pill">🌐 <b>WORLD MAP</b> · STATE 43</div><div class="pill" id="coords">X 500 · Y 500</div></div><div class="hint">Drag to explore · Pinch to zoom · Tap a location</div><div class="hud"><button id="plus">＋</button><button id="minus">－</button><button id="home">⌂</button></div><div class="search" id="search">JUMP TO <input id="x" type="number" min="0" max="999" value="500"> : <input id="y" type="number" min="0" max="999" value="500"> <button id="jump">GO</button></div><div class="toast" id="toast"></div><div class="legend">● Cyan UNITY · ● Purple Allies · ● Red Hostile · ◆ Gold Resources</div><div class="dialog" id="dialog"><button class="close" id="close">✕</button><h3 id="name"></h3><p id="details"></p><div class="actions" id="actions"></div></div><div class="bottom"><button id="find">⌖ COORDS</button><button id="bases">⌂ MY HQ</button><button id="bookmarks">☆ SAVED</button><button id="marches">⚔ MARCHES</button></div>
<script>
(()=>{'use strict';const canvas=document.querySelector('#map'),ctx=canvas.getContext('2d');const W=1000,cell=48,world=1000*cell;let w=0,h=0,dpr=1,zoom=1.15,cx=500*cell,cy=500*cell,drag=false,px=0,py=0,moved=false,selected=null,bookmarks=[],marches=[],pointers=new Map(),pinch=0;const key='matrix-world-map-v1';try{const data=JSON.parse(localStorage.getItem(key)||'{}');bookmarks=data.bookmarks||[];marches=data.marches||[]}catch(e){}const save=()=>localStorage.setItem(key,JSON.stringify({bookmarks,marches}));const rnd=n=>{let x=Math.sin(n*127.1+78.233)*43758.5453;return x-Math.floor(x)};const places=[{x:500,y:500,name:'YOUR HEADQUARTERS',type:'hq',alliance:'UNITY',level:30},{x:508,y:497,name:'GhostZero',type:'base',alliance:'UNITY',level:29},{x:491,y:505,name:'NovaPulse',type:'base',alliance:'UNITY',level:28},{x:516,y:511,name:'NullVector',type:'base',alliance:'NEXUS GUARD',level:31},{x:480,y:489,name:'CipherQueen',type:'base',alliance:'RED LEGION',level:30},{x:525,y:484,name:'RedSpectre',type:'base',alliance:'RED LEGION',level:27},{x:502,y:525,name:'HexBlade',type:'base',alliance:'CIPHER ORDER',level:26},{x:500,y:478,name:'UNITY ALLIANCE HQ',type:'alliance',alliance:'UNITY',level:1},{x:464,y:510,name:'RED LEGION HQ',type:'alliance',alliance:'RED LEGION',level:1},{x:533,y:516,name:'NEXUS GUARD HQ',type:'alliance',alliance:'NEXUS GUARD',level:1},{x:520,y:470,name:'NETWORK DOMINION',type:'event',alliance:'NEUTRAL',level:1}];for(let i=0;i<180;i++){let x=Math.floor(rnd(i*3+1)*990)+5,y=Math.floor(rnd(i*3+2)*990)+5;places.push({x,y,name:i%3?'DATA CACHE':'NPC OUTPOST',type:i%3?'resource':'npc',level:1+Math.floor(rnd(i*7+4)*12),alliance:'NEUTRAL'})}const colors={UNITY:'#4cf0e1','NEXUS GUARD':'#8b9fff','RED LEGION':'#ff597a','CIPHER ORDER':'#c48dff',NEUTRAL:'#e4b969'};const screen=(x,y)=>({x:(x*cell-cx)*zoom+w/2,y:(y*cell-cy)*zoom+h/2});const mapPoint=(x,y)=>({x:(x-w/2)/zoom+cx,y:(y-h/2)/zoom+cy});const clamp=()=>{cx=Math.max(0,Math.min(world,cx));cy=Math.max(0,Math.min(world,cy))};const notify=s=>{let t=document.querySelector('#toast');t.textContent=s;t.style.display='block';clearTimeout(notify.timer);notify.timer=setTimeout(()=>t.style.display='none',2200)};function resize(){dpr=Math.min(2,devicePixelRatio||1);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}function draw(){ctx.clearRect(0,0,w,h);ctx.fillStyle='#061523';ctx.fillRect(0,0,w,h);const minx=Math.max(0,Math.floor((cx-w/(2*zoom))/cell)-1),maxx=Math.min(999,Math.ceil((cx+w/(2*zoom))/cell)+1),miny=Math.max(0,Math.floor((cy-h/(2*zoom))/cell)-1),maxy=Math.min(999,Math.ceil((cy+h/(2*zoom))/cell)+1);const step=zoom<.6?5:1;for(let y=miny;y<=maxy;y+=step)for(let x=minx;x<=maxx;x+=step){let p=screen(x,y),r=rnd(x*41+y*83),s=cell*zoom*step;ctx.fillStyle=r>.83?'#133448':r>.43?'#0c2837':'#0a202f';ctx.fillRect(p.x,p.y,s-.8,s-.8);if(r>.96&&zoom>.75){ctx.fillStyle='#1d5260';ctx.fillRect(p.x+8*zoom,p.y+12*zoom,16*zoom,12*zoom)}if(r<.05){ctx.fillStyle='#07303e';ctx.fillRect(p.x+4,p.y+4,s-8,s-8)}}ctx.strokeStyle='#3d778444';ctx.lineWidth=1;for(let i=0;i<places.length;i++){const a=places[i];if(a.type!=='alliance')continue;let p=screen(a.x,a.y),rad=cell*zoom*7;if(p.x+rad<0||p.x-rad>w||p.y+rad<0||p.y-rad>h)continue;ctx.beginPath();ctx.arc(p.x,p.y,rad,0,Math.PI*2);ctx.fillStyle=(colors[a.alliance]||'#fff')+'0c';ctx.fill();ctx.strokeStyle=(colors[a.alliance]||'#fff')+'44';ctx.stroke()}for(const m of marches){if(Date.now()>m.end)continue;const a=screen(m.from.x,m.from.y),b=screen(m.to.x,m.to.y);ctx.strokeStyle='#6ef6ff';ctx.lineWidth=2;ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);let t=Math.min(1,(Date.now()-m.start)/(m.end-m.start));ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(a.x+(b.x-a.x)*t,a.y+(b.y-a.y)*t,4,0,7);ctx.fill()}for(const a of places){let p=screen(a.x,a.y),r=Math.max(8,Math.min(22,13*zoom));if(p.x<-50||p.y<-50||p.x>w+50||p.y>h+50)continue;let color=colors[a.alliance]||'#dcbf74';ctx.shadowColor=color;ctx.shadowBlur=12;ctx.fillStyle='#092231';ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();if(a.type==='resource'){ctx.moveTo(p.x,p.y-r*.8);ctx.lineTo(p.x+r*.65,p.y);ctx.lineTo(p.x,p.y+r*.8);ctx.lineTo(p.x-r*.65,p.y)}else{ctx.moveTo(p.x-r,p.y+r*.7);ctx.lineTo(p.x-r,p.y-r*.35);ctx.lineTo(p.x,p.y-r);ctx.lineTo(p.x+r,p.y-r*.35);ctx.lineTo(p.x+r,p.y+r*.7)}ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle=color;ctx.fillRect(p.x-4,p.y-5,8,10);if(zoom>.65||a.type==='hq'||a.type==='event'){ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillStyle='#e7faff';ctx.fillText(a.name,p.x,p.y+r+12)}}let q=mapPoint(w/2,h/2);document.querySelector('#coords').textContent='X '+Math.round(q.x/cell)+' · Y '+Math.round(q.y/cell)}function choose(a){selected=a;document.querySelector('#name').textContent=a.name;document.querySelector('#details').textContent='X '+a.x+' · Y '+a.y+'  |  '+(a.alliance||'NEUTRAL')+'  |  '+(a.type==='resource'?'RESOURCE LV '+a.level:'LEVEL '+a.level);const actions=document.querySelector('#actions');actions.innerHTML='';const add=(label,fn)=>{let b=document.createElement('button');b.textContent=label;b.onclick=fn;actions.appendChild(b)};add('☆ SAVE',()=>{if(!bookmarks.some(b=>b.x===a.x&&b.y===a.y))bookmarks.push({x:a.x,y:a.y,name:a.name});save();notify('Location bookmarked')});if(a.type==='hq'){add('⌂ HOME',()=>{cx=a.x*cell;cy=a.y*cell;draw();close()})}else{add('🔎 SCOUT',()=>notify('Development scouting target selected · '+a.name));add(a.type==='resource'?'◆ GATHER':'⚔ ATTACK',()=>march(a));if(a.alliance==='UNITY'||a.alliance==='NEXUS GUARD')add('🛡 REINFORCE',()=>march(a,'REINFORCE'))}document.querySelector('#dialog').classList.add('open')}function march(a,type='ATTACK'){const from=places[0],dist=Math.hypot(a.x-from.x,a.y-from.y),now=Date.now();marches.push({from:{x:from.x,y:from.y},to:{x:a.x,y:a.y},name:a.name,type,start:now,end:now+Math.max(10000,Math.min(60000,dist*750))});save();notify(type+' march queued (development simulation)');close()}function close(){document.querySelector('#dialog').classList.remove('open')}function center(x,y){cx=x*cell;cy=y*cell;clamp();draw()}canvas.addEventListener('pointerdown',e=>{pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});canvas.setPointerCapture(e.pointerId);drag=true;px=e.clientX;py=e.clientY;moved=false});canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===2){const pts=[...pointers.values()],dist=Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y);if(pinch)zoom=Math.max(.28,Math.min(3.5,zoom*dist/pinch));pinch=dist;moved=true}else{let dx=e.clientX-px,dy=e.clientY-py;if(Math.abs(dx)+Math.abs(dy)>2)moved=true;cx-=dx/zoom;cy-=dy/zoom;px=e.clientX;py=e.clientY;clamp()}draw()});canvas.addEventListener('pointerup',e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinch=0;if(!moved&&pointers.size===0){let best=null,d=26;for(const a of places){const p=screen(a.x,a.y),dd=Math.hypot(p.x-e.clientX,p.y-e.clientY);if(dd<d){best=a;d=dd}}if(best)choose(best);else close()}drag=false});canvas.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);pinch=0});canvas.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.28,Math.min(3.5,zoom*(e.deltaY>0?.9:1.1)));draw()},{passive:false});document.querySelector('#plus').onclick=()=>{zoom=Math.min(3.5,zoom*1.3);draw()};document.querySelector('#minus').onclick=()=>{zoom=Math.max(.28,zoom/1.3);draw()};document.querySelector('#home').onclick=document.querySelector('#bases').onclick=()=>center(500,500);document.querySelector('#find').onclick=()=>document.querySelector('#search').classList.toggle('open');document.querySelector('#jump').onclick=()=>{center(Math.max(0,Math.min(999,+document.querySelector('#x').value||0)),Math.max(0,Math.min(999,+document.querySelector('#y').value||0)));document.querySelector('#search').classList.remove('open')};document.querySelector('#bookmarks').onclick=()=>{if(!bookmarks.length)return notify('No saved locations yet');let b=bookmarks[bookmarks.length-1];center(b.x,b.y);notify('Last bookmark: '+b.name)};document.querySelector('#marches').onclick=()=>notify(marches.filter(m=>m.end>Date.now()).length+' active simulated marches');document.querySelector('#close').onclick=close;addEventListener('resize',resize);setInterval(()=>{marches=marches.filter(m=>Date.now()<m.end);draw()},1000);resize()})();
</script></body></html>

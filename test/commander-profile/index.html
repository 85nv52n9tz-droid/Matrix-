<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta charset="utf-8"><title>Commander Profile</title><style>*{box-sizing:border-box}body{margin:0;background:#060b16;color:#d8ecff;font:13px system-ui}header{padding:15px;border-bottom:1px solid #29465e;letter-spacing:3px;font-weight:800;color:#63eaff}main{padding:12px;max-width:650px;margin:auto}.hero,.panel{border:1px solid #29465e;border-radius:14px;background:linear-gradient(135deg,#10253b,#080e20);padding:12px;margin-bottom:10px}.hero{text-align:center;background:radial-gradient(ellipse at 50% 35%,#19425a,#080e20 70%)}svg{height:205px;width:100%;display:block}h1{font-size:23px;margin:3px}h2{font-size:13px;color:#65eaff;letter-spacing:1px}small{color:#94acc3}button,input{font:inherit;color:inherit;background:#11283c;border:1px solid #385b74;border-radius:8px;padding:9px}button{cursor:pointer}button.active{border-color:#64eaff;background:#17475b}nav{display:flex;gap:5px;overflow:auto;margin:12px 0}nav button{white-space:nowrap;flex:1}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:12px;background:#081421;border:1px solid #203a50;border-radius:9px}.stat b{display:block;font-size:19px;color:#e4f8ff;margin-top:4px}.gold{color:#f6cf79}.line{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #20364a}.line:last-child{border:0}.badge{display:inline-block;padding:6px 10px;border:1px solid #967b40;border-radius:20px;color:#f6cf79;margin:3px}.muted{opacity:.45}input{width:100%;margin:6px 0}</style></head><body><header>◈ COMMANDER PROFILE</header><main><section class="hero"><small>IDENTITY // MATRIX OPERATIVE</small><div id="portrait"></div><div><button id="male" onclick="choose('male')">Male</button> <button id="female" onclick="choose('female')">Female</button></div><h1 id="name"></h1><small id="identity"></small><div id="vip" class="badge"></div><div class="grid" id="summary"></div></section><nav id="nav"></nav><section class="panel" id="content"></section><small id="source"></small></main><script>let profile={gender:'male',name:'Commander',bio:''},data=null,tab='Overview',key='matrix_commander_profile_dev';try{Object.assign(profile,JSON.parse(localStorage.getItem(key)||'{}'))}catch(e){}const el=id=>document.getElementById(id),esc=s=>String(s??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),fmt=n=>n==null?'—':typeof n==='number'?n.toLocaleString():esc(n);function save(){localStorage.setItem(key,JSON.stringify(profile))}function choose(g){profile.gender=g;save();render()}function portrait(){let m=profile.gender==='male',c=m?'#55e8ff':'#ee8aff';return '<svg viewBox="0 0 280 230"><defs><linearGradient id="armor"><stop stop-color="#557b94"/><stop offset=".45" stop-color="#152a40"/><stop offset="1" stop-color="#080f1c"/></linearGradient><linearGradient id="skin"><stop stop-color="#e1ad93"/><stop offset=".55" stop-color="#b77f69"/><stop offset="1" stop-color="#68433e"/></linearGradient><radialGradient id="light"><stop stop-color="'+c+'" stop-opacity=".5"/><stop offset="1" stop-color="'+c+'" stop-opacity="0"/></radialGradient></defs><circle cx="140" cy="110" r="105" fill="url(#light)"/><circle cx="140" cy="106" r="91" fill="none" stroke="'+c+'" stroke-dasharray="5 10" opacity=".5"/><path d="M29 230L39 178L95 153L116 145H164L185 153L241 178L251 230Z" fill="url(#armor)" stroke="'+c+'"/><path d="M40 178L92 166L112 230H52Z M240 178L188 166L168 230H228Z" fill="#304b61" stroke="'+c+'"/><path d="M115 130V157L140 177L165 157V130" fill="url(#skin)"/>'+(!m?'<path d="M92 140L83 73Q85 20 139 19Q197 20 198 85L190 158L167 144H108Z" fill="#252338" stroke="'+c+'"/>':'')+'<path d="M98 65Q100 29 140 29Q182 29 184 65L178 111L163 140L140 151L117 140L102 111Z" fill="url(#skin)" stroke="#644c50"/><path d="'+(m?'M96 82L95 51Q104 22 140 23Q180 21 186 57L182 79L167 47L118 48Z':'M94 82Q84 26 133 22Q184 15 191 65L183 99L169 59L123 47L103 88Z')+'" fill="#202b3b" stroke="'+c+'"/><path d="M101 93L122 86L139 91L158 86L179 93L174 106L151 108L140 101L129 108L106 106Z" fill="#102637" stroke="'+c+'" stroke-width="2"/><path d="M110 96H128M151 96H170" stroke="'+c+'" stroke-width="3"/><path d="M140 100L135 119L144 120M129 131Q140 135 151 130" fill="none" stroke="#68433e" stroke-width="2"/><path d="M94 164L140 197L186 164M140 197V230" fill="none" stroke="'+c+'" stroke-width="3"/><path d="M119 213L140 201L161 213L140 225Z" fill="'+c+'"/></svg>'}const rows=a=>a.map(([k,v])=>'<div class="line"><span>'+esc(k)+'</span><b>'+fmt(v)+'</b></div>').join(''),cards=a=>a.map(([k,v])=>'<div class="stat"><small>'+esc(k)+'</small><b>'+fmt(v)+'</b></div>').join('');function render(){let d=data||{},s=d.stats||{},r=d.resources||{};el('portrait').innerHTML=portrait();['male','female'].forEach(g=>el(g).classList.toggle('active',profile.gender===g));el('name').textContent=profile.name;el('identity').textContent=(d.alliance||'No alliance data')+' · HQ '+(d.hq??'—');el('vip').textContent='VIP '+(d.vip??'—');el('summary').innerHTML=cards([['Nano power',d.power],['Enemy bots destroyed',d.kills]]);el('nav').innerHTML=['Overview','Combat','Economy','Progress','Awards','Identity'].map(t=>'<button class="'+(t===tab?'active':'')+'" onclick="tab=\''+t+'\';render()">'+t+'</button>').join('');let h='<h2>'+tab.toUpperCase()+'</h2>';if(tab==='Overview')h+=rows([['HQ level',d.hq],['Prestige',d.prestige],['VIP points',d.vipPoints],['Alliance',d.alliance],['Nano roster',d.bots],['Crew level',d.crew],['Research entries',d.research],['Active upgrades',d.upgrades]]);if(tab==='Combat')h+=rows([['Nano combat power',d.power],['Bots deployed in roster',d.bots],['Attack victories',s.aw],['Attack defeats',s.al],['Defence victories',s.dw],['Defence defeats',s.dl],['Win rate',s.aw+s.al>0?Math.round(100*s.aw/(s.aw+s.al))+'%':null],['Enemy bots destroyed',d.kills],['Kill tokens',d.killTokens]])+ '<h2>NANO TIERS</h2>'+rows((d.tiers||[]).map((n,i)=>['Tier '+(i+1),n]));if(tab==='Economy')h+=rows([['Credits',r.cr],['Data',r.da],['Crypto',r.cy],['Exploits',r.ex],['Intel',r.in],['Quantum',r.qt]]);if(tab==='Progress')h+=rows([['HQ',d.hq],['Prestige',d.prestige],['VIP level',d.vip],['VIP points',d.vipPoints],['Research entries',d.research],['Active upgrades',d.upgrades]])+rows(d.buildings||[]);if(tab==='Awards')h+=[['First command',d.hq>=1],['City architect',d.hq>=10],['Maximum HQ',d.hq>=30],['First victory',s.aw>=1],['Nano legion',d.bots>=1000],['VIP elite',d.vip>=12],['Prestige commander',d.prestige>=1]].map(([n,ok])=>'<span class="badge '+(ok?'':'muted')+'">'+(ok?'◆ ':'◇ ')+n+'</span>').join('');if(tab==='Identity')h+='<label>Display alias<input id="alias" maxlength="24" value="'+esc(profile.name)+'"></label><label>Commander motto<input id="bio" maxlength="100" value="'+esc(profile.bio)+'"></label><button onclick="profile.name=el(\'alias\').value.trim()||\'Commander\';profile.bio=el(\'bio\').value;save();render()">Save identity</button>';el('content').innerHTML=h;el('source').textContent=data?'Live read-only snapshot from the development game. Identity saved locally.':'Open via DEV to connect game statistics.'}window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===parent&&e.data?.type==='matrix-profile'){data=e.data.payload;render()}});render();if(parent!==window)parent.postMessage({type:'matrix-profile-request'},location.origin);</script></body></html>

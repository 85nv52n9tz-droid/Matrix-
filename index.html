<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I love you</title></title>
<style>
:root{color-scheme:dark;--lv:#5ab8ff;--rw:#ffb347;--pi:#c08bff;--bg:#040a06;--panel:#08130c;--line:#12402a;--text:#b9ffd0;--dim:#5fa27c;--ok:#39ff88;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:13px/1.3 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);z-index:20}
main{max-width:560px;margin:0 auto;padding:0 10px 14px}
.hdr{position:relative;height:40px;margin:6px 0;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:#020604}
.hdr canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.5}
.hdr h1{position:relative;margin:0;padding:0 10px;line-height:38px;font-size:16px;color:var(--ok);text-shadow:0 0 8px #39ff88}
.cur{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){.cur{animation:none}}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding-bottom:6px}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:4px 5px;min-width:0}
.chip .cl{display:flex;align-items:center;gap:3px}
.chip svg{width:13px;height:13px;flex:none}
.chip b{font-size:12px;overflow:hidden;white-space:nowrap;text-shadow:0 0 6px currentColor}
.chip small{display:block;font-size:9px;color:var(--pi);white-space:nowrap;overflow:hidden}
nav{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:5px 0;background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:10px}
nav svg{width:14px;height:14px}
nav button.on{border-color:var(--ok);color:var(--ok);background:#0c2415;box-shadow:0 0 8px rgba(57,255,136,.25)}
button{font:inherit;color:var(--text);cursor:pointer}
.card{display:flex;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px;margin:6px 0}
.card.hq{border-color:var(--ok);box-shadow:0 0 10px rgba(57,255,136,.18)}
.ico{flex:none;width:34px;height:34px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ok);background:#050f08}
.ico svg{width:22px;height:22px}
.hq .ico{width:42px;height:42px}.hq .ico svg{width:28px;height:28px}
.bd{flex:1;min-width:0}
.row{display:flex;justify-content:space-between;gap:8px}
.name{font-weight:700}.name em{font-style:normal;color:var(--lv);font-weight:400;font-size:12px}
.locked{color:var(--dim);font-size:11px;text-align:right}
.desc{color:var(--dim);font-size:11px;margin:1px 0 6px;white-space:pre-line}
.buy{width:100%;padding:6px 8px;border-radius:5px;border:1px solid var(--line);background:#0b1f12;text-align:left;font-size:12px}
.buy:disabled{opacity:.45;cursor:default}
.buy:not(:disabled){border-color:var(--ok);color:var(--ok)}
.prog{height:4px;background:#020604;border-radius:2px;margin:0 0 6px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);width:0}
#log{background:#020604;border:1px solid var(--line);border-radius:6px;padding:6px 8px;height:84px;overflow:auto;font-size:11px;color:var(--ok);margin-top:8px}
#map{width:100%;display:block;background:#030805;border:1px solid var(--line);border-radius:6px}
#map circle.n{cursor:pointer}
#map text{fill:var(--dim);font-size:3.6px;pointer-events:none;text-anchor:middle}
.foot{display:flex;justify-content:space-between;margin-top:10px;color:var(--dim);font-size:11px;gap:8px}
.foot button{background:none;border:1px solid var(--line);border-radius:6px;padding:3px 8px;color:var(--dim)}
.btns{display:flex;gap:6px}
.btns .buy{flex:1;min-width:0}
.fin{flex:none;padding:6px 8px;border-radius:5px;border:1px solid #5bff7a;background:#0d2412;color:#5bff7a;font-size:11px;max-width:45%}
.fin:disabled{opacity:.45;cursor:default}
#blds{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
#blds .card{flex-direction:column;gap:6px;margin:0}
#blds .ico{width:28px;height:28px}#blds .ico svg{width:18px;height:18px}
#blds .row{flex-direction:column;gap:0}
#blds .locked{text-align:left}
#blds .btns{flex-direction:column}
#blds .fin{max-width:none}
.lv{color:var(--lv)}
#blds .locked,#nd .locked,#hqc .locked{color:var(--pi)}
#mlist .locked{color:var(--rw)}
#tiers{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
#tiers .card{flex-direction:column;gap:6px;margin:0}
#tiers .ico{width:28px;height:28px}#tiers .ico svg{width:18px;height:18px}
#tiers .row{flex-direction:column;gap:0}
#tiers .locked{text-align:left}
#tiers .btns{flex-direction:column}
#tiers .fin{max-width:none}
#qty{display:flex;gap:4px;margin:6px 0 0}
#qty button{flex:1;padding:5px;background:var(--panel);border:1px solid var(--line);border-radius:6px;font-size:12px}
#qty button.on{border-color:var(--ok);color:var(--ok)}
.rwd{color:var(--rw)}
</style>
</head>
<body>
<main>
<div class="top">
  <div class="hdr"><canvas id="rain"></canvas><h1>Backdoor HQ<span class="cur">_</span></h1></div>
  <div class="chips" id="chips"></div>
  <nav id="tabs"></nav>
</div>
<section id="t-hq">
  <div id="hqc"></div>
  <div id="blds"></div>
  <div id="log"></div>
</section>
<section id="t-mis"><div id="mlist"></div></section>
<section id="t-map"><svg id="map" viewBox="0 0 200 100"></svg><div id="nd"></div></section>
<section id="t-bot"><div id="nlab"></div><div id="qty"></div><div id="tiers"></div></section>
<section id="t-crew"><div id="crew"></div></section>
<div class="foot"><span>Offline income is capped at 8 hours.</span><button id="reset">Wipe save</button></div>
</main>
<script>
var RS=[['cr','Credits','#e8ff5a'],['da','Data','#3ff2d0'],['cy','Crypto','#5bff7a'],['ex','Exploits','#ff6b5a'],['in','Influence','#b3ffd9']];

var B=[
 {id:'node',name:'love you',desc:'Hijacked devices that farm credits.',res:'cr',rate:1,cost:{cr:20},u:1},
 {id:'siphon',name:'Data siphon',desc:'Quietly copies databases.',res:'da',rate:0.5,cost:{cr:60},u:1},

 {id:'fra',name:'Frankfurt',desc:'Tap the internet exchange.',res:'da',rate:1.2,cost:{cr:300,da:15},u:2,x:101,y:27},
 {id:'lag',name:'Lagos',desc:'Crypto flows through here.',res:'cy',rate:0.5,cost:{cr:1000,da:60},u:3,x:100,y:57},
 {id:'tok',name:'Tokyo',desc:'Source of rare zero-days.',res:'ex',rate:0.3,cost:{cr:2500,da:150,cy:15},u:4,x:160,y:34},
 {id:'sao',name:'São Paulo',desc:'A huge audience to sway.',res:'in',rate:0.2,cost:{cr:4000,da:300,cy:30},u:3,x:66,y:73},
 {id:'syd',name:'Sydney',desc:'Wealthy banks, weak firewalls.',res:'cr',rate:400,cost:{cr:40000,da:2000,cy:200,ex:20},u:6,x:167,y:75}
];
var M=[
 {id:'m1',name:'Phish the intern',desc:'Easy credentials, small payout.',time:20,cost:{},rew:{cr:60,da:5},u:1},
 {id:'m2',name:'Skim a payment terminal',desc:'Quick card skimming job.',time:45,cost:{cr:50},rew:{cr:220,da:20},u:1},
 {id:'m3',name:'Leak a database',desc:'Sell a customer list on the dark market.',time:120,cost:{cr:300},rew:{da:200,cy:8},u:2},

 {id:'m5',name:'Steal a zero-day',desc:'Break into a security vendor.',time:480,cost:{da:300},rew:{ex:15,cy:30},u:4},
 {id:'m6',name:'Topple a corrupt CEO',desc:'Leak the emails. Watch the markets move.',time:900,cost:{cr:15000},rew:{in:30,cr:40000},u:4}
];
var MAXHQ=30,KEY='backdoorhq3',OLD='';
function fresh(){return{r:{cr:50,da:0,cy:5,ex:0,in:0},hq:1,lv:{},up:{},nb:[0,0,0,0,0,0],nq:{},mis:{},tr:0,sl:1,t:Date.now()}}
var S=fresh();
function load(){
  try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.r){var f=fresh();S=f;for(var k in s)S[k]=s[k];for(var k2 in f.r)if(typeof S.r[k2]!=='number')S.r[k2]=0;return}}catch(e){}
  try{var o=JSON.parse(localStorage.getItem(OLD));if(o&&typeof o.cr==='number'){S.r.cr=o.cr;S.r.da=o.d||0;S.hq=o.hq||1;S.lv=o.lv||{};S.t=o.t||Date.now()}}catch(e){}
}
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(i){return document.getElementById(i)};
function fmt(n){if(n<1000)return n<10?n.toFixed(1).replace(/\.0$/,''):Math.floor(n)+'';var u=['K','M','B','T','Qa'],i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}return n.toFixed(n<10?2:1)+u[i]}
function fmtT(s){s=Math.max(0,Math.ceil(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60,p=function(n){return n<10?'0'+n:n};return h?h+':'+p(m)+':'+p(x):m+':'+p(x)}
function mult(){return 1+0.15*(S.hq-1)}
function isNode(o){return o.x!==undefined}
function cap(o){return S.hq}
function lvl(o){return S.lv[o.id]||0}
function scale(base,g){var c={};for(var k in base)c[k]=Math.ceil(base[k]*g);return c}
function cost(o){return scale(o.cost,Math.pow(1.7,lvl(o)))}
function hqCost(){var g=S.hq-1,c={cr:Math.ceil(200*Math.pow(1.7,g)),da:Math.ceil(40*Math.pow(1.7,g))};
  if(S.hq>=2)c.cy=Math.ceil(8*Math.pow(1.7,g-1));
  if(S.hq>=3)c.ex=Math.ceil(3*Math.pow(1.7,g-2));
  if(S.hq>=5)c.in=Math.ceil(2*Math.pow(1.7,g-4));return c}
function upTime(k,to){return (k==='hq'?120:60)*Math.pow(1.15,to-1)}
function finCost(k,to,rem){return Math.max(1,Math.ceil(rem/15*Math.pow(1.3,to-1)))}
function mf(){return Math.pow(1.5,S.hq-1)}
var TR=[
 {name:'Swarm drone',cost:{cr:30},t:10,p:1},
 {name:'Worm',cost:{cr:300,da:40},t:25,p:3},
 {name:'Trojan',cost:{cr:3000,da:300,cy:30},t:62,p:9},
 {name:'Rootkit',cost:{cr:30000,da:3000,cy:300,ex:30},t:156,p:27},
 {name:'Phantom',cost:{cr:300000,da:30000,cy:3000,ex:300,in:30},t:390,p:81},
 {name:'Singularity',cost:{cr:3000000,da:300000,cy:30000,ex:3000,in:300},t:976,p:243}
];
var TC=['#5bff7a','#3ff2d0','#5ab8ff','#c08bff','#ffb347','#ff6b5a'];
function tierMax(){return Math.ceil(S.hq/5)}
function capN(){return 10*S.hq}
function used(){var u=0;TR.forEach(function(t,i){u+=((S.nb[i]||0)+(S.nq[i]?S.nq[i].n:0))*(i+1)});return u}
function power(){var p=0;TR.forEach(function(t,i){p+=(S.nb[i]||0)*t.p});return p}
function armyB(){return Math.sqrt(power())/100}
function batchN(i){var room=Math.max(0,Math.floor((capN()-used())/(i+1))),c=TR[i].cost,m=room;if(qty!=='max')return Math.min(qty,room);for(var k in c)m=Math.min(m,Math.floor(S.r[k]/c[k]));return Math.max(0,m)}
function nbTrain(i){
  if(S.nq[i]||i>=tierMax())return;var n=batchN(i);if(n<1)return;var c=scale(TR[i].cost,n);if(!afford(c))return;pay(c);
  var now=Date.now();S.nq[i]={n:n,s:now,end:now+TR[i].t*n*timeM()*1000};log('Training '+n+' '+TR[i].name+(n>1?'s':''));save();render();
}
function nbDone(i){var q=S.nq[i];if(!q)return;S.nb[i]=(S.nb[i]||0)+q.n;delete S.nq[i];log(q.n+' '+TR[i].name+(q.n>1?'s':'')+' ready')}
function nbFinish(i){var q=S.nq[i];if(!q)return;var c=finCost('nb'+i,(i+1)*5,(q.end-Date.now())/1000);if(S.r.cy<c)return;S.r.cy-=c;nbDone(i);save();render()}
function renderNano(){
  var tm=tierMax(),u=used(),cp=capN(),L=E.nl,n=Date.now();
  L.e.textContent='T'+tm+' unlocked';
  L.d.innerHTML='Capacity <span class="lv">'+fmt(u)+'/'+fmt(cp)+'</span> \u00b7 power '+fmt(power())+' \u00b7 <span class="rwd">+'+Math.round(armyB()*100)+'% mission rewards</span>';
  L.p.hidden=false;L.pi.style.width=Math.min(100,u/cp*100)+'%';
  qb.forEach(function(b,j){b.className=qv[j]===qty?'on':''});
  TR.forEach(function(t,i){
    var e=E['t'+i],q=S.nq[i];e.c.style.opacity=i>=tm?.5:1;
    if(i>=tm){e.m.textContent='';e.b.textContent='Unlocks at HQ level '+(i*5+1);e.b.disabled=true;e.f.hidden=true;e.p.hidden=true;return}
    e.m.textContent='x'+fmt(S.nb[i]||0)+' \u00b7 power '+fmt(t.p);
    if(q){var rem=(q.end-n)/1000,fc=finCost('nb'+i,(i+1)*5,rem);e.p.hidden=false;e.pi.style.width=Math.min(100,(n-q.s)/(q.end-q.s)*100)+'%';e.b.textContent='Training '+q.n+' \u00b7 '+fmtT(rem);e.b.disabled=true;e.f.hidden=false;e.f.textContent='Finish \u00b7 '+fmt(fc)+' crypto';e.f.disabled=S.r.cy<fc;return}
    e.p.hidden=true;e.f.hidden=true;
    var nn=batchN(i),room=Math.floor((cp-u)/(i+1));
    if(room<1){e.b.textContent='Capacity full. Upgrade HQ.';e.b.disabled=true;return}
    if(nn<1){e.b.textContent='Need '+cs(t.cost);e.b.disabled=true;return}
    var c=scale(t.cost,nn);e.b.textContent='Train x'+nn+' \u00b7 '+cs(c)+' \u00b7 '+fmtT(t.t*nn*timeM());e.b.disabled=!afford(c);
  });
}
function reqs(){return B.map(function(o){return{name:o.name,l:lvl(o),ok:lvl(o)>=S.hq}})}
function out(o,l){return o.rate*l*Math.pow(1.2,l-1)}
function trainCost(){var g=Math.pow(2.1,S.tr);return{cr:Math.ceil(150*g),da:Math.ceil(30*g)}}
function hireCost(){var g=Math.pow(4,S.sl-1);return{cr:Math.ceil(600*g),da:Math.ceil(150*g)}}
function afford(c){for(var k in c)if(S.r[k]<c[k])return false;return true}
function pay(c){for(var k in c)S.r[k]-=c[k]}
function cs(c){var p=[];for(var k in c)if(c[k])p.push(fmt(c[k])+' '+NM[k]);return p.join(', ')||'free'}
function rates(){var r={cr:0,da:0,cy:0,ex:0,in:0},m=mult();B.concat(N).forEach(function(o){r[o.res]+=out(o,lvl(o))*m});return r}
function rewM(){return 1+0.1*S.tr+armyB()}
function timeM(){return Math.max(0.3,1-0.04*S.tr)}
function running(){var n=Date.now(),c=0;for(var k in S.mis)if(S.mis[k].end>n)c++;return c}
function log(t){var l=$('log'),d=document.createElement('div');d.textContent='> '+t;l.appendChild(d);while(l.children.length>40)l.removeChild(l.firstChild);l.scrollTop=l.scrollHeight}
var IC={
 cr:'<circle cx="12" cy="12" r="8"/><path d="M12 7v10M9.5 9.5h4a1.8 1.8 0 010 3.6h-3a1.8 1.8 0 000 3.6h4.5"/>',
 da:'<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v12c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12c0 1.7 3.1 3 7 3s7-1.3 7-3"/>',
 cy:'<path d="M12 3l7 4v10l-7 4-7-4V7z"/><circle cx="12" cy="12" r="2.5"/>',
 ex:'<path d="M12 8a4 4 0 014 4v3a4 4 0 01-8 0v-3a4 4 0 014-4zM8 12H4M16 12h4M8 16l-3 2M16 16l3 2M9 5l1.5 2M15 5l-1.5 2"/>',
 in:'<path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
 node:'<circle cx="6" cy="7" r="2"/><circle cx="18" cy="7" r="2"/><circle cx="12" cy="18" r="2"/><circle cx="12" cy="11" r="1.5"/><path d="M7.7 8.2l3.3 2M16.3 8.2L13 10.2M12 12.5V16"/>',
 siphon:'<path d="M4 5h16l-6 7v6l-4 2v-8z"/>',
 miner:'<rect x="6" y="6" width="12" height="12" rx="1"/><rect x="9.5" y="9.5" width="5" height="5"/><path d="M9 3v3M15 3v3M9 18v3M15 18v3M3 9h3M3 15h3M18 9h3M18 15h3"/>',
 lab:'<path d="M9 3h6M10 3v6L5 19a1.5 1.5 0 001.3 2h11.4a1.5 1.5 0 001.3-2l-5-10V3"/><path d="M7.5 15h9"/>',
 hq:'<path d="M4 21V9l8-5 8 5v12M9 21v-6h6v6M12 4V2"/><path d="M8 11h2M14 11h2"/>',
 mis:'<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/>',
 map:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
 bot:'<rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 4v4M9 13h.01M15 13h.01M9 16h6M3 12v3M21 12v3"/><circle cx="12" cy="3.5" r="1"/>',
 crew:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>'
};
function ic(k){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+(IC[k]||IC.mis)+'</svg>'}
function card(parent,cls,icon){
  var c=document.createElement('div');c.className='card '+(cls||'');
  c.innerHTML='<div class="ico">'+ic(icon)+'</div><div class="bd"><div class="row"><div class="name"><span></span> <em></em></div><div class="locked"></div></div><div class="desc"></div><div class="prog" hidden><i></i></div><div class="btns"><button class="buy"></button><button class="fin" hidden></button></div></div>';
  parent.appendChild(c);
  return{c:c,i:c.querySelector('.ico'),t:c.querySelector('span'),e:c.querySelector('em'),m:c.querySelector('.locked'),d:c.querySelector('.desc'),p:c.querySelector('.prog'),pi:c.querySelector('i'),b:c.querySelector('.buy'),f:c.querySelector('.fin')};
}
var E={},tab='hq',sel='sf',chips={},tb={},qty=1,qb=[],qv=[];
function build(){
  RS.forEach(function(r){var d=document.createElement('div');d.className='chip';d.title=r[1];d.style.color=r[2];d.innerHTML='<div class="cl">'+ic(r[0])+'<b></b></div><small></small>';$('chips').appendChild(d);chips[r[0]]={v:d.querySelector('b'),r:d.querySelector('small')}});
  [['hq','HQ'],['mis','Missions'],['map','Map'],['bot','Nano'],['crew','Crew']].forEach(function(t){var b=document.createElement('button');b.innerHTML=ic(t[0])+'<span>'+t[1]+'</span>';b.onclick=function(){show(t[0])};$('tabs').appendChild(b);tb[t[0]]=b});
  E.hq=card($('hqc'),'hq','hq');E.hq.t.textContent='Headquarters';E.hq.b.onclick=upHQ;E.hq.f.onclick=function(){finish('hq')};
  B.forEach(function(o){var e=E[o.id]=card($('blds'),'',o.id);e.t.textContent=o.name;e.d.textContent=o.desc;e.b.onclick=function(){buy(o)};e.f.onclick=function(){finish(o.id)}});
  M.forEach(function(o){var e=E[o.id]=card($('mlist'),'','mis');e.t.textContent=o.name;e.d.textContent=o.desc;e.b.onclick=function(){mission(o)}});
  E.nd=card($('nd'),'','map');E.nd.b.onclick=function(){buy(N.filter(function(n){return n.id===sel})[0])};
  var cc=$('crew');
  E.ch=card(cc,'','crew');E.ch.t.textContent='Ghost';E.ch.e.textContent='crew chief';E.ch.e.style.color='var(--dim)';E.ch.b.hidden=true;
  E.tr=card(cc,'','crew');E.tr.t.textContent='Train the crew';E.tr.d.textContent='Each level adds 10% to mission rewards and cuts mission time by 4%.';E.tr.b.onclick=train;
  E.hi=card(cc,'','crew');E.hi.t.textContent='Recruit a hacker';E.hi.d.textContent='Every hacker lets you run one more mission at the same time (max 4).';E.hi.b.onclick=hire;
  E.nl=card($('nlab'),'hq','bot');E.nl.t.textContent='Nanobot lab';E.nl.b.parentNode.hidden=true;
  [[1,'x1'],[10,'x10'],['max','Max']].forEach(function(a){var b=document.createElement('button');b.textContent=a[1];b.onclick=function(){qty=a[0];render()};$('qty').appendChild(b);qb.push(b);qv.push(a[0])});
  TR.forEach(function(t,i){var e=E['t'+i]=card($('tiers'),'','bot');e.t.textContent=t.name;e.e.textContent='T'+(i+1);e.d.textContent='Uses '+(i+1)+' capacity each.';e.i.style.color=TC[i];e.b.onclick=function(){nbTrain(i)};e.f.onclick=function(){nbFinish(i)}});
  buildMap();
}
function buildMap(){
  var el=[[45,32,22,14],[62,68,9,16],[100,28,10,8],[102,55,12,17],[140,32,30,15],[165,72,10,6]],s='';
  for(var x=4;x<198;x+=3)for(var y=4;y<98;y+=3)for(var i=0;i<el.length;i++){var e=el[i],dx=(x-e[0])/e[2],dy=(y-e[1])/e[3];if(dx*dx+dy*dy<=1){s+='<circle cx="'+x+'" cy="'+y+'" r=".7" fill="#14402a"/>';break}}
  N.forEach(function(n){s+='<circle class="n" data-id="'+n.id+'" cx="'+n.x+'" cy="'+n.y+'" r="3.6" stroke-width="1"/><text x="'+n.x+'" y="'+(n.y+8)+'">'+n.name+'</text>'});
  $('map').innerHTML=s;
  $('map').addEventListener('click',function(ev){var id=ev.target.getAttribute&&ev.target.getAttribute('data-id');if(id){sel=id;render()}});
}
function show(t){tab=t;['hq','mis','map','bot','crew'].forEach(function(k){$('t-'+k).hidden=k!==t;tb[k].className=k===t?'on':''});render()}
function buy(o){
  if(S.hq<o.u||lvl(o)>=cap(o)||S.up[o.id])return;var c=cost(o);if(!afford(c))return;
  pay(c);
  if(isNode(o)){var first=lvl(o)===0;S.lv[o.id]=lvl(o)+1;log((first?'Infiltrated ':'Reinforced ')+o.name+' to level '+S.lv[o.id])}
  else{var n=Date.now();S.up[o.id]={s:n,end:n+upTime(o.id,lvl(o)+1)*1000};log('Started '+o.name+' upgrade to level '+(lvl(o)+1))}
  save();render();
}
function doneUp(k){
  delete S.up[k];
  if(k==='hq'){S.hq++;var nb=N.concat(M).filter(function(b){return b.u===S.hq});log('HQ is now level '+S.hq+(nb.length?'. Unlocked: '+nb.map(function(b){return b.name}).join(', '):'')+'.');if(S.hq>1&&(S.hq-1)%5===0)log('Nanobot tier T'+((S.hq-1)/5+1)+' unlocked: '+TR[(S.hq-1)/5].name)}
  else{var o=B.filter(function(b){return b.id===k})[0];S.lv[k]=lvl(o)+1;log(o.name+' is now level '+S.lv[k])}
}
function settle(){var n=Date.now();for(var k in S.up)if(S.up[k].end<=n)doneUp(k);for(var j in S.nq)if(S.nq[j].end<=n)nbDone(+j)}
function finish(k){var u=S.up[k];if(!u)return;var to=(k==='hq'?S.hq:lvl(B.filter(function(b){return b.id===k})[0]))+1,c=finCost(k,to,(u.end-Date.now())/1000);if(S.r.cy<c)return;S.r.cy-=c;doneUp(k);save();render()}
function upHQ(){
  if(S.hq>=MAXHQ||S.up.hq||!reqs().every(function(x){return x.ok}))return;var c=hqCost();if(!afford(c))return;pay(c);
  var n=Date.now();S.up.hq={s:n,end:n+upTime('hq',S.hq+1)*1000};log('Started HQ upgrade to level '+(S.hq+1));save();render();
}
function mission(o){
  var st=S.mis[o.id],n=Date.now();
  if(st&&st.end<=n){var rm=rewM()*mf(),out=[];for(var k in o.rew){S.r[k]+=o.rew[k]*rm;out.push(fmt(o.rew[k]*rm)+' '+NM[k])}delete S.mis[o.id];log('Mission complete: '+o.name+'. Gained '+out.join(', ')+'.');save();render();return}
  var mc=scale(o.cost,mf());if(st||S.hq<o.u||running()>=S.sl||!afford(mc))return;
  pay(mc);S.mis[o.id]={s:n,end:n+o.time*1000*timeM()};log('Started mission: '+o.name);save();render();
}
function train(){if(S.tr>=10)return;var c=trainCost();if(!afford(c))return;pay(c);S.tr++;log('Crew trained to level '+S.tr);save();render()}
function hire(){if(S.sl>=4)return;var c=hireCost();if(!afford(c))return;pay(c);S.sl++;log('New hacker recruited. You can run '+S.sl+' missions at once.');save();render()}
function leveled(e,o){
  var l=lvl(o),m=mult(),up=!isNode(o)&&S.up[o.id];
  if(S.hq<o.u){e.m.textContent='Locked';e.m.style.color='var(--dim)';e.e.textContent='';e.b.textContent='Unlocks at HQ level '+o.u;e.b.disabled=true;return}
  var c=cost(o);e.m.style.color='';e.e.textContent='lv '+l+'/'+cap(o);
  e.m.textContent=l?'+'+fmt(out(o,l)*m)+'/s '+NM[o.res]:'';
  if(up)return timerUI(e,o.id,l+1);
  e.p.hidden=true;e.f.hidden=true;
  if(l>=cap(o)){e.b.textContent='At HQ level cap. Upgrade HQ to continue.';e.b.disabled=true}
  else{e.b.textContent=(l?(isNode(o)?'Reinforce':'Upgrade'):(isNode(o)?'Infiltrate':'Build'))+' · '+cs(c)+(isNode(o)?'':' · '+fmtT(upTime(o.id,l+1)));e.b.disabled=!afford(c)}
}
function timerUI(e,k,to){
  var u=S.up[k],n=Date.now(),rem=(u.end-n)/1000,fc=finCost(k,to,rem);
  e.p.hidden=false;e.pi.style.width=Math.min(100,(n-u.s)/(u.end-u.s)*100)+'%';
  e.b.textContent='Upgrading to level '+to+' · '+fmtT(rem);e.b.disabled=true;
  e.f.hidden=false;e.f.textContent='Finish · '+fmt(fc)+' crypto';e.f.disabled=S.r.cy<fc;
}
function render(){
  var r=rates(),m=mult();
  RS.forEach(function(x){chips[x[0]].v.textContent=fmt(S.r[x[0]]);chips[x[0]].r.textContent='+'+fmt(r[x[0]])+'/s'});
  if(tab==='hq'){
    var h=E.hq,need=reqs(),ok=need.every(function(x){return x.ok});
    h.e.textContent='level '+S.hq+'/'+MAXHQ;h.m.textContent='+'+Math.round((m-1)*100)+'% to all income';
    h.d.innerHTML=S.hq>=MAXHQ?'Your HQ is fully upgraded.':'To reach level <span class="lv">'+(S.hq+1)+'</span>, all four buildings must be level <span class="lv">'+S.hq+'</span>:\n'+need.map(function(x){return (x.ok?'✓ ':'✗ ')+x.name+' <span class="lv">'+x.l+'/'+S.hq+'</span>'}).join('\n');
    if(S.hq>=MAXHQ){h.p.hidden=true;h.f.hidden=true;h.b.textContent='HQ is at max level';h.b.disabled=true}
    else if(S.up.hq)timerUI(h,'hq',S.hq+1);
    else{var hc=hqCost();h.p.hidden=true;h.f.hidden=true;h.b.textContent='Upgrade HQ · '+cs(hc)+' · '+fmtT(upTime('hq',S.hq+1));h.b.disabled=!ok||!afford(hc)}
    B.forEach(function(o){leveled(E[o.id],o)});
  }
  if(tab==='mis')renderMis();
  if(tab==='map'){
    N.forEach(function(n){var c=$('map').querySelector('[data-id="'+n.id+'"]'),l=lvl(n),locked=S.hq<n.u;
      c.setAttribute('stroke',locked?'#1a5a38':CL[n.res]);c.setAttribute('fill',locked?'#08130c':(l?CL[n.res]:'#030805'));c.setAttribute('stroke-width',n.id===sel?'2':'1')});
    var n=N.filter(function(x){return x.id===sel})[0];E.nd.t.textContent=n.name;E.nd.i.innerHTML=ic(n.res);E.nd.i.style.color=CL[n.res];E.nd.d.textContent=n.desc+' Produces '+NM[n.res]+'.';leveled(E.nd,n);
  }
  if(tab==='bot')renderNano();
  if(tab==='crew'){
    E.ch.m.textContent='Slots '+running()+'/'+S.sl+' in use';
    E.ch.d.textContent='Mission rewards +'+Math.round((rewM()-1)*100)+'%, mission time -'+Math.round((1-timeM())*100)+'%. Open the Missions tab to send the crew out.';
    E.tr.e.textContent='level '+S.tr+'/10';
    if(S.tr>=10){E.tr.b.textContent='Crew fully trained';E.tr.b.disabled=true}else{var tc=trainCost();E.tr.b.textContent='Train · '+cs(tc);E.tr.b.disabled=!afford(tc)}
    E.hi.e.textContent=S.sl+'/4 hackers';
    if(S.sl>=4){E.hi.b.textContent='Crew is full';E.hi.b.disabled=true}else{var hc2=hireCost();E.hi.b.textContent='Recruit · '+cs(hc2);E.hi.b.disabled=!afford(hc2)}
  }
}
function renderMis(){
  var n=Date.now(),rm=rewM()*mf();
  M.forEach(function(o){
    var e=E[o.id],st=S.mis[o.id],rw=[];for(var k in o.rew)rw.push(fmt(o.rew[k]*rm)+' '+NM[k]);
    e.m.textContent='Reward: '+rw.join(', ');e.m.style.color='';
    e.p.hidden=!st;
    if(S.hq<o.u){e.m.textContent='Locked';e.m.style.color='var(--dim)';e.b.textContent='Unlocks at HQ level '+o.u;e.b.disabled=true;return}
    if(st&&st.end<=n){e.pi.style.width='100%';e.b.textContent='Collect rewards';e.b.disabled=false}
    else if(st){e.pi.style.width=Math.min(100,(n-st.s)/(st.end-st.s)*100)+'%';e.b.textContent='In progress · '+fmtT((st.end-n)/1000);e.b.disabled=true}
    else{var mc=scale(o.cost,mf());e.b.textContent='Start · '+cs(mc)+' · '+fmtT(o.time*timeM());e.b.disabled=running()>=S.sl||!afford(mc)}
  });
}
var last=Date.now(),sv=0;
function tick(){
  var n=Date.now(),dt=Math.min((n-last)/1000,1);last=n;
  settle();var r=rates();for(var k in r)S.r[k]+=r[k]*dt;render();
  sv+=dt;if(sv>5){sv=0;save()}
}
load();build();
var away=Math.min((Date.now()-S.t)/1000,8*3600),r0=rates();
log('Connection established.');
if(away>30){var g=[];for(var k in r0)if(r0[k]>0){S.r[k]+=r0[k]*away;g.push(fmt(r0[k]*away)+' '+NM[k])}if(g.length)log('Away '+Math.round(away/60)+' min. Earned '+g.join(', ')+'.')}
$('reset').onclick=function(){if(confirm('Wipe all progress?')){try{localStorage.removeItem(KEY);localStorage.removeItem(OLD)}catch(e){}S=fresh();$('log').innerHTML='';log('Save wiped. Starting over.');render()}};
document.addEventListener('visibilitychange',function(){if(document.hidden)save();else last=Date.now()});
(function(){var c=$('rain'),x=c.getContext('2d'),w,h,cols,d=[],ch='01<>/{}#$%&';
w=c.width=c.clientWidth||300;h=c.height=c.clientHeight||40;cols=Math.ceil(w/10);for(var i=0;i<cols;i++)d.push(Math.random()*h/10);
function step(){x.fillStyle='rgba(2,6,4,.2)';x.fillRect(0,0,w,h);x.fillStyle='#39ff88';x.font='10px monospace';for(var i=0;i<cols;i++){x.fillText(ch[Math.floor(Math.random()*ch.length)],i*10,d[i]*10);if(d[i]*10>h&&Math.random()>.95)d[i]=0;d[i]++}}
if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches){for(var k=0;k<20;k++)step()}else setInterval(step,90);
})();
show('hq');setInterval(tick,100);
</script>
</body>
</html>
